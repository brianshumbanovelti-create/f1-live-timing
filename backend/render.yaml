# Render Blueprint — lets Render auto-configure this service instead of
# manually filling in build/start commands in the dashboard.
#
# To use: in Render, choose "New +" -> "Blueprint", point it at this repo.
# Render will detect this file and configure everything below automatically.
#
# If you'd rather configure manually via "New +" -> "Web Service" instead:
#   Root Directory:   backend
#   Build Command:    pip install -r requirements.txt
#   Start Command:    gunicorn app:app
#   Plan:              Free

services:
  - type: web
    name: f1-app-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
