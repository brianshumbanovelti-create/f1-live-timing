<body>
  <div class="app">
    <header>
      <h1>F1<span>Debrief</span></h1>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="order">Order</button>
      <button class="tab" data-tab="insights">Insights</button>
      <button class="tab" data-tab="duels">Duels</button>
    </nav>

    <div class="selectors">
      <select id="yearSelect" aria-label="Year"></select>
      <select id="meetingSelect" aria-label="Grand Prix" disabled>
        <option value="">Grand Prix</option>
      </select>
      <select id="sessionSelect" aria-label="Session" disabled>
        <option value="">Session</option>
      </select>
    </div>

    <div id="content">
      <div class="empty">Select a year, Grand Prix and session to begin</div>
    </div>
  </div>

  <script>
    const API = "https://api.openf1.org/v1";
    const CURRENT_YEAR = new Date().getFullYear();

    // State
    let state = {
      year: null,
      meetingKey: null,
      sessionKey: null,
      tab: "order",
      subview: null,          // driver_number or null
      selectedDrivers: new Set(),
      data: null              // { drivers, results, stints, weather, laps, carCache }
    };

    // DOM
    const yearSelect = document.getElementById("yearSelect");
    const meetingSelect = document.getElementById("meetingSelect");
    const sessionSelect = document.getElementById("sessionSelect");
    const content = document.getElementById("content");
    const tabs = document.querySelectorAll(".tab");

    // ---------- Helpers ----------
    async function fetchJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`API ${res.status}`);
      return res.json();
    }

    function fmtTime(sec) {
      if (sec == null || isNaN(sec)) return "—";
      if (Array.isArray(sec)) return sec.map(s => fmtTime(s)).join(" / ");
      if (sec > 3600) {
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = (sec % 60).toFixed(3);
        return `${h}:${String(m).padStart(2,"0")}:${s.padStart(6,"0")}`;
      }
      if (sec > 60) {
        const m = Math.floor(sec / 60);
        const s = (sec % 60).toFixed(3);
        return `${m}:${s.padStart(6,"0")}`;
      }
      return sec.toFixed(3) + "s";
    }

    function downsample(arr, max = 280) {
      if (!arr || arr.length <= max) return arr || [];
      const step = Math.ceil(arr.length / max);
      return arr.filter((_, i) => i % step === 0);
    }

    function teamColor(hex) {
      return hex ? `#${hex}` : "#555";
    }

    function getDriver(num) {
      return (state.data?.drivers || []).find(d => d.driver_number === num) || {};
    }

    // ---------- Init selectors ----------
    function initYears() {
      yearSelect.innerHTML = '<option value="">Year</option>';
      for (let y = CURRENT_YEAR; y >= 2023; y--) {
        const opt = document.createElement("option");
        opt.value = y;
        opt.textContent = y;
        yearSelect.appendChild(opt);
      }
    }

    yearSelect.addEventListener("change", async () => {
      state.year = yearSelect.value ? +yearSelect.value : null;
      state.meetingKey = null;
      state.sessionKey = null;
      state.data = null;
      state.subview = null;
      state.selectedDrivers.clear();
      meetingSelect.innerHTML = '<option value="">Loading…</option>';
      meetingSelect.disabled = true;
      sessionSelect.innerHTML = '<option value="">Session</option>';
      sessionSelect.disabled = true;
      render();
      if (!state.year) return;
      try {
        const meetings = await fetchJSON(`${API}/meetings?year=${state.year}`);
        meetings.sort((a, b) => new Date(a.date_start) - new Date(b.date_start));
        meetingSelect.innerHTML = '<option value="">Grand Prix</option>';
        meetings.forEach(m => {
          const opt = document.createElement("option");
          opt.value = m.meeting_key;
          opt.textContent = m.meeting_name || m.circuit_short_name || m.country_name;
          meetingSelect.appendChild(opt);
        });
        meetingSelect.disabled = false;
      } catch (e) {
        meetingSelect.innerHTML = '<option value="">Error loading</option>';
      }
    });

    meetingSelect.addEventListener("change", async () => {
      state.meetingKey = meetingSelect.value ? +meetingSelect.value : null;
      state.sessionKey = null;
      state.data = null;
      state.subview = null;
      state.selectedDrivers.clear();
      sessionSelect.innerHTML = '<option value="">Loading…</option>';
      sessionSelect.disabled = true;
      render();
      if (!state.meetingKey) return;
      try {
        const sessions = await fetchJSON(`${API}/sessions?meeting_key=${state.meetingKey}`);
        sessions.sort((a, b) => new Date(a.date_start) - new Date(b.date_start));
        sessionSelect.innerHTML = '<option value="">Session</option>';
        sessions.forEach(s => {
          const opt = document.createElement("option");
          opt.value = s.session_key;
          opt.textContent = s.session_name || s.session_type;
          sessionSelect.appendChild(opt);
        });
        sessionSelect.disabled = false;
      } catch (e) {
        sessionSelect.innerHTML = '<option value="">Error loading</option>';
      }
    });

    sessionSelect.addEventListener("change", async () => {
      state.sessionKey = sessionSelect.value ? +sessionSelect.value : null;
      state.data = null;
      state.subview = null;
      state.selectedDrivers.clear();
      render();
      if (!state.sessionKey) return;
      await loadSessionData();
    });

    // ---------- Load core session data (light) ----------
    async function loadSessionData() {
      content.innerHTML = '<div class="loading">Loading session data…</div>';
      try {
        const [drivers, results, stints, weather] = await Promise.all([
          fetchJSON(`${API}/drivers?session_key=${state.sessionKey}`),
          fetchJSON(`${API}/session_result?session_key=${state.sessionKey}`),
          fetchJSON(`${API}/stints?session_key=${state.sessionKey}`),
          fetchJSON(`${API}/weather?session_key=${state.sessionKey}`).catch(() => [])
        ]);
        // Sort results by position
        results.sort((a, b) => (a.position || 99) - (b.position || 99));
        state.data = {
          drivers,
          results,
          stints,
          weather,
          laps: {},          // driver_number -> laps[]
          allLaps: null,     // full set when needed
          carCache: {}       // driver_number -> downsampled car_data
        };
        render();
      } catch (e) {
        content.innerHTML = `<div class="error">Failed to load session data.<br>${e.message}</div>`;
      }
    }

    // ---------- Tabs ----------
    tabs.forEach(btn => {
      btn.addEventListener("click", () => {
        tabs.forEach(t => t.classList.remove("active"));
        btn.classList.add("active");
        state.tab = btn.dataset.tab;
        state.subview = null;
        render();
      });
    });

    // ---------- Render ----------
    function render() {
      if (!state.sessionKey || !state.data) {
        if (!state.sessionKey) {
          content.innerHTML = '<div class="empty">Select a year, Grand Prix and session to begin</div>';
        }
        return;
      }
      if (state.subview) {
        renderDriverLaps(state.subview);
        return;
      }
      if (state.tab === "order") renderOrder();
      else if (state.tab === "insights") renderInsights();
      else if (state.tab === "duels") renderDuels();
    }

    // ===== ORDER =====
    function renderOrder() {
      const { results, drivers } = state.data;
      if (!results.length) {
        content.innerHTML = '<div class="empty">No classification data available for this session</div>';
        return;
      }
      let html = `<table class="order-table"><thead><tr>
        <th>Pos</th><th>Driver</th><th>Time / Gap</th><th></th>
      </tr></thead><tbody>`;
      results.forEach(r => {
        const d = getDriver(r.driver_number);
        const name = d.name_acronym || d.broadcast_name || `#${r.driver_number}`;
        const team = d.team_name || "";
        const color = teamColor(d.team_colour);
        let timeStr = "—";
        if (r.duration != null) timeStr = fmtTime(r.duration);
        if (r.gap_to_leader != null && r.position !== 1) {
          const gap = Array.isArray(r.gap_to_leader) ? r.gap_to_leader[r.gap_to_leader.length-1] : r.gap_to_leader;
          if (typeof gap === "string") timeStr = gap;
          else if (gap != null) timeStr = "+" + fmtTime(gap);
        }
        let status = "";
        if (r.dnf) status = '<span class="status-badge dnf">DNF</span>';
        else if (r.dsq) status = '<span class="status-badge dsq">DSQ</span>';
        else if (r.dns) status = '<span class="status-badge">DNS</span>';

        html += `<tr data-driver="${r.driver_number}">
          <td class="pos">${r.position ?? "—"}</td>
          <td><div class="driver-cell">
            <div class="team-dot" style="background:${color}"></div>
            <div>
              <div class="driver-name">${name}</div>
              <div class="team-name">${team}</div>
            </div>
          </div></td>
          <td class="time-cell">${timeStr}</td>
          <td>${status}</td>
        </tr>`;
      });
      html += "</tbody></table>";
      content.innerHTML = html;

      content.querySelectorAll("tr[data-driver]").forEach(row => {
        row.addEventListener("click", () => {
          state.subview = +row.dataset.driver;
          render();
        });
      });
    }

    // ===== DRIVER LAPS SUBVIEW =====
    async function renderDriverLaps(driverNumber) {
      const d = getDriver(driverNumber);
      const name = d.full_name || d.broadcast_name || `#${driverNumber}`;
      content.innerHTML = `<div class="subview-header">
        <button class="back-btn" id="backBtn">← Back</button>
        <div class="subview-title">${name}</div>
      </div>
      <div class="loading">Loading laps…</div>`;

      document.getElementById("backBtn").onclick = () => {
        state.subview = null;
        render();
      };

      try {
        if (!state.data.laps[driverNumber]) {
          const laps = await fetchJSON(`${API}/laps?session_key=${state.sessionKey}&driver_number=${driverNumber}`);
          laps.sort((a, b) => (a.lap_number || 0) - (b.lap_number || 0));
          state.data.laps[driverNumber] = laps;
        }
        const laps = state.data.laps[driverNumber];
        const stints = (state.data.stints || []).filter(s => s.driver_number === driverNumber)
          .sort((a, b) => (a.stint_number || 0) - (b.stint_number || 0));

        // Map lap -> compound
        const lapCompound = {};
        stints.forEach(s => {
          const start = s.lap_start || 1;
          const end = s.lap_end || 999;
          for (let i = start; i <= end; i++) lapCompound[i] = s.compound || "—";
        });

        if (!laps.length) {
          content.querySelector(".loading").outerHTML = '<div class="empty">No lap data</div>';
          return;
        }

        let html = `<table class="laps-table"><thead><tr>
          <th>Lap</th><th>Time</th><th>S1</th><th>S2</th><th>S3</th><th>Tyre</th>
        </tr></thead><tbody>`;
        laps.forEach(l => {
          const compound = lapCompound[l.lap_number] || "—";
          html += `<tr>
            <td>${l.lap_number ?? "—"}</td>
            <td>${fmtTime(l.lap_duration)}</td>
            <td>${fmtTime(l.duration_sector_1)}</td>
            <td>${fmtTime(l.duration_sector_2)}</td>
            <td>${fmtTime(l.duration_sector_3)}</td>
            <td><span class="compound ${compound}">${compound}</span></td>
          </tr>`;
        });
        html += "</tbody></table>";
        content.querySelector(".loading").outerHTML = html;
      } catch (e) {
        content.querySelector(".loading").outerHTML = `<div class="error">Failed to load laps<br>${e.message}</div>`;
      }
    }

    // ===== INSIGHTS =====
    async function renderInsights() {
      content.innerHTML = '<div class="loading">Building insights…</div>';
      const { results, stints, weather, drivers } = state.data;

      // Load all laps once if not present (needed for pace analysis)
      if (!state.data.allLaps) {
        try {
          const all = await fetchJSON(`${API}/laps?session_key=${state.sessionKey}`);
          state.data.allLaps = all;
        } catch {
          state.data.allLaps = [];
        }
      }
      const allLaps = state.data.allLaps || [];

      // --- Compute insights ---
      // Fastest lap overall
      let fastest = null;
      allLaps.forEach(l => {
        if (l.lap_duration && (!fastest || l.lap_duration < fastest.lap_duration)) {
          fastest = l;
        }
      });

      // Best sectors
      const bestS = [null, null, null];
      allLaps.forEach(l => {
        [l.duration_sector_1, l.duration_sector_2, l.duration_sector_3].forEach((s, i) => {
          if (s && (!bestS[i] || s < bestS[i].time)) {
            bestS[i] = { time: s, driver: l.driver_number, lap: l.lap_number };
          }
        });
      });

      // Consistency: stddev of flying laps (exclude pit outs roughly)
      const driverPace = {};
      allLaps.forEach(l => {
        if (!l.lap_duration || l.is_pit_out_lap) return;
        if (!driverPace[l.driver_number]) driverPace[l.driver_number] = [];
        driverPace[l.driver_number].push(l.lap_duration);
      });
      const consistency = Object.entries(driverPace).map(([num, times]) => {
        if (times.length < 3) return null;
        const mean = times.reduce((a, b) => a + b, 0) / times.length;
        const variance = times.reduce((a, b) => a + (b - mean) ** 2, 0) / times.length;
        return { num: +num, std: Math.sqrt(variance), mean, count: times.length };
      }).filter(Boolean).sort((a, b) => a.std - b.std);

      // Tyre strategies
      const strategies = {};
      (stints || []).forEach(s => {
        if (!strategies[s.driver_number]) strategies[s.driver_number] = [];
        strategies[s.driver_number].push(s);
      });
      Object.values(strategies).forEach(arr => arr.sort((a, b) => (a.stint_number || 0) - (b.stint_number || 0)));

      // Weather summary
      let weatherSummary = "No weather data";
      if (weather && weather.length) {
        const last = weather[weather.length - 1];
        const temps = weather.map(w => w.track_temperature).filter(t => t != null);
        const airs = weather.map(w => w.air_temperature).filter(t => t != null);
        const rains = weather.filter(w => w.rainfall > 0).length;
        weatherSummary = `Track ${last.track_temperature ?? "—"}°C · Air ${last.air_temperature ?? "—"}°C`;
        if (temps.length) {
          const minT = Math.min(...temps).toFixed(1);
          const maxT = Math.max(...temps).toFixed(1);
          weatherSummary += ` (track ${minT}–${maxT}°C)`;
        }
        if (rains) weatherSummary += ` · Rain samples: ${rains}`;
      }

      // Results summary
      const winner = results[0];
      const dnfCount = results.filter(r => r.dnf).length;
      const finisherCount = results.filter(r => !r.dnf && !r.dns && !r.dsq).length;

      // Build HTML
      let html = '<div class="insights-grid">';

      // Classification card
      html += `<div class="card"><h3>Classification</h3>`;
      if (winner) {
        const wd = getDriver(winner.driver_number);
        html += `<div class="stat-row"><span class="stat-label">Winner</span><span class="stat-value">${wd.name_acronym || wd.broadcast_name || "#" + winner.driver_number}</span></div>`;
        html += `<div class="stat-row"><span class="stat-label">Time</span><span class="stat-value">${fmtTime(winner.duration)}</span></div>`;
      }
      html += `<div class="stat-row"><span class="stat-label">Classified</span><span class="stat-value">${finisherCount}</span></div>`;
      html += `<div class="stat-row"><span class="stat-label">DNF / DSQ</span><span class="stat-value">${dnfCount} / ${results.filter(r=>r.dsq).length}</span></div>`;
      html += `</div>`;

      // Fastest
      html += `<div class="card"><h3>Fastest Lap & Sectors</h3>`;
      if (fastest) {
        const fd = getDriver(fastest.driver_number);
        html += `<div class="stat-row"><span class="stat-label">Fastest Lap</span><span class="stat-value">${fd.name_acronym || "#"+fastest.driver_number} · ${fmtTime(fastest.lap_duration)} (L${fastest.lap_number})</span></div>`;
      } else {
        html += `<div class="stat-row"><span class="stat-label">Fastest Lap</span><span class="stat-value">—</span></div>`;
      }
      bestS.forEach((b, i) => {
        if (b) {
          const bd = getDriver(b.driver);
          html += `<div class="stat-row"><span class="stat-label">Best S${i+1}</span><span class="stat-value">${bd.name_acronym || "#"+b.driver} · ${fmtTime(b.time)}</span></div>`;
        }
      });
      html += `</div>`;

      // Consistency
      html += `<div class="card"><h3>Most Consistent (σ of lap times)</h3>`;
      if (consistency.length) {
        consistency.slice(0, 5).forEach((c, idx) => {
          const cd = getDriver(c.num);
          html += `<div class="stat-row"><span class="stat-label">${idx+1}. ${cd.name_acronym || "#"+c.num}</span><span class="stat-value">σ ${c.std.toFixed(3)}s (${c.count} laps)</span></div>`;
        });
      } else {
        html += `<div class="stat-row"><span class="stat-label">Insufficient data</span><span class="stat-value">—</span></div>`;
      }
      html += `</div>`;

      // Weather
      html += `<div class="card"><h3>Weather</h3>
        <div class="stat-row"><span class="stat-value" style="font-weight:500">${weatherSummary}</span></div>
      </div>`;

      // Tyre strategies
      html += `<div class="card" style="grid-column:1/-1"><h3>Tyre Strategies</h3><div class="strategy-list">`;
      const orderedDrivers = results.map(r => r.driver_number);
      orderedDrivers.forEach(num => {
        const st = strategies[num] || [];
        if (!st.length) return;
        const dd = getDriver(num);
        const color = teamColor(dd.team_colour);
        html += `<div class="strategy-item">
          <div class="team-dot" style="background:${color};height:18px"></div>
          <span class="name">${dd.name_acronym || "#"+num}</span>
          <div class="stint-pills">`;
        st.forEach(s => {
          const comp = s.compound || "?";
          const age = s.tyre_age_at_start != null ? ` (${s.tyre_age_at_start})` : "";
          const laps = (s.lap_end && s.lap_start) ? ` L${s.lap_start}-${s.lap_end}` : "";
          html += `<span class="pill compound ${comp}">${comp}${age}${laps}</span>`;
        });
        html += `</div></div>`;
      });
      html += `</div></div>`;

      html += "</div>";
      content.innerHTML = html;
    }

    // ===== DUELS =====
    function renderDuels() {
      const { drivers, results } = state.data;
      // Prefer order from results, fallback to drivers list
      const ordered = results.length
        ? results.map(r => getDriver(r.driver_number)).filter(d => d.driver_number)
        : drivers;

      let html = `<div class="duels-select">`;
      ordered.forEach(d => {
        const num = d.driver_number;
        const selected = state.selectedDrivers.has(num);
        const color = teamColor(d.team_colour);
        html += `<label class="driver-check ${selected ? "selected" : ""}" data-num="${num}">
          <div class="check-box"></div>
          <div class="team-dot" style="background:${color}"></div>
          <div>
            <div class="driver-name">${d.name_acronym || d.broadcast_name || "#"+num}</div>
            <div class="team-name">${d.team_name || ""}</div>
          </div>
        </label>`;
      });
      html += `</div>
        <button class="compare-btn" id="compareBtn" ${state.selectedDrivers.size < 1 || state.selectedDrivers.size > 4 ? "disabled" : ""}>
          Compare ${state.selectedDrivers.size}/4
        </button>
        <div id="duelCharts"></div>
        <p class="note">Telemetry is heavily downsampled to keep data usage low. Full session only.</p>`;

      content.innerHTML = html;

      // Toggle selection
      content.querySelectorAll(".driver-check").forEach(el => {
        el.addEventListener("click", () => {
          const num = +el.dataset.num;
          if (state.selectedDrivers.has(num)) {
            state.selectedDrivers.delete(num);
          } else {
            if (state.selectedDrivers.size >= 4) return;
            state.selectedDrivers.add(num);
          }
          renderDuels(); // re-render to update UI
        });
      });

      document.getElementById("compareBtn")?.addEventListener("click", runDuels);
    }

    async function runDuels() {
      const nums = [...state.selectedDrivers];
      if (nums.length < 1 || nums.length > 4) return;

      const chartsEl = document.getElementById("duelCharts");
      chartsEl.innerHTML = '<div class="loading">Fetching telemetry (this may take a moment)…</div>';

      const colors = ["#e10600", "#00d2be", "#f5ff00", "#9b59b6"];
      const datasets = { speed: [], rpm: [], throttle: [], brake: [] };
      const labelsRef = { current: null };

      try {
        for (let i = 0; i < nums.length; i++) {
          const num = nums[i];
          let points = state.data.carCache[num];
          if (!points) {
            const raw = await fetchJSON(`${API}/car_data?session_key=${state.sessionKey}&driver_number=${num}`);
            // Sort by date just in case
            raw.sort((a, b) => new Date(a.date) - new Date(b.date));
            points = downsample(raw, 260);
            state.data.carCache[num] = points;
          }
          const d = getDriver(num);
          const label = d.name_acronym || `#${num}`;
          const col = colors[i % colors.length];

          // Build relative time axis from first sample of this driver
          const t0 = points.length ? new Date(points[0].date).getTime() : 0;
          const times = points.map(p => ((new Date(p.date).getTime() - t0) / 1000).toFixed(1));

          if (!labelsRef.current) labelsRef.current = times;

          datasets.speed.push({
            label, data: points.map(p => p.speed), borderColor: col, backgroundColor: col + "33",
            borderWidth: 1.5, pointRadius: 0, tension: 0.1
          });
          datasets.rpm.push({
            label, data: points.map(p => p.rpm), borderColor: col, backgroundColor: col + "33",
            borderWidth: 1.5, pointRadius: 0, tension: 0.1
          });
          datasets.throttle.push({
            label, data: points.map(p => p.throttle), borderColor: col, backgroundColor: col + "33",
            borderWidth: 1.5, pointRadius: 0, tension: 0.1
          });
          datasets.brake.push({
            label, data: points.map(p => p.brake), borderColor: col, backgroundColor: col + "33",
            borderWidth: 1.5, pointRadius: 0, tension: 0.1
          });
        }

        // Use the longest time axis or first one
        const labels = labelsRef.current || [];

        chartsEl.innerHTML = `
          <div class="chart-box"><h4>Speed (km/h)</h4><div class="chart-wrap"><canvas id="chartSpeed"></canvas></div></div>
          <div class="chart-box"><h4>RPM</h4><div class="chart-wrap"><canvas id="chartRpm"></canvas></div></div>
          <div class="chart-box"><h4>Throttle (%)</h4><div class="chart-wrap"><canvas id="chartThrottle"></canvas></div></div>
          <div class="chart-box"><h4>Brake</h4><div class="chart-wrap"><canvas id="chartBrake"></canvas></div></div>
        `;

        const commonOpts = {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          plugins: {
            legend: { labels: { color: "#ccc", boxWidth: 12, font: { size: 11 } } }
          },
          scales: {
            x: {
              display: false,
              ticks: { color: "#666", maxTicksLimit: 8 }
            },
            y: {
              ticks: { color: "#888", font: { size: 10 } },
              grid: { color: "#222" }
            }
          },
          elements: { line: { borderJoinStyle: "round" } }
        };

        new Chart(document.getElementById("chartSpeed"), {
          type: "line",
          data: { labels, datasets: datasets.speed },
          options: commonOpts
        });
        new Chart(document.getElementById("chartRpm"), {
          type: "line",
          data: { labels, datasets: datasets.rpm },
          options: commonOpts
        });
        new Chart(document.getElementById("chartThrottle"), {
          type: "line",
          data: { labels, datasets: datasets.throttle },
          options: { ...commonOpts, scales: { ...commonOpts.scales, y: { ...commonOpts.scales.y, min: 0, max: 105 } } }
        });
        new Chart(document.getElementById("chartBrake"), {
          type: "line",
          data: { labels, datasets: datasets.brake },
          options: { ...commonOpts, scales: { ...commonOpts.scales, y: { ...commonOpts.scales.y, min: 0, max: 105 } } }
        });

      } catch (e) {
        chartsEl.innerHTML = `<div class="error">Failed to load telemetry.<br>${e.message}<br>Try fewer drivers or a different session.</div>`;
      }
    }

    // Boot
    initYears();
    render();
  </script>
</body>
</html>
