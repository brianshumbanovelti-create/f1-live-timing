<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Timing — Chronological Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#e10600;--purple:#a855f7;--green:#22c55e;--yellow:#eab308;
  --blue:#60a5fa;--orange:#f97316;
  --bg0:#080808;--bg1:#0f0f0f;--bg2:#161616;--bg3:#1e1e1e;
  --line:#242424;--muted:#555;--dim:#888;--text:#e8e8e8;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg0);color:var(--text);font-family:var(--sans);font-size:13px;display:flex;flex-direction:column}

header{background:var(--bg1);border-bottom:1px solid var(--line);padding:8px 12px;flex-shrink:0;z-index:20}
.header-top{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.brand{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--red);letter-spacing:1px;flex-shrink:0}
.tabs{display:flex;gap:2px;background:var(--bg3);border-radius:5px;padding:2px;flex-shrink:0}
.tab-btn{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:0.5px;padding:4px 9px;border:none;background:none;color:var(--dim);cursor:pointer;border-radius:3px;transition:all 0.15s;white-space:nowrap}
.tab-btn.active{background:var(--bg1);color:var(--text);border:1px solid var(--line)}
.selectors{display:flex;align-items:center;gap:5px;flex:1;flex-wrap:nowrap;overflow:hidden}
select{background:var(--bg3);color:var(--text);border:1px solid var(--line);padding:4px 20px 4px 7px;border-radius:4px;font-family:var(--sans);font-size:10px;cursor:pointer;outline:none;appearance:none;min-width:0;flex:1}
select:focus{border-color:var(--red)}
#yearSelect{flex:0 0 58px;min-width:58px}
.session-timer{font-family:var(--mono);font-size:9px;color:var(--dim);white-space:nowrap;padding:3px 12px 0;display:block}
.session-timer.live{color:var(--green)}
.session-timer.soon{color:var(--yellow)}
.session-timer.done{color:var(--muted)}

.weather-strip{background:var(--bg0);border-bottom:1px solid var(--line);padding:4px 12px;display:flex;align-items:center;gap:12px;flex-shrink:0;min-height:24px;overflow-x:auto}
.wx-item{font-family:var(--mono);font-size:9px;color:var(--muted);display:flex;align-items:center;gap:3px;white-space:nowrap;flex-shrink:0}
.wx-item span{color:var(--dim)}
.rc-bar{background:var(--bg1);border-bottom:1px solid var(--line);padding:4px 12px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;gap:7px;min-height:26px}
.rc-flag{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.rc-text{font-family:var(--mono);font-size:9px;color:var(--yellow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.chequered-banner{display:none;align-items:center;justify-content:center;gap:8px;padding:5px 12px;background:repeating-linear-gradient(45deg,#111 0,#111 8px,#222 8px,#222 16px);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;flex-shrink:0}
.chequered-banner.show{display:flex}

.main-area{flex:1;overflow:hidden;display:flex;flex-direction:column}
.tab-panel{display:none;flex:1;overflow:hidden;flex-direction:column}
.tab-panel.active{display:flex}

/* feed sub-tabs */
.feed-subtabs{display:flex;gap:2px;background:var(--bg2);border-bottom:1px solid var(--line);padding:5px 12px}
.feed-subtab{font-family:var(--mono);font-size:9px;font-weight:600;padding:4px 10px;border:none;background:var(--bg3);color:var(--dim);cursor:pointer;border-radius:3px;white-space:nowrap}
.feed-subtab.active{background:var(--red);color:#fff}
.feed-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.feed-inner{display:flex;flex-direction:column}
.feed-entry{display:flex;align-items:flex-start;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10px}
.feed-time{font-family:var(--mono);font-size:9px;color:var(--muted);flex-shrink:0;min-width:48px}
.feed-bar{width:3px;border-radius:2px;flex-shrink:0;align-self:stretch;min-height:16px}
.feed-text{color:var(--dim);flex:1;line-height:1.5}
.feed-text b{color:var(--text)}
.feed-entry.c-incident .feed-bar{background:var(--red)}
.feed-entry.c-strategy .feed-bar{background:var(--yellow)}
.feed-entry.c-fastest .feed-bar{background:var(--purple)}
.feed-entry.c-lap .feed-bar{background:var(--line)}
.feed-entry.c-info .feed-bar{background:var(--blue)}
.feed-entry.c-sc .feed-bar{background:var(--orange)}
.feed-placeholder{padding:40px 20px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px}

/* timing panel (condensed) */
.timing-scroll{flex:1;overflow-y:auto}
.col-header{display:grid;grid-template-columns:32px 48px 1fr 72px 38px 62px 68px;padding:5px 10px 5px 12px;border-bottom:1px solid var(--line);font-size:9px;font-family:var(--mono);color:var(--muted);position:sticky;top:0;background:var(--bg1);z-index:5}
.driver-row{border-bottom:1px solid var(--line);cursor:pointer}
.driver-row:hover{background:var(--bg1)}
.row-main{display:grid;grid-template-columns:32px 48px 1fr 72px 38px 62px 68px;padding:7px 10px 3px 12px;gap:4px;align-items:center}
.pos{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--red)}
.pos.p1{color:var(--yellow)}
.team-bar{width:3px;height:16px;border-radius:2px}
.acronym{font-family:var(--mono);font-size:13px;font-weight:700}
.gap-leader{font-family:var(--mono);font-size:11px;color:var(--dim)}
.lap-cell{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right}
.tyre-col{display:flex;flex-direction:column;align-items:center}
.tyre-icon{width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;border:2px solid currentColor}
.tyre-age-col{font-family:var(--mono);font-size:8px}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:100;overflow-y:auto;padding:16px}
.modal-backdrop.open{display:flex;align-items:flex-start;justify-content:center}
.modal-box{background:var(--bg1);border:1px solid var(--line);border-top:2px solid var(--red);border-radius:10px;width:100%;max-width:560px;margin-top:16px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.modal-close{background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer}
.modal-body{padding:12px 16px;max-height:70vh;overflow-y:auto}
.rc-entry{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid #111;font-family:var(--mono);font-size:10px}
.rc-time{color:var(--muted);min-width:48px}
.rc-dot{width:7px;height:7px;border-radius:50%;margin-top:3px}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <span class="brand">F1</span>
    <div class="tabs">
      <button class="tab-btn active" id="tabTiming" onclick="switchTab('timing')">TIMING</button>
      <button class="tab-btn" id="tabFeed" onclick="switchTab('feed')">FEED</button>
    </div>
    <div class="selectors">
      <select id="yearSelect"><option value="2026" selected>2026</option><option value="2025">2025</option><option value="2024">2024</option><option value="2023">2023</option></select>
      <select id="meetingSelect"><option value="">— GP —</option></select>
      <select id="sessionSelect"><option value="">— Session —</option></select>
    </div>
  </div>
  <span class="session-timer" id="sessionTimer"></span>
</header>

<div class="weather-strip" id="weatherStrip"></div>
<div class="rc-bar" id="rcBar" onclick="openRCModal()">
  <div class="rc-flag" id="rcFlagDot" style="background:var(--muted)"></div>
  <span class="rc-text" id="rcText">No messages</span>
</div>
<div class="chequered-banner" id="chequeredBanner">🏁 SESSION ENDED 🏁</div>

<div class="main-area">
  <div class="tab-panel active" id="panelTiming">
    <div class="timing-scroll">
      <div class="col-header"><span>POS</span><span>DRV</span><span></span><span>GAP</span><span style="text-align:center">TYR</span><span style="text-align:right">LAST</span><span style="text-align:right">BEST</span></div>
      <div id="driverList"><div class="placeholder">SELECT A GP</div></div>
    </div>
  </div>

  <div class="tab-panel" id="panelFeed">
    <div class="feed-subtabs">
      <button class="feed-subtab active" data-feed="all">ALL</button>
      <button class="feed-subtab" data-feed="track">TRACK</button>
      <button class="feed-subtab" data-feed="racectrl">RACE CTRL</button>
    </div>
    <div class="feed-scroll" id="feedScroll"><div class="feed-placeholder">FEED WILL APPEAR</div></div>
  </div>
</div>

<!-- RC Modal -->
<div class="modal-backdrop" id="rcModal"><div class="modal-box"><div class="modal-head"><span class="modal-title">RACE CONTROL</span><button class="modal-close" onclick="closeModal('rcModal')">✕</button></div><div class="modal-body" id="rcModalBody"></div></div></div>
<!-- Lap Modal -->
<div class="modal-backdrop" id="lapModal"><div class="modal-box"><div class="modal-head"><span class="modal-title" id="lapModalTitle">Lap History</span><button class="modal-close" onclick="closeModal('lapModal')">✕</button></div><div class="modal-body" id="lapModalBody"></div></div></div>

<script>
// ---------- STATE ----------
let sessionKey=null, sessionType='', pollTimer=null, timerInterval=null, sessionEnd=null, sessionStart=null;
let driverMeta=new Map(), positionOrder=[];
let overallBestLap=Infinity, overallBestDriver=null;
let allRCMessages=[], activeYellowSectors=new Set();
let lastTickTime=null;
let cachedLaps=new Map();
let pollInterval=5000;
let latestPos=new Map(), latestIv=new Map();

// Feed state
let rawFeedEvents=[];       // {timestamp, text, category, source}  source: 'track' or 'racectrl'
let lastKnownPositions=new Map();
let lastKnownLapNum=0;
let processedLaps=new Set();
let processedPits=new Set();
let lastLapTimes=new Map();
let currentFastestLap=null;
let currentFeedSubtab='all';

// Helper functions
async function api(endpoint){
  try{const r=await fetch(`https://api.openf1.org/v1/${endpoint}`);if(!r.ok)return[];return await r.json();}catch{return[];}
}
function fmtTime(s){if(!s||s<=0)return'—';const m=Math.floor(s/60),sec=(s%60).toFixed(3);return m>0?`${m}:${sec.padStart(6,'0')}`:`${s.toFixed(3)}`;}
function fmtTimeLabel(iso){if(!iso)return'';try{return new Date(iso).toTimeString().slice(0,5);}catch{return'';}}
function driverTag(dn){const m=driverMeta.get(dn);return m?`<b style="color:${m.teamColor}">${m.acronym}</b>`:`<b>#${dn}</b>`;}
function tyreLetter(c){if(!c)return'?';const u=c.toUpperCase();if(u.includes('SOFT'))return'S';if(u.includes('MED'))return'M';if(u.includes('HARD'))return'H';if(u.includes('INTER'))return'I';if(u.includes('WET'))return'W';return c[0];}
function tyreClass(c){if(!c)return'';const u=c.toUpperCase();if(u.includes('SOFT'))return't-soft';if(u.includes('MED'))return't-med';if(u.includes('HARD'))return't-hard';return'';}
function flagColor(f){if(!f)return'#555';const u=f.toUpperCase();if(u==='RED')return'#e10600';if(u.includes('YELLOW')||u==='SC')return'#eab308';if(u==='GREEN')return'#22c55e';return'#555';}
const TEAM_COLORS={'Red Bull':'#3671C6','Mercedes':'#27F4D2','Ferrari':'#e8002d','McLaren':'#FF8000','Aston Martin':'#229971','Alpine':'#0093CC','Williams':'#64C4FF','Haas':'#B6BABD'};
function teamColor(n){if(!n)return'#444';for(const[k,v]of Object.entries(TEAM_COLORS))if(n.includes(k))return v;return'#444';}

function switchTab(tab){
  document.getElementById('tabTiming').classList.toggle('active',tab==='timing');
  document.getElementById('tabFeed').classList.toggle('active',tab==='feed');
  document.getElementById('panelTiming').classList.toggle('active',tab==='timing');
  document.getElementById('panelFeed').classList.toggle('active',tab==='feed');
  if(tab==='feed') renderFeed();
}

function getCurrentTyre(stints,lapNum){
  if(!stints.length||!lapNum) return {compound:null,age:0};
  let current=null;
  for(const s of stints) if(lapNum>=s.lap_start && lapNum<=(s.lap_end||9999)) {current=s;break;}
  if(!current) current=stints.reduce((a,b)=>a.lap_start>b.lap_start?a:b);
  return {compound:current.compound||null, age:Math.max(1,lapNum-current.lap_start+1)};
}

// ----- feed event add (chronological, timestamped) -----
function addFeedEvent(timestamp, text, category, source){
  if(!text) return;
  const existing = rawFeedEvents.find(e => e.text === text && Math.abs(e.timestamp - timestamp) < 2000);
  if(existing) return;
  rawFeedEvents.push({timestamp, text, category, source});
  rawFeedEvents.sort((a,b)=>a.timestamp - b.timestamp);
  if(activeTab==='feed') renderFeed();
}

// ----- generate streamlined feed (tightened) -----
function generateFeed(laps, latestPos, latestIv, allPitStops, stintMap, raceControl, nowDate){
  const isRace = sessionType.toLowerCase().includes('race');
  const isFP = sessionType.toLowerCase().includes('practice');
  const isQual = sessionType.toLowerCase().includes('qualif');
  if(!isRace && !isFP && !isQual) return;

  const lapsByNumber = new Map();
  for(const lap of laps) { if(!lapsByNumber.has(lap.lap_number)) lapsByNumber.set(lap.lap_number,[]); lapsByNumber.get(lap.lap_number).push(lap); }
  const allLapsByDriver = new Map();
  for(const lap of laps){ const dn=lap.driver_number; if(!allLapsByDriver.has(dn)) allLapsByDriver.set(dn,[]); allLapsByDriver.get(dn).push(lap); }
  const lapNums = [...lapsByNumber.keys()].sort((a,b)=>a-b);

  // ---- LAP START announcement (tight order, only once per lap) ----
  for(const lapNum of lapNums){
    if(processedLaps.has(lapNum)) continue;
    const lapDrivers = lapsByNumber.get(lapNum);
    if(lapDrivers.length < 3) continue;
    processedLaps.add(lapNum);
    if(lapNum > lastKnownLapNum) lastKnownLapNum = lapNum;
    // build position order at start of lap (using latestPos snapshot)
    const posMap = new Map();
    for(const [dn,p] of latestPos) posMap.set(dn, p?.position ?? 99);
    const order = [...posMap.entries()].sort((a,b)=>a[1]-b[1]).slice(0,10).map(([dn])=>driverTag(dn)).join(', ');
    const timestamp = nowDate ? nowDate.getTime() - (lastKnownLapNum - lapNum)*60000 + 5000 : Date.now();
    addFeedEvent(timestamp, `🏁 START OF LAP ${lapNum} — Order: ${order}`, 'c-lap', 'track');
  }

  // ---- RACE CONTROL messages (source: racectrl) ----
  for(const msg of raceControl){
    const ts = new Date(msg.date).getTime();
    const msgText = msg.message || '';
    if(!msgText) continue;
    const flagEmoji = msg.flag==='RED'?'🔴':msg.flag==='SC'?'🚨':msg.flag==='YELLOW'?'⚠️':'';
    addFeedEvent(ts, `${flagEmoji} ${msgText}`, 'c-info', 'racectrl');
  }

  // ---- OVERTAKES / POSITION CHANGES (only meaningful, not every lap) ----
  if(isRace){
    for(const lapNum of lapNums.slice(-3)){ // check recent laps
      const posNow = new Map();
      for(const [dn,p] of latestPos) posNow.set(dn, p?.position ?? 99);
      for(const [dn, newPos] of posNow){
        const oldPos = lastKnownPositions.get(dn);
        if(oldPos && newPos < oldPos && newPos <=10){
          const gained = oldPos - newPos;
          addFeedEvent(nowDate?.getTime() || Date.now(), `${driverTag(dn)} +${gained} to P${newPos}`, 'c-info', 'track');
        }
      }
      for(const [dn,pos] of posNow) lastKnownPositions.set(dn, pos);
    }
  }

  // ---- FASTEST LAP (only new record) ----
  for(const lap of laps){
    if(lap.lap_duration && lap.lap_duration>0){
      if(!currentFastestLap || lap.lap_duration < currentFastestLap.duration){
        currentFastestLap = {dn:lap.driver_number, duration:lap.lap_duration, lap:lap.lap_number};
        const ts = new Date(lap.date).getTime() || Date.now();
        addFeedEvent(ts, `⚡ FASTEST LAP — ${driverTag(lap.driver_number)} ${fmtTime(lap.lap_duration)} (Lap ${lap.lap_number})`, 'c-fastest', 'track');
      }
    }
  }

  // ---- PIT STOPS (tightened) ----
  for(const pit of allPitStops){
    const dn = pit.driver_number;
    const pitKey = `pit-${dn}-${pit.pit_in_time}`;
    if(pit.pit_out_time && !processedPits.has(pitKey+'out')){
      const dur = pit.pit_duration ?? pit.stop_duration;
      const durStr = dur ? ` (${parseFloat(dur).toFixed(1)}s)` : '';
      const ts = new Date(pit.pit_out_time).getTime() || Date.now();
      addFeedEvent(ts, `${driverTag(dn)} boxed${durStr}`, 'c-strategy', 'track');
      processedPits.add(pitKey+'out');
    }
  }

  // ---- TYRE DEGRADATION / STRATEGY (tight, only significant) ----
  if(isRace){
    for(const [dn, driverLaps] of allLapsByDriver){
      const recent = driverLaps.filter(l=>l.lap_duration && l.lap_number > lastKnownLapNum-5).sort((a,b)=>a.lap_number-b.lap_number);
      if(recent.length>=4){
        let rising=true;
        for(let i=1;i<recent.length;i++) if(recent[i].lap_duration <= recent[i-1].lap_duration) rising=false;
        if(rising){
          const drop = (recent[recent.length-1].lap_duration - recent[0].lap_duration).toFixed(2);
          if(drop>0.5){
            const ds = stintMap.get(dn)||[];
            const {compound,age}=getCurrentTyre(ds, recent[recent.length-1].lap_number);
            const tyreNote = compound ? ` on ${tyreLetter(compound)} (${age}L)` : '';
            addFeedEvent(Date.now(), `${driverTag(dn)} degrading${tyreNote} — +${drop}s over 4 laps`, 'c-strategy', 'track');
          }
        }
      }
    }
  }

  // ---- FREE PRACTICE: long run summary (one per stint, avoid spam) ----
  if(isFP){
    const stintMapFull = new Map();
    const stints = await api(`stints?session_key=${sessionKey}`); // fetch fresh but rate limited
    for(const s of stints){ const dn=s.driver_number; if(!stintMapFull.has(dn)) stintMapFull.set(dn,[]); stintMapFull.get(dn).push(s); }
    for(const [dn, stintsArr] of stintMapFull){
      for(const stint of stintsArr){
        if(stint.lap_end && stint.lap_end - stint.lap_start >= 6){
          const key = `long-${dn}-${stint.lap_start}`;
          if(processedPits.has(key)) continue;
          const driverLaps = (allLapsByDriver.get(dn)||[]).filter(l=>l.lap_duration && l.lap_number>=stint.lap_start && l.lap_number<=stint.lap_end);
          if(driverLaps.length>=5){
            const avg = driverLaps.reduce((a,b)=>a+b.lap_duration,0)/driverLaps.length;
            addFeedEvent(Date.now(), `${driverTag(dn)} long run on ${tyreLetter(stint.compound)} — avg ${fmtTime(avg)} (${driverLaps.length} laps)`, 'c-strategy', 'track');
            processedPits.add(key);
          }
        }
      }
    }
  }

  // ---- QUALIFYING: elimination / pole (tight) ----
  if(isQual){
    const bestPerDriver = new Map();
    for(const lap of laps) if(lap.lap_duration) bestPerDriver.set(lap.driver_number, Math.min(bestPerDriver.get(lap.driver_number)||Infinity, lap.lap_duration));
    const sorted = [...bestPerDriver.entries()].sort((a,b)=>a[1]-b[1]);
    if(sorted.length && overallBestDriver && sorted[0][0] === overallBestDriver && !processedPits.has('pole-msg')){
      addFeedEvent(Date.now(), `🏆 POLE — ${driverTag(overallBestDriver)} ${fmtTime(overallBestLap)}`, 'c-fastest', 'track');
      processedPits.add('pole-msg');
    }
    const elimThreshold = 16;
    const positionsNow = [...latestPos.values()].filter(p=>p.position).sort((a,b)=>a.position-b.position);
    for(const p of positionsNow){
      if(p.position === elimThreshold && !processedPits.has(`elim-${sessionKey}`)){
        addFeedEvent(Date.now(), `⚠️ ELIMINATION ZONE — P${p.position} on the bubble`, 'c-incident', 'track');
        processedPits.add(`elim-${sessionKey}`);
      }
    }
  }
}

// ----- TICK (polling) -----
async function tick(){
  if(!sessionKey) return;
  const now = new Date();
  const dateFilter = lastTickTime ? `&date>${lastTickTime}` : '';
  const [newLaps, intervals, positions, pitStops, raceControl, stints, weather] = await Promise.all([
    api(`laps?session_key=${sessionKey}${lastTickTime ? `&lap_number>=${Math.max(1,lastKnownLapNum-1)}` : ''}`),
    api(`intervals?session_key=${sessionKey}${dateFilter}`),
    api(`position?session_key=${sessionKey}${dateFilter}`),
    api(`pit?session_key=${sessionKey}`),
    api(`race_control?session_key=${sessionKey}`),
    api(`stints?session_key=${sessionKey}`),
    api(`weather?session_key=${sessionKey}${dateFilter}`)
  ]);
  lastTickTime = new Date(now.getTime()-2000).toISOString().replace('Z','+00:00');
  for(const lap of newLaps) cachedLaps.set(`${lap.driver_number}:${lap.lap_number}`, lap);
  const laps = [...cachedLaps.values()].sort((a,b)=>a.lap_number-b.lap_number);
  if(weather.length) document.getElementById('weatherStrip').innerHTML = `<div class="wx-item">🌡 Track ${weather[0].track_temperature??'—'}°C</div><div class="wx-item">💨 Air ${weather[0].air_temperature??'—'}°C</div>`;
  allRCMessages = raceControl;
  if(raceControl.length) { const last=raceControl[raceControl.length-1]; document.getElementById('rcFlagDot').style.background=flagColor(last.flag); document.getElementById('rcText').textContent=last.message||''; }
  const bestLapMap = new Map(), lastLapMap = new Map();
  overallBestLap=Infinity; overallBestDriver=null;
  for(const lap of laps){
    if(lap.lap_duration>0){
      if(!bestLapMap.has(lap.driver_number) || lap.lap_duration<bestLapMap.get(lap.driver_number).duration) bestLapMap.set(lap.driver_number,{duration:lap.lap_duration,lapNum:lap.lap_number});
      if(lap.lap_duration<overallBestLap){ overallBestLap=lap.lap_duration; overallBestDriver=lap.driver_number; }
    }
    lastLapMap.set(lap.driver_number,{duration:lap.lap_duration,lapNum:lap.lap_number});
  }
  const stintMap = new Map();
  for(const s of stints){ const dn=s.driver_number; if(!stintMap.has(dn)) stintMap.set(dn,[]); stintMap.get(dn).push(s); }
  for(const p of positions) if(!latestPos.has(p.driver_number) || new Date(p.date)>new Date(latestPos.get(p.driver_number).date)) latestPos.set(p.driver_number,p);
  for(const iv of intervals) if(!latestIv.has(iv.driver_number) || new Date(iv.date)>new Date(latestIv.get(iv.driver_number).date)) latestIv.set(iv.driver_number,iv);
  const leaderDn = [...latestIv.entries()].find(([,iv])=>iv.gap_to_leader===0||iv.gap_to_leader===null)?.[0] || [...latestPos.entries()].find(([,p])=>p.position===1)?.[0];
  // update timing UI (condensed)
  for(const dn of driverMeta.keys()){
    const pos = latestPos.get(dn)?.position;
    const iv = latestIv.get(dn);
    const best = bestLapMap.get(dn);
    const last = lastLapMap.get(dn);
    const st = stintMap.get(dn)||[];
    const {compound,age}=getCurrentTyre(st, last?.lapNum||0);
    document.getElementById(`pos-${dn}`)?.setAttribute?.('data-content',''); // simplified
    if(document.getElementById(`pos-${dn}`)) document.getElementById(`pos-${dn}`).textContent = pos??'—';
    if(document.getElementById(`gap-${dn}`)) document.getElementById(`gap-${dn}`).textContent = dn===leaderDn ? 'LEADER' : (iv?.gap_to_leader ? `+${iv.gap_to_leader}` : '—');
    if(document.getElementById(`last-${dn}`)) document.getElementById(`last-${dn}`).textContent = last?.duration ? fmtTime(last.duration) : '—';
    if(document.getElementById(`best-${dn}`)) document.getElementById(`best-${dn}`).textContent = best?.duration ? fmtTime(best.duration) : '—';
    const tyreHtml = compound ? `<div class="tyre-icon" style="color:${tyreLetter(compound)==='S'?'#f97316':tyreLetter(compound)==='M'?'#eab308':'#ccc'}">${tyreLetter(compound)}</div><span class="tyre-age-col">${String(age).padStart(2,'0')}</span>` : '<span>—</span>';
    if(document.getElementById(`tyreCol-${dn}`)) document.getElementById(`tyreCol-${dn}`).innerHTML = tyreHtml;
  }
  await generateFeed(laps, latestPos, latestIv, pitStops, stintMap, raceControl, now);
  if(activeTab==='feed') renderFeed();
}

async function onSessionSelected(forceKey){
  const val=forceKey||document.getElementById('sessionSelect').value;
  if(!val) return;
  if(pollTimer) clearInterval(pollTimer);
  sessionKey=parseInt(val);
  driverMeta.clear(); latestPos.clear(); latestIv.clear(); cachedLaps.clear(); rawFeedEvents=[]; processedLaps.clear(); processedPits.clear();
  const [sessionInfo,drivers] = await Promise.all([api(`sessions?session_key=${sessionKey}`), api(`drivers?session_key=${sessionKey}`)]);
  if(sessionInfo[0]){ sessionType=sessionInfo[0].session_name||''; sessionStart=sessionInfo[0].date_start?new Date(sessionInfo[0].date_start):null; sessionEnd=sessionInfo[0].date_end?new Date(sessionInfo[0].date_end):null; }
  for(const d of drivers) driverMeta.set(d.driver_number,{acronym:d.name_acronym||String(d.driver_number), fullName:d.full_name||'', teamColor:teamColor(d.team_name), teamName:d.team_name||''});
  const positions=await api(`position?session_key=${sessionKey}`);
  const orderDiv=document.getElementById('driverList');
  orderDiv.innerHTML='';
  for(const dn of [...driverMeta.keys()]){
    const meta=driverMeta.get(dn);
    const row=document.createElement('div'); row.className='driver-row'; row.onclick=()=>showLapHistory(dn);
    row.innerHTML=`<div class="row-main"><div class="pos-block"><span class="pos" id="pos-${dn}">—</span></div><div class="name-block"><div class="team-bar" style="background:${meta.teamColor}"></div><span class="acronym">${meta.acronym}</span></div><span></span><div class="gap-block"><span class="gap-leader" id="gap-${dn}">—</span></div><div class="tyre-col" id="tyreCol-${dn}"></div><span class="lap-cell" id="last-${dn}">—</span><span class="lap-cell" id="best-${dn}">—</span></div>`;
    orderDiv.appendChild(row);
  }
  await tick();
  pollTimer=setInterval(tick,5000);
}

async function showLapHistory(dn){
  const laps=await api(`laps?session_key=${sessionKey}&driver_number=${dn}`);
  laps.sort((a,b)=>a.lap_number-b.lap_number);
  let rows='';
  for(const lap of laps) rows+=`<tr><td>${lap.lap_number}</td><td>${fmtTime(lap.lap_duration)}</td><td>${lap.duration_sector_1?.toFixed(3)||'—'}</td><td>${lap.duration_sector_2?.toFixed(3)||'—'}</td><td>${lap.duration_sector_3?.toFixed(3)||'—'}</td></tr>`;
  document.getElementById('lapModalBody').innerHTML=`<table class="lap-table"><tr><th>LAP</th><th>TIME</th><th>S1</th><th>S2</th><th>S3</th></tr>${rows||'<tr><td colspan="5">No data</td></tr>'}</table>`;
  document.getElementById('lapModal').classList.add('open');
}

function renderFeed(){
  const container = document.getElementById('feedScroll');
  let filtered = [...rawFeedEvents];
  if(currentFeedSubtab === 'track') filtered = filtered.filter(e => e.source === 'track');
  else if(currentFeedSubtab === 'racectrl') filtered = filtered.filter(e => e.source === 'racectrl');
  if(!filtered.length){ container.innerHTML='<div class="feed-placeholder">No entries</div>'; return; }
  const html = filtered.map(e => `<div class="feed-entry ${e.category}"><span class="feed-time">${new Date(e.timestamp).toTimeString().slice(0,5)}</span><div class="feed-bar"></div><span class="feed-text">${e.text}</span></div>`).join('');
  container.innerHTML = `<div class="feed-inner">${html}</div>`;
  container.scrollTop = container.scrollHeight;
}

function switchFeedSubtab(sub){
  currentFeedSubtab = sub;
  document.querySelectorAll('.feed-subtab').forEach(btn=>btn.classList.toggle('active', btn.getAttribute('data-feed')===sub));
  renderFeed();
}

async function autoLoadCurrent(){
  const year=document.getElementById('yearSelect').value;
  const sessions=await api(`sessions?year=${year}`);
  if(!sessions.length) return;
  const now=new Date();
  let target=sessions.find(s=>new Date(s.date_start)<=now && new Date(s.date_end||'9999')>=now) || sessions.find(s=>new Date(s.date_start)>now) || sessions[sessions.length-1];
  const meetings=await api(`meetings?year=${year}`);
  const mSel=document.getElementById('meetingSelect');
  mSel.innerHTML='<option value="">— GP —</option>';
  for(const m of meetings){ const o=document.createElement('option'); o.value=m.meeting_key; o.textContent=m.meeting_name; if(m.meeting_key===target.meeting_key) o.selected=true; mSel.appendChild(o); }
  const sSel=document.getElementById('sessionSelect');
  sSel.innerHTML='<option value="">— Session —</option>';
  const meetingSessions=sessions.filter(s=>s.meeting_key===target.meeting_key);
  for(const s of meetingSessions){ const o=document.createElement('option'); o.value=s.session_key; o.textContent=s.session_name; if(s.session_key===target.session_key) o.selected=true; sSel.appendChild(o); }
  await onSessionSelected(target.session_key);
}

function openRCModal(){
  const body=document.getElementById('rcModalBody');
  body.innerHTML = allRCMessages.slice().reverse().map(m=>`<div class="rc-entry"><span class="rc-time">${fmtTimeLabel(m.date)}</span><div class="rc-dot" style="background:${flagColor(m.flag)}"></div><span>${m.message||''}</span></div>`).join('') || '<div>No messages</div>';
  document.getElementById('rcModal').classList.add('open');
}
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

document.getElementById('yearSelect').addEventListener('change',()=>autoLoadCurrent());
document.getElementById('meetingSelect').addEventListener('change',async()=>{ const mk=document.getElementById('meetingSelect').value; if(!mk) return; const sessions=await api(`sessions?meeting_key=${mk}`); const sSel=document.getElementById('sessionSelect'); sSel.innerHTML='<option value="">— Session —</option>'; for(const s of sessions){ const o=document.createElement('option'); o.value=s.session_key; o.textContent=s.session_name; sSel.appendChild(o); } });
document.getElementById('sessionSelect').addEventListener('change',()=>onSessionSelected());
document.querySelectorAll('.feed-subtab').forEach(btn=>btn.addEventListener('click',()=>switchFeedSubtab(btn.getAttribute('data-feed'))));
window.addEventListener('load',()=>autoLoadCurrent());
</script>
</body>
</html>
