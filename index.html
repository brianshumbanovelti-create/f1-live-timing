<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Live Timing - OpenF1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0a0a0a;
            font-family: 'Teko', 'Formula1', 'Roboto Condensed', sans-serif;
            color: #fff;
            padding: 0 12px 40px 12px;
        }
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&display=swap');
        
        .session-bar {
            background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
            border-left: 5px solid #e10600;
            padding: 14px 18px;
            border-radius: 12px;
            margin: 16px 0 20px 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .controls { display: flex; flex-wrap: wrap; gap: 12px; }
        select {
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            padding: 10px 14px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
        }
        .race-control {
            background: #111;
            padding: 10px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            border-left: 3px solid #e10600;
            margin-bottom: 18px;
        }
        .timing-wrapper {
            overflow-x: auto;
            border-radius: 16px;
            background: #0e0e0e;
        }
        .timing-table {
            min-width: 1000px;
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .timing-table th {
            text-align: left;
            padding: 14px 8px;
            background: #121212;
            color: #aaa;
            font-weight: 500;
            border-bottom: 1px solid #2a2a2a;
        }
        .timing-table td {
            padding: 12px 8px;
            border-bottom: 1px solid #222;
        }
        .driver-row { cursor: pointer; }
        .driver-row:hover { background: #1e1e1e; }
        .pos { color: #e10600; font-weight: 700; }
        .penalty-marker { color: #ffaa00; margin-right: 6px; }
        .pit-status {
            background: #e10600;
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: bold;
            display: inline-block;
        }
        .purple { color: #b200ff; font-weight: bold; }
        .green { color: #39b54a; }
        .red { color: #ff4d4d; }
        .mini-dot {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            display: inline-block;
            margin-right: 4px;
        }
        .mini-dot-purple { background-color: #b200ff; }
        .mini-dot-green { background-color: #39b54a; }
        .mini-dot-yellow { background-color: #ffd700; }
        .mini-dot-white { background-color: #888; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            overflow-y: auto;
        }
        .modal-content {
            background: #121212;
            max-width: 95%;
            width: 900px;
            margin: 30px auto;
            border-radius: 20px;
            padding: 20px;
            border-top: 4px solid #e10600;
        }
        .close-modal {
            font-size: 28px;
            cursor: pointer;
            float: right;
            background: none;
            border: none;
            color: white;
        }
        .lap-history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
        }
        .lap-history-table td, .lap-history-table th {
            padding: 8px 5px;
            border-bottom: 1px solid #222;
        }
        .refresh-status { font-size: 0.7rem; background: #1a1a1a; padding: 4px 10px; border-radius: 30px; }
        footer { text-align: center; font-size: 0.7rem; margin-top: 24px; color: #555; }
    </style>
</head>
<body>

<div class="session-bar">
    <div class="session-info">
        <div class="circuit-name" id="circuitName">Select session</div>
        <div class="session-meta">
            <span id="sessionType">—</span>
            <span id="sessionStatus">⚫ Offline</span>
        </div>
    </div>
    <div class="controls">
        <select id="yearSelect">
            <option value="2025">2025</option>
            <option value="2024" selected>2024</option>
            <option value="2023">2023</option>
        </select>
        <select id="sessionSelect">
            <option value="">-- Choose weekend --</option>
        </select>
        <span class="refresh-status" id="refreshIndicator">⏳ Ready</span>
    </div>
</div>

<div class="race-control" id="raceControlMsg">🏁 Select a Grand Prix to start</div>

<div class="timing-wrapper">
    <table class="timing-table" id="timingTable">
        <thead>
            <tr><th>POS</th><th>Driver</th><th>Gap</th><th>Last Lap</th><th>Best Lap</th><th>S1 Δ</th><th>S2 Δ</th><th>S3 Δ</th><th>Mini</th><th>Pit</th></tr>
        </thead>
        <tbody id="timingBody">
            <tr><td colspan="10">Choose a race from the dropdown above</td></tr>
        </tbody>
    </table>
</div>
<footer>Data via OpenF1.org | Updates every 2s | Click any driver</footer>

<div id="driverModal" class="modal">
    <div class="modal-content">
        <button class="close-modal">&times;</button>
        <h2 id="modalDriverName">Driver Details</h2>
        <div id="modalLapsContainer">Loading...</div>
    </div>
</div>

<script>
    let currentSessionKey = null;
    let refreshInterval = null;
    let leaderSectorTimes = { s1: null, s2: null, s3: null };
    let activePenalties = new Set();
    let pitStopFlash = new Map();
    let driverList = [];
    let isLoading = false;

    async function fetchJSON(url) {
        try {
            const res = await fetch(url);
            if (!res.ok) return [];
            return await res.json();
        } catch (err) {
            return [];
        }
    }

    function formatLapTime(seconds) {
        if (!seconds || seconds <= 0) return '—';
        const mins = Math.floor(seconds / 60);
        const secs = (seconds % 60).toFixed(3);
        return mins > 0 ? `${mins}:${secs.padStart(6, '0')}` : `${secs}`;
    }

    function formatDelta(deltaSec) {
        if (deltaSec === null || isNaN(deltaSec)) return '—';
        return deltaSec > 0 ? `+${deltaSec.toFixed(3)}` : `${deltaSec.toFixed(3)}`;
    }

    async function loadSessionsForYear(year) {
        const sessions = await fetchJSON(`https://api.openf1.org/v1/sessions?year=${year}&session_name=Race`);
        if (!sessions.length) return [];
        const unique = new Map();
        for (const s of sessions) {
            if (!unique.has(s.circuit_key) && s.circuit_short_name) {
                unique.set(s.circuit_key, { circuit: s.circuit_short_name, session_key: s.session_key });
            }
        }
        return Array.from(unique.values());
    }

    async function updateWeekendSelect() {
        const year = document.getElementById('yearSelect').value;
        const weekendSelect = document.getElementById('sessionSelect');
        weekendSelect.innerHTML = '<option value="">Loading...</option>';
        const weekends = await loadSessionsForYear(year);
        if (!weekends.length) {
            weekendSelect.innerHTML = '<option value="">No races found</option>';
            return;
        }
        weekendSelect.innerHTML = '<option value="">-- Select Grand Prix --</option>';
        for (const w of weekends) {
            const option = document.createElement('option');
            option.value = w.session_key;
            option.textContent = w.circuit;
            weekendSelect.appendChild(option);
        }
    }

    async function onWeekendSelected() {
        const sessionKey = document.getElementById('sessionSelect').value;
        if (!sessionKey) return;
        
        if (refreshInterval) {
            clearInterval(refreshInterval);
            refreshInterval = null;
        }
        
        currentSessionKey = parseInt(sessionKey);
        
        const sessionInfo = await fetchJSON(`https://api.openf1.org/v1/sessions?session_key=${currentSessionKey}`);
        if (sessionInfo && sessionInfo[0]) {
            document.getElementById('circuitName').innerHTML = sessionInfo[0].circuit_short_name || 'Circuit';
            document.getElementById('sessionType').innerHTML = sessionInfo[0].session_name || 'Race';
            document.getElementById('sessionStatus').innerHTML = '🟢 Live';
        }
        
        await refreshTiming();
        refreshInterval = setInterval(async () => {
            await refreshTiming();
        }, 2000);
    }

    async function fetchDrivers() {
        if (!currentSessionKey) return [];
        const drivers = await fetchJSON(`https://api.openf1.org/v1/drivers?session_key=${currentSessionKey}`);
        driverList = drivers.sort((a,b) => a.position - b.position);
        return driverList;
    }

    async function refreshTiming() {
        if (!currentSessionKey || isLoading) return;
        isLoading = true;
        document.getElementById('refreshIndicator').innerHTML = '🔄 Updating...';
        
        try {
            const [intervals, allLaps, pitData, incidents, raceControl] = await Promise.all([
                fetchJSON(`https://api.openf1.org/v1/intervals?session_key=${currentSessionKey}`),
                fetchJSON(`https://api.openf1.org/v1/laps?session_key=${currentSessionKey}`),
                fetchJSON(`https://api.openf1.org/v1/pit?session_key=${currentSessionKey}`),
                fetchJSON(`https://api.openf1.org/v1/incidents?session_key=${currentSessionKey}`),
                fetchJSON(`https://api.openf1.org/v1/race_control?session_key=${currentSessionKey}`)
            ]);
            
            if (raceControl && raceControl.length) {
                const latest = raceControl[raceControl.length-1];
                document.getElementById('raceControlMsg').innerHTML = `📢 ${latest.message || 'Track clear'}`;
            }
            
            activePenalties.clear();
            for (const inc of incidents) {
                if (inc.category === 'Penalty' && inc.message && !inc.message.toLowerCase().includes('served')) {
                    activePenalties.add(String(inc.driver_number));
                }
            }
            
            const bestLapMap = new Map();
            const lastLapMap = new Map();
            const sectorMap = new Map();
            
            for (const lap of allLaps) {
                const dn = lap.driver_number;
                if (!bestLapMap.has(dn) || lap.lap_duration < bestLapMap.get(dn).duration) {
                    bestLapMap.set(dn, { duration: lap.lap_duration });
                }
                if (!lastLapMap.has(dn) || lap.lap_number > (lastLapMap.get(dn).lapNum || 0)) {
                    lastLapMap.set(dn, { duration: lap.lap_duration, lapNum: lap.lap_number });
                }
                if (lap.duration_sector_1 && lap.duration_sector_2 && lap.duration_sector_3) {
                    sectorMap.set(dn, {
                        s1: lap.duration_sector_1,
                        s2: lap.duration_sector_2,
                        s3: lap.duration_sector_3,
                        seg1: lap.segments_sector_1 || [],
                        seg2: lap.segments_sector_2 || [],
                        seg3: lap.segments_sector_3 || []
                    });
                }
            }
            
            let leaderNumber = null;
            if (intervals.length) {
                const leaderInterval = intervals.find(i => i.gap_to_leader === null || i.gap_to_leader === 0);
                if (leaderInterval) leaderNumber = leaderInterval.driver_number;
                else if (intervals[0]) leaderNumber = intervals[0].driver_number;
            }
            
            if (leaderNumber && sectorMap.has(leaderNumber)) {
                const lsec = sectorMap.get(leaderNumber);
                leaderSectorTimes = { s1: lsec.s1, s2: lsec.s2, s3: lsec.s3 };
            }
            
            const drivers = await fetchDrivers();
            const gapMap = new Map();
            for (const i of intervals) gapMap.set(i.driver_number, { gap: i.gap_to_leader });
            
            const tbody = document.getElementById('timingBody');
            tbody.innerHTML = '';
            
            for (let idx = 0; idx < drivers.length; idx++) {
                const d = drivers[idx];
                const dn = d.driver_number;
                const gapObj = gapMap.get(dn);
                let gapText = idx === 0 ? 'LEADER' : (gapObj && gapObj.gap !== null ? `+${gapObj.gap.toFixed(3)}` : '—');
                
                let pitHtml = '';
                const latestPit = pitData.filter(p => p.driver_number === dn).sort((a,b) => new Date(b.pit_in_time) - new Date(a.pit_in_time))[0];
                if (latestPit && latestPit.pit_in_time && !latestPit.pit_out_time) {
                    pitHtml = '<span class="pit-status">PIT</span>';
                } else if (latestPit && latestPit.pit_out_time && pitStopFlash.has(dn)) {
                    pitHtml = `<span class="pit-status">${pitStopFlash.get(dn)}s</span>`;
                } else if (latestPit && latestPit.stop_duration && !pitStopFlash.has(dn)) {
                    const stopDur = latestPit.stop_duration.toFixed(1);
                    pitHtml = `<span class="pit-status">${stopDur}s</span>`;
                    pitStopFlash.set(dn, stopDur);
                    setTimeout(() => {
                        if (pitStopFlash.get(dn) === stopDur) pitStopFlash.delete(dn);
                    }, 5000);
                }
                
                const driverSectors = sectorMap.get(dn);
                let s1Delta = null, s2Delta = null, s3Delta = null;
                let s1Class = '', s2Class = '', s3Class = '';
                if (driverSectors && leaderSectorTimes.s1) {
                    s1Delta = driverSectors.s1 - leaderSectorTimes.s1;
                    s2Delta = driverSectors.s2 - leaderSectorTimes.s2;
                    s3Delta = driverSectors.s3 - leaderSectorTimes.s3;
                    s1Class = s1Delta < 0 ? 'green' : (s1Delta > 0 ? 'red' : '');
                    s2Class = s2Delta < 0 ? 'green' : (s2Delta > 0 ? 'red' : '');
                    s3Class = s3Delta < 0 ? 'green' : (s3Delta > 0 ? 'red' : '');
                }
                
                const segS1 = driverSectors?.seg1 || [];
                const segS2 = driverSectors?.seg2 || [];
                const segS3 = driverSectors?.seg3 || [];
                const allSegments = [...segS1, ...segS2, ...segS3];
                let miniHtml = '';
                for (let i = 0; i < Math.min(allSegments.length, 9); i++) {
                    const val = allSegments[i];
                    if (val === 2049) miniHtml += '<div class="mini-dot mini-dot-green"></div>';
                    else if (val === 2051) miniHtml += '<div class="mini-dot mini-dot-purple"></div>';
                    else if (val === 2048) miniHtml += '<div class="mini-dot mini-dot-yellow"></div>';
                    else miniHtml += '<div class="mini-dot mini-dot-white"></div>';
                }
                
                const hasPenalty = activePenalties.has(String(dn));
                const penaltySpan = hasPenalty ? '<span class="penalty-marker">⚠️</span>' : '';
                const lastLap = lastLapMap.get(dn);
                const bestLap = bestLapMap.get(dn);
                const bestClass = bestLap && allLaps.some(l => l.lap_duration === bestLap.duration && l.driver_number !== dn) ? '' : 'purple';
                
                const row = tbody.insertRow();
                row.className = 'driver-row';
                row.onclick = () => showDriverDetails(dn, d.full_name);
                row.insertCell(0).innerHTML = `<span class="pos">${idx+1}</span>`;
                row.insertCell(1).innerHTML = `<span>${penaltySpan}${d.name_acronym || d.full_name.split(' ').pop()}</span>`;
                row.insertCell(2).innerHTML = gapText;
                row.insertCell(3).innerHTML = lastLap ? formatLapTime(lastLap.duration) : '—';
                row.insertCell(4).innerHTML = bestLap ? `<span class="${bestClass}">${formatLapTime(bestLap.duration)}</span>` : '—';
                row.insertCell(5).innerHTML = `<span class="${s1Class}">${formatDelta(s1Delta)}</span>`;
                row.insertCell(6).innerHTML = `<span class="${s2Class}">${formatDelta(s2Delta)}</span>`;
                row.insertCell(7).innerHTML = `<span class="${s3Class}">${formatDelta(s3Delta)}</span>`;
                row.insertCell(8).innerHTML = miniHtml || '—';
                row.insertCell(9).innerHTML = pitHtml;
            }
        } catch (err) {
            console.error(err);
        } finally {
            isLoading = false;
            document.getElementById('refreshIndicator').innerHTML = '✅ Live 2s';
        }
    }
    
    async function showDriverDetails(driverNumber, driverName) {
        if (!currentSessionKey) return;
        const [laps, stints] = await Promise.all([
            fetchJSON(`https://api.openf1.org/v1/laps?session_key=${currentSessionKey}&driver_number=${driverNumber}`),
            fetchJSON(`https://api.openf1.org/v1/stints?session_key=${currentSessionKey}&driver_number=${driverNumber}`)
        ]);
        const sortedLaps = laps.sort((a,b) => a.lap_number - b.lap_number);
        document.getElementById('modalDriverName').innerHTML = `📊 ${driverName} — Lap History`;
        let html = '<table class="lap-history-table"><tr><th>Lap</th><th>Time</th><th>S1</th><th>S2</th><th>S3</th><th>Tyre</th></tr>';
        for (const lap of sortedLaps.slice(0, 70)) {
            let tyreCompound = '—';
            if (stints.length) {
                const stint = stints.find(s => lap.lap_number >= s.lap_start && lap.lap_number <= s.lap_end);
                if (stint) tyreCompound = stint.compound;
            }
            let tyreColor = '';
            if (tyreCompound === 'SOFT') tyreColor = '🟠 SOFT';
            else if (tyreCompound === 'MEDIUM') tyreColor = '🟡 MEDIUM';
            else if (tyreCompound === 'HARD') tyreColor = '⚪ HARD';
            else tyreColor = '—';
            html += `<tr>
                        <td>${lap.lap_number}</td>
                        <td>${formatLapTime(lap.lap_duration)}</td>
                        <td>${lap.duration_sector_1 ? lap.duration_sector_1.toFixed(3) : '—'}</td>
                        <td>${lap.duration_sector_2 ? lap.duration_sector_2.toFixed(3) : '—'}</td>
                        <td>${lap.duration_sector_3 ? lap.duration_sector_3.toFixed(3) : '—'}</td>
                        <td>${tyreColor}</td>
                     </tr>`;
        }
        html += '</table>';
        document.getElementById('modalLapsContainer').innerHTML = html;
        document.getElementById('driverModal').style.display = 'flex';
    }
    
    document.getElementById('yearSelect').addEventListener('change', () => updateWeekendSelect());
    document.getElementById('sessionSelect').addEventListener('change', onWeekendSelected);
    document.querySelector('.close-modal').onclick = () => document.getElementById('driverModal').style.display = 'none';
    window.onclick = (e) => { if (e.target === document.getElementById('driverModal')) document.getElementById('driverModal').style.display = 'none'; };
    
    updateWeekendSelect();
</script>
</body>
    </html>
