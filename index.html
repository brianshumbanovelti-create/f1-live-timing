    <div class="wx-item">💨 Air <span>${w.air_temperature??'—'}°C</span></div>
    <div class="wx-item">💧 <span>${w.humidity??'—'}%</span></div>
    <div class="wx-item">🌬 <span>${w.wind_speed??'—'} km/h</span></div>
    ${rain?'<div class="wx-item wx-rain">🌧 RAIN</div>':''}`;
}

// ═══════════════════════════════════════
// RACE CONTROL
// ═══════════════════════════════════════
function updateRaceControl(data){
  allRCMessages=data;
  activeYellowSectors.clear();
  let scActive=false;
  for(const m of data){
    const f=(m.flag||'').toUpperCase(),msg=(m.message||'').toUpperCase();
    if(f==='YELLOW'&&m.sector)activeYellowSectors.add(m.sector);
    if(f==='SC'||msg.includes('SAFETY CAR'))scActive=true;
    if(f==='GREEN')activeYellowSectors.clear();
  }
  if(scActive)setSelectStatus('sc');
  if(!data.length)return;
  const last=data[data.length-1];
  if((last.flag||'').toUpperCase()==='RED')setSelectStatus('red');
  document.getElementById('rcFlagDot').style.background=flagColor(last.flag);
  document.getElementById('rcText').textContent=last.message||'';
}

// ═══════════════════════════════════════
// LOCATION
// ═══════════════════════════════════════
function updateLocations(data){
  for(const p of data){
    const dn=p.driver_number;
    if(dn===0){scLocation={x:p.x,y:p.y,date:p.date};continue}
    if(!locationData.has(dn)||new Date(p.date)>new Date(locationData.get(dn).date))locationData.set(dn,{x:p.x,y:p.y,date:p.date});
  }
}

// ═══════════════════════════════════════
// TRACKER
// ═══════════════════════════════════════
function drawTracker(){
  const canvas=document.getElementById('trackerFull');if(!canvas)return;
  const parent=canvas.parentElement;
  const size=Math.min(parent.clientWidth,parent.clientHeight)-24;
  if(size<50)return;
  canvas.width=size;canvas.height=size;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,size,size);
  const cx=size/2,cy=size/2,R=size*0.40;

  // Ring
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.strokeStyle='#2a2a2a';ctx.lineWidth=size*0.055;ctx.stroke();

  // Sector flag arcs
  const sectorAngles=[[-Math.PI/2,Math.PI/6],[Math.PI/6,Math.PI*5/6],[Math.PI*5/6,Math.PI*3/2]];
  for(let i=0;i<3;i++){
    if(activeYellowSectors.has(i+1)){
      const[sa,ea]=sectorAngles[i];
      ctx.beginPath();ctx.arc(cx,cy,R,sa,ea);
      ctx.strokeStyle='rgba(234,179,8,0.45)';ctx.lineWidth=size*0.06;ctx.stroke();
    }
  }

  // S/F line
  ctx.beginPath();ctx.moveTo(cx,cy-R+size*0.025);ctx.lineTo(cx,cy-R-size*0.025);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();

  const allLocs=[...locationData.entries()];
  if(!allLocs.length){
    ctx.fillStyle='#555';ctx.font=`${size*0.04}px JetBrains Mono`;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('AWAITING DATA',cx,cy);
    return;
  }

  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const[,l]of allLocs){minX=Math.min(minX,l.x);maxX=Math.max(maxX,l.x);minY=Math.min(minY,l.y);maxY=Math.max(maxY,l.y)}

  function locToAngle(x,y){
    const nx=(x-minX)/(maxX-minX||1)*2-1;
    const ny=(y-minY)/(maxY-minY||1)*2-1;
    return Math.atan2(ny,nx)+Math.PI/2;
  }

  const now=new Date();
  const pitted=[],onTrack=[];
  for(const[dn,loc]of allLocs){
    const age=(now-new Date(loc.date))/1000;
    if(age>30)pitted.push(dn);
    else onTrack.push([dn,loc]);
  }

  // On-track dots
  for(const[dn,loc]of onTrack){
    const meta=driverMeta.get(dn);if(!meta)continue;
    const angle=locToAngle(loc.x,loc.y);
    const dx=cx+Math.sin(angle)*R,dy=cy-Math.cos(angle)*R;
    const dotR=size*0.03;
    ctx.beginPath();ctx.arc(dx,dy,dotR,0,Math.PI*2);
    ctx.fillStyle=meta.teamColor;ctx.fill();
    ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.stroke();
    const labelDist=R+size*0.062;
    ctx.font=`bold ${size*0.028}px JetBrains Mono`;
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(meta.acronym,cx+Math.sin(angle)*labelDist,cy-Math.cos(angle)*labelDist);
  }

  // SC dot
  if(scLocation){
    const age=(now-new Date(scLocation.date))/1000;
    if(age<30){
      const angle=locToAngle(scLocation.x,scLocation.y);
      const dx=cx+Math.sin(angle)*R,dy=cy-Math.cos(angle)*R;
      ctx.beginPath();ctx.arc(dx,dy,size*0.033,0,Math.PI*2);
      ctx.fillStyle='#eab308';ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=1.5;ctx.stroke();
      ctx.font=`bold ${size*0.026}px JetBrains Mono`;
      ctx.fillStyle='#000';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('SC',dx,dy);
    }
  }

  // Pitted box — grid layout 6 per row
  if(pitted.length){
    const cols=6,itemW=size*0.07,itemH=size*0.045,gap=3;
    const rows=Math.ceil(pitted.length/cols);
    const boxW=cols*itemW+(cols-1)*gap+12;
    const boxH=rows*itemH+(rows-1)*gap+22;
    const bx=cx-boxW/2,by=cy-boxH/2;

    ctx.fillStyle='rgba(12,12,12,0.92)';ctx.strokeStyle='#333';ctx.lineWidth=1;
    roundRect(ctx,bx,by,boxW,boxH,5);ctx.fill();ctx.stroke();

    ctx.font=`${size*0.022}px JetBrains Mono`;ctx.fillStyle='#444';ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText('IN PIT',cx,by+5);

    // Sort pitted by last known race position
    pitted.sort((a,b)=>{
      const pa=lastKnownPositions.get(a)??99;
      const pb=lastKnownPositions.get(b)??99;
      return pa-pb;
    });

    for(let i=0;i<pitted.length;i++){
      const dn=pitted[i];const meta=driverMeta.get(dn);if(!meta)continue;
      const col=i%cols,row=Math.floor(i/cols);
      const px=bx+6+col*(itemW+gap)+itemW/2;
      const py=by+18+row*(itemH+gap);
      ctx.font=`bold ${size*0.026}px JetBrains Mono`;
      ctx.fillStyle=meta.teamColor;ctx.textAlign='center';ctx.textBaseline='top';
      ctx.fillText(meta.acronym,px,py);
    }
  }
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

// ═══════════════════════════════════════
// FEED ENGINE
// ═══════════════════════════════════════
const processedPits=new Set();

function generateFeed(laps,latestPos,latestIv,allPitStops,stintMap,raceControl){
  const isRace=sessionType.toLowerCase().includes('race');
  const isFP=sessionType.toLowerCase().includes('practice');
  const isQual=sessionType.toLowerCase().includes('qualif')||sessionType.toLowerCase().includes('sprint qual');
  const newEntries=[];

  // Group laps by lap number
  const lapsByNumber=new Map();
  for(const lap of laps){
    if(!lapsByNumber.has(lap.lap_number))lapsByNumber.set(lap.lap_number,[]);
    lapsByNumber.get(lap.lap_number).push(lap);
  }

  // Full per-driver lap list for trend analysis
  const allLapsByDriver=new Map();
  for(const lap of laps){
    const dn=lap.driver_number;
    if(!allLapsByDriver.has(dn))allLapsByDriver.set(dn,[]);
    allLapsByDriver.get(dn).push(lap);
  }

  const lapNums=[...lapsByNumber.keys()].sort((a,b)=>a-b);

  for(const lapNum of lapNums){
    if(processedLaps.has(lapNum))continue;
    const lapDrivers=lapsByNumber.get(lapNum);
    if(lapDrivers.length<Math.min(5,driverMeta.size*0.4))continue;

    processedLaps.add(lapNum);
    const ts=lapNum;
    if(lapNum>lastKnownLapNum)lastKnownLapNum=lapNum;

    const posAtLap=new Map();
    for(const[dn]of latestPos)posAtLap.set(dn,latestPos.get(dn)?.position??99);

    // ── LAP SUMMARY ──
    if(isRace){
      const sortedPos=[...posAtLap.entries()].sort((a,b)=>a[1]-b[1]);
      const top5=sortedPos.slice(0,5).map(([dn])=>driverTag(dn)).join(', ');

      // Lead change
      const leaderNow=sortedPos[0]?.[0];
      const leaderPrev=[...lastKnownPositions.entries()].find(([,p])=>p===1)?.[0];
      if(leaderPrev&&leaderNow&&leaderNow!==leaderPrev){
        newEntries.push({lap:lapNum,category:'c-info',text:`${driverTag(leaderNow)} takes the lead from ${driverTag(leaderPrev)}.`,ts:ts-0.1});
      }

      let text=`Lap ${lapNum} — ${top5}.`;
      for(const[dn,pos]of posAtLap){
        const prev=lastKnownPositions.get(dn);if(!prev)continue;
        const change=prev-pos;
        if(pos<=5&&prev>8)text+=` ${driverTag(dn)} up to P${pos}.`;
        else if(pos>5&&change>=3)text+=` ${driverTag(dn)} +${change} to P${pos}.`;
        else if(pos>5&&(pos-prev)>=3)text+=` ${driverTag(dn)} fell to P${pos}.`;
      }
      newEntries.push({lap:lapNum,category:'c-lap',text,ts});

      // Final lap
      const totalLaps=lapNums[lapNums.length-1];
      if(lapNum===totalLaps){
        const leaderNowFinal=sortedPos[0]?.[0];
        const p2dn=sortedPos[1]?.[0];
        const gap=p2dn?latestIv.get(p2dn)?.gap_to_leader:null;
        const gapStr=gap!=null?` leads by ${typeof gap==='number'?gap.toFixed(1)+'s':gap}`:'';
        newEntries.push({lap:lapNum,category:'c-fastest',text:`🏁 FINAL LAP. ${driverTag(leaderNowFinal)}${gapStr}.`,ts:ts+0.1});
      }

      // Overtakes (position swap vs previous lap, top 10 only)
      for(const[dn,pos]of posAtLap){
        const prev=lastKnownPositions.get(dn);
        if(!prev||pos>=prev||pos>10)continue;
        const passed=[...posAtLap.entries()].find(([d,p])=>d!==dn&&p===prev);
        if(passed)newEntries.push({lap:lapNum,category:'c-info',text:`${driverTag(dn)} passes ${driverTag(passed[0])}. Now P${pos}.`,ts:ts+0.2});
      }
    }

    for(const[dn,pos]of posAtLap)lastKnownPositions.set(dn,pos);

    // ── FASTEST LAP ──
    for(const lap of lapDrivers){
      if(lap.lap_duration&&lap.lap_duration>0){
        if(!currentFastestLap||lap.lap_duration<currentFastestLap.duration){
          currentFastestLap={dn:lap.driver_number,duration:lap.lap_duration,lap:lapNum};
          newEntries.push({lap:lapNum,category:'c-fastest',text:`${driverTag(lap.driver_number)} sets fastest lap — <b style="color:var(--purple)">${fmtTime(lap.lap_duration)}</b> on lap ${lapNum}.`,ts:ts+0.3});
        }
      }
    }

    // ── SECTOR ANOMALY ──
    const recentRC=allRCMessages.filter(m=>(m.lap_number||0)>=lapNum-5);
    const flagActive=activeYellowSectors.size>0||
      recentRC.some(m=>{
        const f=(m.flag||'').toUpperCase(),msg=(m.message||'').toUpperCase();
        return f==='VSC'||msg.includes('SAFETY CAR DEPLOYED')||msg.includes('VIRTUAL SAFETY CAR DEPLOYED');
      });

    const anomalyThisLap=new Set();
    if(!flagActive){
      for(const lap of lapDrivers){
        const dn=lap.driver_number;
        if(!lap.duration_sector_1&&!lap.duration_sector_2&&!lap.duration_sector_3)continue;
        const history=lastLapTimes.get(dn)||[];
        for(let si=0;si<3;si++){
          const val=[lap.duration_sector_1,lap.duration_sector_2,lap.duration_sector_3][si];
          if(!val)continue;
          const prevVals=history.map(h=>h[si]).filter(Boolean);
          if(prevVals.length>=3){
            const avg=prevVals.reduce((a,b)=>a+b,0)/prevVals.length;
            const loss=val-avg;
            if(loss>=0.5){
              anomalyThisLap.add(dn);
              const severity=loss>=5.0?'🔴 Critical stop or safety delay':loss>=2.0?'major incident':loss>=1.0?'significant time loss':'moment';
              newEntries.push({lap:lapNum,category:'c-incident',text:`${driverTag(dn)} — ${severity} in S${si+1}. Lost <b>${loss.toFixed(2)}s</b> vs personal average.`,ts:lapNum});
            }
          }
        }
        const entry=[lap.duration_sector_1,lap.duration_sector_2,lap.duration_sector_3];
        history.push(entry);if(history.length>5)history.shift();
        lastLapTimes.set(dn,history);
      }
      if(anomalyThisLap.size>=4){
        newEntries.push({lap:lapNum,category:'c-sc',text:`⚠️ Possible track incident or safety delay — ${anomalyThisLap.size} drivers affected simultaneously.`,ts:lapNum+0.5});
      }
    } else {
      for(const lap of lapDrivers){
        const dn=lap.driver_number;
        const h=lastLapTimes.get(dn)||[];
        h.push([lap.duration_sector_1,lap.duration_sector_2,lap.duration_sector_3]);
        if(h.length>5)h.shift();lastLapTimes.set(dn,h);
      }
    }

    if(isRace){
      // ── 4-LAP DEGRADATION TREND ──
      for(const[dn,driverLaps]of allLapsByDriver){
        const recent=driverLaps.filter(l=>l.lap_duration&&l.lap_number>lapNum-5&&l.lap_number<=lapNum).sort((a,b)=>a.lap_number-b.lap_number);
        if(recent.length<4)continue;
        const times=recent.slice(-4).map(l=>l.lap_duration);
        let dropping=true;
        for(let i=1;i<times.length;i++)if(times[i]<=times[i-1])dropping=false;
        if(!dropping)continue;
        const totalDrop=times[times.length-1]-times[0];
        const key=`deg-${dn}-${lapNum}`;
        if(processedPits.has(key))continue;
        processedPits.add(key);
        const ds=stintMap.get(dn)||[];
        const{compound,age}=getCurrentTyre(ds,lapNum);
        const ti=compound?`. <span class="${tyreClass(compound)}">${tyreLetter(compound)}</span> at ${age} laps`:'';
        newEntries.push({lap:lapNum,category:'c-strategy',text:`${driverTag(dn)} lap times dropping 4 consecutive laps (+${totalDrop.toFixed(2)}s)${ti}. Possible tyre degradation.`,ts:lapNum+0.6});
      }

      // ── RATE OF CHANGE vs CAR AHEAD ──
      for(const[dn]of latestIv){
        const iv=latestIv.get(dn);if(!iv||iv.interval==null)continue;
        const ivKey='iv:'+dn;
        if(!lastLapTimes.has(ivKey))lastLapTimes.set(ivKey,[]);
        const ivHist=lastLapTimes.get(ivKey);
        ivHist.push(typeof iv.interval==='number'?iv.interval:parseFloat(iv.interval)||0);
        if(ivHist.length>4)ivHist.shift();
        if(ivHist.length<3)continue;
        const perLap=(ivHist[ivHist.length-1]-ivHist[0])/ivHist.length;
        if(Math.abs(perLap)<0.3)continue;
        const key=`roc-${dn}-${lapNum}`;
        if(processedPits.has(key))continue;
        processedPits.add(key);
        const ds=stintMap.get(dn)||[];
        const{compound,age}=getCurrentTyre(ds,lapNum);
        const ti=compound?`. <span class="${tyreClass(compound)}">${tyreLetter(compound)}</span> at ${age} laps`:'';
        if(perLap<0)newEntries.push({lap:lapNum,category:'c-info',text:`${driverTag(dn)} gaining ${Math.abs(perLap).toFixed(2)}s per lap for 3 laps${ti}.`,ts:lapNum+0.7});
        else newEntries.push({lap:lapNum,category:'c-strategy',text:`${driverTag(dn)} losing ${perLap.toFixed(2)}s per lap for 3 laps${ti}.`,ts:lapNum+0.7});
      }

      // ── TEAMMATE BATTLE ──
      const teamsChecked=new Set();
      for(const[dn,meta]of driverMeta){
        if(teamsChecked.has(meta.teamName))continue;
        const tm=[...driverMeta.entries()].find(([d,m])=>m.teamName===meta.teamName&&d!==dn);
        if(!tm)continue;
        teamsChecked.add(meta.teamName);
        const[tmDn]=tm;
        const r1=(allLapsByDriver.get(dn)||[]).filter(l=>l.lap_duration&&l.lap_number>lapNum-4&&l.lap_number<=lapNum);
        const r2=(allLapsByDriver.get(tmDn)||[]).filter(l=>l.lap_duration&&l.lap_number>lapNum-4&&l.lap_number<=lapNum);
        if(r1.length<3||r2.length<3)continue;
        const avg1=r1.reduce((a,b)=>a+b.lap_duration,0)/r1.length;
        const avg2=r2.reduce((a,b)=>a+b.lap_duration,0)/r2.length;
        const diff=Math.abs(avg1-avg2);
        if(diff<0.2||diff>0.8)continue;
        const key=`tm-${meta.teamName}-${lapNum}`;
        if(processedPits.has(key))continue;
        processedPits.add(key);
        const faster=avg1<avg2?dn:tmDn;const slower=avg1<avg2?tmDn:dn;
        const t1=getCurrentTyre(stintMap.get(faster)||[],lapNum);
        const t2=getCurrentTyre(stintMap.get(slower)||[],lapNum);
        const t1s=t1.compound?`<span class="${tyreClass(t1.compound)}">${tyreLetter(t1.compound)}</span> ${t1.age}L`:'';
        const t2s=t2.compound?`<span class="${tyreClass(t2.compound)}">${tyreLetter(t2.compound)}</span> ${t2.age}L`:'';
        newEntries.push({lap:lapNum,category:'c-info',text:`${driverTag(faster)} ${diff.toFixed(2)}s faster than ${driverTag(slower)} for 3 laps. ${t1s} vs ${t2s}.`,ts:lapNum+0.8});
      }

      // ── STRANGE STAT: slower compound matching pace ──
      const cRank={'SOFT':1,'MEDIUM':2,'HARD':3,'INTERMEDIATE':1,'WET':1};
      const dnList=[...driverMeta.keys()];
      for(let i=0;i<dnList.length;i++){
        for(let j=i+1;j<dnList.length;j++){
          const dn1=dnList[i],dn2=dnList[j];
          const s1=stintMap.get(dn1)||[];const s2=stintMap.get(dn2)||[];
          const t1=getCurrentTyre(s1,lapNum);const t2=getCurrentTyre(s2,lapNum);
          if(!t1.compound||!t2.compound)continue;
          const r1=cRank[t1.compound.toUpperCase()]||2;const r2=cRank[t2.compound.toUpperCase()]||2;
          if(r1===r2)continue;
          const slowC=r1>r2?dn1:dn2;const fastC=r1>r2?dn2:dn1;
          const scR=(allLapsByDriver.get(slowC)||[]).filter(l=>l.lap_duration&&l.lap_number>lapNum-4&&l.lap_number<=lapNum);
          const fcR=(allLapsByDriver.get(fastC)||[]).filter(l=>l.lap_duration&&l.lap_number>lapNum-4&&l.lap_number<=lapNum);
          if(scR.length<3||fcR.length<3)continue;
          const scAvg=scR.reduce((a,b)=>a+b.lap_duration,0)/scR.length;
          const fcAvg=fcR.reduce((a,b)=>a+b.lap_duration,0)/fcR.length;
          if(Math.abs(scAvg-fcAvg)>0.15)continue;
          const key=`strange-${dn1}-${dn2}-${lapNum}`;
          if(processedPits.has(key))continue;
          processedPits.add(key);
          const scT=getCurrentTyre(stintMap.get(slowC)||[],lapNum);
          const fcT=getCurrentTyre(stintMap.get(fastC)||[],lapNum);
          newEntries.push({lap:lapNum,category:'c-info',text:`${driverTag(slowC)} matching ${driverTag(fastC)} pace on <span class="${tyreClass(scT.compound)}">${tyreLetter(scT.compound)}</span> ${scT.age}L vs <span class="${tyreClass(fcT.compound)}">${tyreLetter(fcT.compound)}</span> ${fcT.age}L.`,ts:lapNum+0.9});
        }
      }
    }
  }

  // ── PIT STOPS — all stops, timestamp-based, independent of lap loop ──
  // Build a lap→positions snapshot from lastKnownPositions for position lookup
  for(const pit of allPitStops){
    const dn=pit.driver_number;
    const pitKey=`pit-${dn}-${pit.pit_in_time}`;
    const lapIn=pit.lap_number||lastKnownLapNum||0;
    const lapOut=lapIn+1;

    if(pit.pit_in_time&&!processedPits.has(pitKey+'in')){
      const pos=lastKnownPositions.get(dn)??'?';
      // Only mark processed if we have real position data
      if(pos!=='?'||lastKnownLapNum>0){
        processedPits.add(pitKey+'in');
        newEntries.push({lap:lapIn,category:'c-strategy',text:`${driverTag(dn)} pits from P${pos}.`,ts:lapIn});
      }
    }

    if(pit.pit_out_time&&!processedPits.has(pitKey+'out')){
      const dur=pit.pit_duration??pit.stop_duration;
      const pos=lastKnownPositions.get(dn)??'?';
      const ds=stintMap.get(dn)||[];
      const{compound}=getCurrentTyre(ds,lapOut);
      const tyreStr=compound?` on <span class="${tyreClass(compound)}">${tyreLetter(compound)}</span>`:'';
      const durStr=dur?` — ${parseFloat(dur).toFixed(1)}s stop`:'';
      if(pos!=='?'||lastKnownLapNum>0){
        processedPits.add(pitKey+'out');
        newEntries.push({lap:lapOut,category:'c-strategy',text:`${driverTag(dn)} rejoins P${pos}${tyreStr}${durStr}.`,ts:lapOut+0.5});
      }
    }
  }

  // ══════════════════════════════════════
  // FREE PRACTICE FEED
  // ══════════════════════════════════════
  if(isFP){
    const sessionElapsed=sessionStart?(new Date()-sessionStart)/60000:0;
    const sessionDuration=sessionStart&&sessionEnd?(sessionEnd-sessionStart)/60000:60;

    // ── SESSION HALFWAY MARKER ──
    const halfKey='fp-half';
    if(sessionElapsed>=sessionDuration/2&&!processedPits.has(halfKey)){
      processedPits.add(halfKey);
      const remaining=Math.round(sessionDuration-sessionElapsed);
      newEntries.push({lap:lastKnownLapNum,category:'c-info',text:`${sessionType.toUpperCase()} HALFWAY. ${remaining} minutes remaining.`,ts:lastKnownLapNum+0.01});
    }

    // Build per-driver lap history for FP analysis
    const fpLapsByDriver=new Map();
    for(const lap of laps){
      const dn=lap.driver_number;
      if(!fpLapsByDriver.has(dn))fpLapsByDriver.set(dn,[]);
      fpLapsByDriver.get(dn).push(lap);
    }

    // ── SESSION BEST / PERSONAL BEST ──
    // Track session best per driver
    for(const[dn,driverLaps]of fpLapsByDriver){
      const validLaps=driverLaps.filter(l=>l.lap_duration&&l.lap_duration>0).sort((a,b)=>a.lap_number-b.lap_number);
      if(!validLaps.length)continue;

      // First timed lap
      const firstKey=`fp-first-${dn}`;
      if(!processedPits.has(firstKey)){
        processedPits.add(firstKey);
        const first=validLaps[0];
        newEntries.push({lap:first.lap_number,category:'c-lap',text:`${driverTag(dn)} first timed lap. ${fmtTime(first.lap_duration)}.`,ts:first.lap_number});
      }

      // Personal best improvement
      const sortedByLap=validLaps.slice().sort((a,b)=>a.lap_number-b.lap_number);
      let runningBest=Infinity;
      for(const lap of sortedByLap){
        if(lap.lap_duration<runningBest){
          runningBest=lap.lap_duration;
          const pbKey=`fp-pb-${dn}-${lap.lap_number}`;
          if(!processedPits.has(pbKey)&&lap.lap_number===lastKnownLapNum){
            processedPits.add(pbKey);
            const ds=stintMap.get(dn)||[];
            const{compound}=getCurrentTyre(ds,lap.lap_number);
            const tStr=compound?` on <span class="${tyreClass(compound)}">${tyreLetter(compound)}</span>`:'';
            // Gap to session best
            const gapToP1=overallBestLap&&overallBestLap<Infinity&&lap.driver_number!==overallBestDriver?` (+${(lap.lap_duration-overallBestLap).toFixed(3)}s to P1)`:'';
            newEntries.push({lap:lap.lap_number,category:'c-fastest',text:`${driverTag(dn)} personal best${tStr}. <b style="color:var(--purple)">${fmtTime(lap.lap_duration)}</b>${gapToP1}.`,ts:lap.lap_number+0.2});
          }
        }
      }
    }

    // ── DRIVER IN GARAGE — location stale 5+ minutes ──
    const now=new Date();
    for(const[dn]of driverMeta){
      const loc=locationData.get(dn);
      if(!loc)continue;
      const staleMin=(now-new Date(loc.date))/60000;
      const garageKey=`fp-garage-${dn}-${Math.floor(sessionElapsed/5)}`;
      if(staleMin>=5&&!processedPits.has(garageKey)){
        processedPits.add(garageKey);
        newEntries.push({lap:lastKnownLapNum,category:'c-info',text:`${driverTag(dn)} in garage. No track activity for ${Math.round(staleMin)} minutes.`,ts:lastKnownLapNum+0.05});
      }
    }

    // ── COMPOUND SWITCH — new compound first seen ──
    for(const[dn,driverStints]of stintMap){
      for(const stint of driverStints){
        if(!stint.compound)continue;
        const switchKey=`fp-compound-${dn}-${stint.compound}-${stint.lap_start}`;
        if(!processedPits.has(switchKey)){
          processedPits.add(switchKey);
          // Only report if not the very first stint of the session
          const driverStintsSorted=driverStints.slice().sort((a,b)=>a.lap_start-b.lap_start);
          const stintIndex=driverStintsSorted.indexOf(stint);
          if(stintIndex>0){
            newEntries.push({lap:stint.lap_start,category:'c-strategy',text:`${driverTag(dn)} switches to <span class="${tyreClass(stint.compound)}">${tyreLetter(stint.compound)}</span> ${stint.compound}. Lap ${stint.lap_start}.`,ts:stint.lap_start});
          }
        }
      }
    }

    // ── LONG RUN ANALYSIS — 6+ laps same stint ──
    for(const[dn,driverStints]of stintMap){
      for(const stint of driverStints){
        if(!stint.compound)continue;
        const stintEnd=stint.lap_end||lastKnownLapNum;
        const stintLen=stintEnd-stint.lap_start+1;
        if(stintLen<6)continue;

        const longRunKey=`fp-longrun-${dn}-${stint.lap_start}`;
        if(processedPits.has(longRunKey))continue;

        const driverLaps=(fpLapsByDriver.get(dn)||[])
          .filter(l=>l.lap_duration&&l.lap_duration>0&&l.lap_number>=stint.lap_start&&l.lap_number<=stintEnd)
          .sort((a,b)=>a.lap_number-b.lap_number);
        if(driverLaps.length<6)continue;

        processedPits.add(longRunKey);
        const avg=driverLaps.reduce((a,b)=>a+b.lap_duration,0)/driverLaps.length;

        // Degradation: slope of lap times
        const n=driverLaps.length;
        const xMean=(n-1)/2;
        let num=0,den=0;
        for(let i=0;i<n;i++){num+=(i-xMean)*(driverLaps[i].lap_duration-avg);den+=(i-xMean)**2}
        const degPerLap=den>0?num/den:0;
        const degStr=degPerLap>=0?`+${degPerLap.toFixed(3)}`:`${degPerLap.toFixed(3)}`;

        newEntries.push({lap:stintEnd,category:'c-strategy',text:`${driverTag(dn)} long run: ${stintLen} laps on <span class="${tyreClass(stint.compound)}">${tyreLetter(stint.compound)}</span>. Avg <b>${fmtTime(avg)}</b>. Deg ${degStr}s/lap.`,ts:stintEnd+0.3});
      }
    }

    // ── LAP TIME PROGRESSION — start vs end of stint ──
    for(const[dn,driverStints]of stintMap){
      for(const stint of driverStints){
        const stintEnd=stint.lap_end||lastKnownLapNum;
        const stintLen=stintEnd-stint.lap_start+1;
        if(stintLen<6)continue;
        const progKey=`fp-prog-${dn}-${stint.lap_start}`;
        if(processedPits.has(progKey))continue;

        const driverLaps=(fpLapsByDriver.get(dn)||[])
          .filter(l=>l.lap_duration&&l.lap_duration>0&&l.lap_number>=stint.lap_start&&l.lap_number<=stintEnd)
          .sort((a,b)=>a.lap_number-b.lap_number);
        if(driverLaps.length<6)continue;

        processedPits.add(progKey);
        const first3=driverLaps.slice(0,3);
        const last3=driverLaps.slice(-3);
        const avgFirst=first3.reduce((a,b)=>a+b.lap_duration,0)/3;
        const avgLast=last3.reduce((a,b)=>a+b.lap_duration,0)/3;
        const delta=avgFirst-avgLast;
        const direction=delta>0.1?'Car getting faster.':delta<-0.1?'Car slowing — possible degradation.':'Consistent pace.';
        newEntries.push({lap:stintEnd,category:'c-info',text:`${driverTag(dn)} stint progression: first 3 laps avg <b>${fmtTime(avgFirst)}</b>, last 3 avg <b>${fmtTime(avgLast)}</b>. ${direction}`,ts:stintEnd+0.4});
      }
    }

    // ── SOLID LONG RUN — 5 laps within 0.15s ──
    for(const[dn,driverStints]of stintMap){
      for(const stint of driverStints){
        if(!stint.compound)continue;
        const stintEnd=stint.lap_end||lastKnownLapNum;
        const solidKey=`fp-solid-${dn}-${stint.lap_start}`;
        if(processedPits.has(solidKey))continue;

        const driverLaps=(fpLapsByDriver.get(dn)||[])
          .filter(l=>l.lap_duration&&l.lap_duration>0&&l.lap_number>=stint.lap_start&&l.lap_number<=stintEnd)
          .sort((a,b)=>a.lap_number-b.lap_number);
        if(driverLaps.length<5)continue;

        const times=driverLaps.map(l=>l.lap_duration);
        const spread=Math.max(...times)-Math.min(...times);
        if(spread>0.15)continue;

        processedPits.add(solidKey);
        newEntries.push({lap:stintEnd,category:'c-fastest',text:`${driverTag(dn)} solid long run on <span class="${tyreClass(stint.compound)}">${tyreLetter(stint.compound)}</span>. ${driverLaps.length} laps within ${spread.toFixed(3)}s (${fmtTime(Math.min(...times))} – ${fmtTime(Math.max(...times))}).`,ts:stintEnd+0.5});
      }
    }

    // ── TYRE COMPOUND COMPARISON — same driver, different stints ──
    for(const[dn,driverStints]of stintMap){
      if(driverStints.length<2)continue;
      const compKey=`fp-comp-${dn}-${driverStints.length}`;
      if(processedPits.has(compKey))continue;

      const stintAverages=[];
      for(const stint of driverStints){
        if(!stint.compound)continue;
        const stintEnd=stint.lap_end||lastKnownLapNum;
        const sLaps=(fpLapsByDriver.get(dn)||[])
          .filter(l=>l.lap_duration&&l.lap_duration>0&&l.lap_number>=stint.lap_start&&l.lap_number<=stintEnd);
        if(sLaps.length<3)continue;
        const avg=sLaps.reduce((a,b)=>a+b.lap_duration,0)/sLaps.length;
        stintAverages.push({compound:stint.compound,avg,laps:sLaps.length});
      }
      if(stintAverages.length<2)continue;

      // Only compare different compounds
      const compounds=new Set(stintAverages.map(s=>s.compound));
      if(compounds.size<2)continue;

      processedPits.add(compKey);
      stintAverages.sort((a,b)=>a.avg-b.avg);
      const best=stintAverages[0];
      const second=stintAverages[1];
      const diff=(second.avg-best.avg).toFixed(3);
      newEntries.push({lap:lastKnownLapNum,category:'c-strategy',
        text:`${driverTag(dn)} compound comparison: <span class="${tyreClass(best.compound)}">${tyreLetter(best.compound)}</span> avg ${fmtTime(best.avg)} (${best.laps}L) vs <span class="${tyreClass(second.compound)}">${tyreLetter(second.compound)}</span> avg ${fmtTime(second.avg)} (${second.laps}L). ${tyreLetter(best.compound)} +${diff}s faster.`,
        ts:lastKnownLapNum+0.6});
    }

    // ── RACE SIM RANKING — drivers doing 6+ laps same compound ──
    const simRankKey=`fp-simrank-${lastKnownLapNum}`;
    if(!processedPits.has(simRankKey)&&lastKnownLapNum>0){
      const compoundGroups=new Map();
      for(const[dn,driverStints]of stintMap){
        for(const stint of driverStints){
          if(!stint.compound)continue;
          const stintEnd=stint.lap_end||lastKnownLapNum;
          const sLaps=(fpLapsByDriver.get(dn)||[])
            .filter(l=>l.lap_duration&&l.lap_duration>0&&l.lap_number>=stint.lap_start&&l.lap_number<=stintEnd);
          if(sLaps.length<6)continue;
          const avg=sLaps.reduce((a,b)=>a+b.lap_duration,0)/sLaps.length;
          const c=stint.compound.toUpperCase();
          if(!compoundGroups.has(c))compoundGroups.set(c,[]);
          compoundGroups.get(c).push({dn,avg,laps:sLaps.length});
        }
      }
      for(const[compound,entries]of compoundGroups){
        if(entries.length<3)continue;
        const rankKey=`fp-simrank-${compound}-${lastKnownLapNum}`;
        if(processedPits.has(rankKey))continue;
        processedPits.add(rankKey);
        entries.sort((a,b)=>a.avg-b.avg);
        const top=entries.slice(0,5);
        const rankStr=top.map((e,i)=>`${driverTag(e.dn)} ${fmtTime(e.avg)}`).join(', ');
        const cLabel=compound.charAt(0)+compound.slice(1).toLowerCase();
        newEntries.push({lap:lastKnownLapNum,category:'c-info',
          text:`Long run averages (<span class="${tyreClass(compound)}">${cLabel}</span>): ${rankStr}.`,
          ts:lastKnownLapNum+0.7});
      }
      processedPits.add(simRankKey);
    }

    // ── BACK-TO-BACK PURPLE SECTOR ──
    const fpLapNums=[...lapsByNumber.keys()].sort((a,b)=>a-b);
    if(fpLapNums.length>=2){
      const lastTwo=fpLapNums.slice(-2);
      const prevLapDrivers=lapsByNumber.get(lastTwo[0])||[];
      const currLapDrivers=lapsByNumber.get(lastTwo[1])||[];
      for(const currLap of currLapDrivers){
        const dn=currLap.driver_number;
        const prevLap=prevLapDrivers.find(l=>l.driver_number===dn);
        if(!prevLap)continue;
        const sectors=[
          [currLap.duration_sector_1,prevLap.duration_sector_1,'S1'],
          [currLap.duration_sector_2,prevLap.duration_sector_2,'S2'],
          [currLap.duration_sector_3,prevLap.duration_sector_3,'S3']
        ];
        // Find session best sectors
        const allS1=(fpLapsByDriver.get(dn)||[]).map(l=>l.duration_sector_1).filter(Boolean);
        const allS2=(fpLapsByDriver.get(dn)||[]).map(l=>l.duration_sector_2).filter(Boolean);
        const allS3=(fpLapsByDriver.get(dn)||[]).map(l=>l.duration_sector_3).filter(Boolean);
        const bestS=[Math.min(...allS1),Math.min(...allS2),Math.min(...allS3)];
        for(let si=0;si<3;si++){
          const[curr,prev,label]=sectors[si];
          if(!curr||!prev||!bestS[si])continue;
          if(curr===bestS[si]&&prev<=bestS[si]*1.002){
            const key=`fp-b2b-${dn}-${label}-${lastTwo[1]}`;
            if(!processedPits.has(key)){
              processedPits.add(key);
              newEntries.push({lap:lastTwo[1],category:'c-fastest',text:`${driverTag(dn)} back-to-back best ${label}. Finding time consistently through that sector.`,ts:lastTwo[1]+0.8});
            }
          }
        }
      }
    }

    // ── MOST LAPS COMPLETED ──
    const mostLapsKey=`fp-mostlaps-${lastKnownLapNum}`;
    if(!processedPits.has(mostLapsKey)&&lastKnownLapNum>0&&lastKnownLapNum%10===0){
      processedPits.add(mostLapsKey);
      let maxLaps=0,maxDn=null;
      for(const[dn,dLaps]of fpLapsByDriver){
        if(dLaps.length>maxLaps){maxLaps=dLaps.length;maxDn=dn}
      }
      if(maxDn&&maxLaps>=10){
        newEntries.push({lap:lastKnownLapNum,category:'c-info',text:`${driverTag(maxDn)} leads lap count with ${maxLaps} laps completed. Clear long run focus.`,ts:lastKnownLapNum+0.9});
      }
    }
  }

  // ══════════════════════════════════════
  // QUALIFYING FEED
  // ══════════════════════════════════════
  if(isQual){
    // Q phase detection from session timer
    const sessionElapsed=sessionStart?(new Date()-sessionStart)/60000:0;
    // Standard durations: Q1 18min, break 7min, Q2 15min, break 7min, Q3 12min
    let qPhase=1,phaseElapsed=sessionElapsed,phaseRemaining=18;
    if(sessionElapsed>18+7+15+7){qPhase=3;phaseElapsed=sessionElapsed-(18+7+15+7);phaseRemaining=Math.max(0,12-phaseElapsed)}
    else if(sessionElapsed>18+7){qPhase=2;phaseElapsed=sessionElapsed-(18+7);phaseRemaining=Math.max(0,15-phaseElapsed)}
    else{phaseRemaining=Math.max(0,18-sessionElapsed)}

    // Q phase start marker
    const phaseKey=`q-phase-${qPhase}-start`;
    if(!processedPits.has(phaseKey)&&phaseElapsed<1){
      processedPits.add(phaseKey);
      const elimCount=qPhase===1?5:qPhase===2?5:0;
      const driverCount=qPhase===1?20:qPhase===2?15:10;
      const elimStr=elimCount>0?` Top ${driverCount-elimCount} advance. Bottom ${elimCount} eliminated.`:'';
      newEntries.push({lap:lastKnownLapNum,category:'c-info',text:`Q${qPhase} UNDERWAY.${elimStr}`,ts:lastKnownLapNum});
    }

    // Build best lap per driver for this qual
    const qualBest=new Map();
    for(const lap of laps){
      const dn=lap.driver_number;
      if(!lap.lap_duration||lap.lap_duration<=0)continue;
      if(!qualBest.has(dn)||lap.lap_duration<qualBest.get(dn).duration){
        qualBest.set(dn,{duration:lap.lap_duration,lap:lap.lap_number});
      }
    }

    // Sort by best time
    const qualOrder=[...qualBest.entries()].sort((a,b)=>a[1].duration-b[1].duration);
    const poleTime=qualOrder[0]?.[1]?.duration;

    // ── SESSION BEST IMPROVED ──
    if(poleTime&&overallBestDriver){
      const poleKey=`q-pole-${poleTime.toFixed(3)}`;
      if(!processedPits.has(poleKey)){
        processedPits.add(poleKey);
        const p2=qualOrder[1];
        const p3=qualOrder[2];
        const p2str=p2?` ${driverTag(p2[0])} +${(p2[1].duration-poleTime).toFixed(3)}s`:'';
        const p3str=p3?`. ${driverTag(p3[0])} +${(p3[1].duration-poleTime).toFixed(3)}s`:'';
        newEntries.push({lap:qualBest.get(overallBestDriver)?.lap||lastKnownLapNum,category:'c-fastest',
          text:`${driverTag(overallBestDriver)} P1 — <b style="color:var(--purple)">${fmtTime(poleTime)}</b>.${p2str}${p3str}.`,
          ts:(qualBest.get(overallBestDriver)?.lap||lastKnownLapNum)+0.1});
      }
    }

    // ── IMPROVEMENT VS PREVIOUS BEST ──
    for(const lap of laps){
      const dn=lap.driver_number;
      if(!lap.lap_duration||lap.lap_duration<=0)continue;
      const impKey=`q-imp-${dn}-${lap.lap_number}`;
      if(processedPits.has(impKey))continue;
      // Check if this lap is a new PB for driver AND is recent
      if(lap.lap_number!==lastKnownLapNum)continue;
      const prev=[...laps].filter(l=>l.driver_number===dn&&l.lap_duration>0&&l.lap_number<lap.lap_number);
      if(!prev.length)continue;
      const prevBest=Math.min(...prev.map(l=>l.lap_duration));
      if(lap.lap_duration>=prevBest)continue;
      processedPits.add(impKey);
      const improvement=(prevBest-lap.lap_duration).toFixed(3);
      const newPos=qualOrder.findIndex(([d])=>d===dn)+1;
      const gapToPole=poleTime&&dn!==overallBestDriver?` +${(lap.lap_duration-poleTime).toFixed(3)}s to P1`:'';
      // Sector gain — find which sector improved most
      const prevLap=prev.find(l=>l.lap_duration===prevBest);
      let sectorNote='';
      if(prevLap){
        const s1diff=prevLap.duration_sector_1&&lap.duration_sector_1?prevLap.duration_sector_1-lap.duration_sector_1:0;
        const s2diff=prevLap.duration_sector_2&&lap.duration_sector_2?prevLap.duration_sector_2-lap.duration_sector_2:0;
        const s3diff=prevLap.duration_sector_3&&lap.duration_sector_3?prevLap.duration_sector_3-lap.duration_sector_3:0;
        const maxGain=Math.max(s1diff,s2diff,s3diff);
        if(maxGain>0.05){
          const sectorIdx=[s1diff,s2diff,s3diff].indexOf(maxGain);
          sectorNote=` +${maxGain.toFixed(3)}s in S${sectorIdx+1}.`;
        }
      }
      newEntries.push({lap:lap.lap_number,category:'c-fastest',
        text:`${driverTag(dn)} improves to P${newPos}. <b>${fmtTime(lap.lap_duration)}</b> (-${improvement}s)${gapToPole}.${sectorNote}`,
        ts:lap.lap_number+0.2});
    }

    // ── ELIMINATION ZONE — under 3 minutes ──
    if(phaseRemaining<=3&&phaseRemaining>0&&qPhase<=2){
      const elimPos=qPhase===1?16:11;
      for(const[dn,best]of qualBest){
        const pos=qualOrder.findIndex(([d])=>d===dn)+1;
        if(pos===elimPos){
          const gapAbove=qualOrder[elimPos-2]?.[1]?.duration;
          const gapStr=gapAbove?` ${(best.duration-gapAbove).toFixed(3)}s from safety`:'';
          const elimKey=`q-elim-danger-${dn}-${Math.floor(phaseRemaining)}`;
          if(!processedPits.has(elimKey)){
            processedPits.add(elimKey);
            newEntries.push({lap:lastKnownLapNum,category:'c-incident',
              text:`${driverTag(dn)} on elimination line P${pos}.${gapStr}. ${Math.floor(phaseRemaining*60)}s remaining.`,
              ts:lastKnownLapNum+0.3});
          }
        }
      }
    }

    // ── Q CONFIRMED SAFE ──
    if(phaseRemaining<=5&&phaseRemaining>0&&qPhase<=2){
      const safePos=qPhase===1?15:10;
      for(const[dn]of qualBest){
        const pos=qualOrder.findIndex(([d])=>d===dn)+1;
        if(pos<=safePos){
          const safeKey=`q-safe-${dn}-q${qPhase}`;
          if(!processedPits.has(safeKey)){
            processedPits.add(safeKey);
            newEntries.push({lap:lastKnownLapNum,category:'c-info',
              text:`${driverTag(dn)} Q${qPhase+1} confirmed. P${pos} with ${Math.floor(phaseRemaining)} minutes left.`,
              ts:lastKnownLapNum+0.4});
          }
        }
      }
    }

    // ── TIGHT TOP 3 ──
    if(qualOrder.length>=3){
      const spread=qualOrder[2][1].duration-qualOrder[0][1].duration;
      if(spread<0.1){
        const tightKey=`q-tight-${qualOrder[0][1].duration.toFixed(3)}`;
        if(!processedPits.has(tightKey)){
          processedPits.add(tightKey);
          newEntries.push({lap:lastKnownLapNum,category:'c-fastest',
            text:`${driverTag(qualOrder[0][0])}, ${driverTag(qualOrder[1][0])}, ${driverTag(qualOrder[2][0])} covered by ${spread.toFixed(3)}s. Incredibly tight at the top.`,
            ts:lastKnownLapNum+0.5});
        }
      }
    }

    // ── SECTOR OWNERSHIP ──
    const s1Best=new Map(),s2Best=new Map(),s3Best=new Map();
    for(const lap of laps){
      if(!lap.lap_duration||lap.lap_duration<=0)continue;
      const dn=lap.driver_number;
      if(!s1Best.has(dn)||lap.duration_sector_1<s1Best.get(dn))s1Best.set(dn,lap.duration_sector_1||Infinity);
      if(!s2Best.has(dn)||lap.duration_sector_2<s2Best.get(dn))s2Best.set(dn,lap.duration_sector_2||Infinity);
      if(!s3Best.has(dn)||lap.duration_sector_3<s3Best.get(dn))s3Best.set(dn,lap.duration_sector_3||Infinity);
    }
    const bestS1Owner=[...s1Best.entries()].sort((a,b)=>a[1]-b[1])[0]?.[0];
    const bestS2Owner=[...s2Best.entries()].sort((a,b)=>a[1]-b[1])[0]?.[0];
    const bestS3Owner=[...s3Best.entries()].sort((a,b)=>a[1]-b[1])[0]?.[0];
    if(bestS1Owner&&bestS2Owner&&bestS3Owner){
      const sectorKey=`q-sectors-${bestS1Owner}-${bestS2Owner}-${bestS3Owner}`;
      if(!processedPits.has(sectorKey)){
        processedPits.add(sectorKey);
        const allSame=bestS1Owner===bestS2Owner&&bestS2Owner===bestS3Owner;
        const note=allSame?` ${driverTag(bestS1Owner)} owns all three sectors.`:bestS1Owner===bestS2Owner||bestS2Owner===bestS3Owner?` ${driverTag(bestS2Owner)} dominating multiple sectors.`:' No single driver dominating.';
        newEntries.push({lap:lastKnownLapNum,category:'c-info',
          text:`Sector leaders — S1 ${driverTag(bestS1Owner)}, S2 ${driverTag(bestS2Owner)}, S3 ${driverTag(bestS3Owner)}.${note}`,
          ts:lastKnownLapNum+0.6});
      }
    }

    // ── LAP DELETED — track limits ──
    for(const m of raceControl){
      const msg=(m.message||'').toUpperCase();
      if(!msg.includes('DELETED'))continue;
      const rcKey=`q-deleted-${m.date}`;
      if(processedPits.has(rcKey))continue;
      processedPits.add(rcKey);
      // Try to find driver number in message
      let driverNote='';
      for(const[dn,meta]of driverMeta){
        if(msg.includes(meta.acronym)||msg.includes(String(dn))){
          driverNote=` ${driverTag(dn)}.`;break;
        }
      }
      newEntries.push({lap:lastKnownLapNum,category:'c-incident',
        text:`Lap time deleted — track limits.${driverNote} ${m.message||''}`,
        ts:lastKnownLapNum+0.7});
    }

    // ── ABORTED LAP — driver pits without S3 ──
    for(const pit of allPitStops){
      const dn=pit.driver_number;
      const abortKey=`q-abort-${dn}-${pit.pit_in_time}`;
      if(processedPits.has(abortKey))continue;
      // Check if there's a lap ending near the pit time with no S3
      const pitLap=laps.find(l=>l.driver_number===dn&&l.lap_number===pit.lap_number);
      if(pitLap&&!pitLap.duration_sector_3&&pitLap.duration_sector_1){
        processedPits.add(abortKey);
        newEntries.push({lap:pit.lap_number||lastKnownLapNum,category:'c-strategy',
          text:`${driverTag(dn)} aborted push lap. Pitted before completing S3.`,
          ts:(pit.lap_number||lastKnownLapNum)+0.8});
      }
    }

    // ── POLE POSITION — session end ──
    if(sessionEnd&&new Date()>sessionEnd&&poleTime&&overallBestDriver){
      const poleConfKey='q-pole-confirmed';
      if(!processedPits.has(poleConfKey)){
        processedPits.add(poleConfKey);
        const p2=qualOrder[1];const p3=qualOrder[2];
        const p2str=p2?`. ${driverTag(p2[0])} +${(p2[1].duration-poleTime).toFixed(3)}s`:'';
        const p3str=p3?`. ${driverTag(p3[0])} +${(p3[1].duration-poleTime).toFixed(3)}s`:'';
        newEntries.push({lap:lastKnownLapNum,category:'c-fastest',
          text:`🏆 POLE POSITION: ${driverTag(overallBestDriver)} <b style="color:var(--purple)">${fmtTime(poleTime)}</b>${p2str}${p3str}.`,
          ts:lastKnownLapNum+1});
      }
    }

    // ── Q3 SHOOTOUT — when Q3 begins ──
    if(qPhase===3&&phaseElapsed<1){
      const shootoutKey='q-q3-shootout';
      if(!processedPits.has(shootoutKey)){
        processedPits.add(shootoutKey);
        const top10=qualOrder.slice(0,10).map(([dn])=>driverTag(dn)).join(', ');
        newEntries.push({lap:lastKnownLapNum,category:'c-info',
          text:`Q3 SHOOTOUT: ${top10} battle for pole.`,
          ts:lastKnownLapNum+0.05});
      }
    }

    // ── ELIMINATION CONFIRMED — Q1/Q2 end ──
    const elimConfPhase=qPhase===2&&phaseElapsed>=15?1:qPhase===3&&phaseElapsed<1?2:0;
    if(elimConfPhase>0){
      const elimConfKey=`q-elim-confirmed-q${elimConfPhase}`;
      if(!processedPits.has(elimConfKey)){
        processedPits.add(elimConfKey);
        const cutoff=elimConfPhase===1?15:10;
        const eliminated=qualOrder.slice(cutoff).map(([dn])=>driverTag(dn)).join(', ');
        const closest=qualOrder[cutoff];const safe=qualOrder[cutoff-1];
        const marginStr=closest&&safe?` ${driverTag(closest[0])} missed Q${elimConfPhase+1} by ${(closest[1].duration-safe[1].duration).toFixed(3)}s.`:'';
        newEntries.push({lap:lastKnownLapNum,category:'c-incident',
          text:`ELIMINATED IN Q${elimConfPhase}: ${eliminated}.${marginStr}`,
          ts:lastKnownLapNum+0.9});
      }
    }
  }
  if(isRace&&lastKnownLapNum>3){
    for(const[dn]of driverMeta){
      const driverLaps=allLapsByDriver.get(dn)||[];
      if(!driverLaps.length)continue;
      const maxDriverLap=Math.max(...driverLaps.map(l=>l.lap_number));
      if(maxDriverLap<5)continue;
      if(lastKnownLapNum-maxDriverLap<3)continue;
      const key=`ret-${dn}`;
      if(processedPits.has(key))continue;
      processedPits.add(key);
      const pos=lastKnownPositions.get(dn)??'?';
      newEntries.push({lap:maxDriverLap,category:'c-incident',text:`${driverTag(dn)} retired from P${pos}. No data since lap ${maxDriverLap}.`,ts:maxDriverLap});
    }
  }

  if(!newEntries.length)return;
  newEntries.sort((a,b)=>((a.lap||0)-(b.lap||0))||((a.ts||0)-(b.ts||0)));
  feedEntries=[...newEntries,...feedEntries];
  if(activeTab==='feed')renderFeed();
}

function renderFeed(){
  const scroll=document.getElementById('feedScroll');
  if(!feedEntries.length){
    scroll.innerHTML='<div class="feed-placeholder">NO FEED DATA YET</div>';
    return;
  }
  // Render newest first
  const sorted=[...feedEntries].sort((a,b)=>{
    // Primary: lap number descending
    const lapDiff=(b.lap||0)-(a.lap||0);
    if(lapDiff!==0)return lapDiff;
    // Secondary: ts descending (numeric)
    return(b.ts||0)-(a.ts||0);
  });
  scroll.innerHTML=sorted.map(e=>`
    <div class="feed-entry ${e.category}">
      <span class="feed-lap">L${e.lap}</span>
      <div class="feed-bar"></div>
      <span class="feed-text">${e.text}</span>
    </div>`).join('');
}

// ═══════════════════════════════════════
// RC MODAL
// ═══════════════════════════════════════
function openRCModal(){
  const body=document.getElementById('rcModalBody');
  let html='<div class="modal-section">RACE CONTROL</div>';
  const msgs=[...allRCMessages].reverse();
  if(!msgs.length)html+='<div style="color:var(--muted);font-family:var(--mono);font-size:11px;padding:10px 0">No messages</div>';
  for(const m of msgs){
    html+=`<div class="rc-entry">
      <span class="rc-time">${fmtTimeLabel(m.date)}</span>
      <div class="rc-dot" style="background:${flagColor(m.flag)}"></div>
      <span class="rc-message">${m.message||''}</span>
    </div>`;
  }
  body.innerHTML=html;
  document.getElementById('rcModal').classList.add('open');
}

function closeModal(id){document.getElementById(id).classList.remove('open')}

// ═══════════════════════════════════════
// LAP HISTORY MODAL
// ═══════════════════════════════════════
async function showLapHistory(dn){
  if(!sessionKey)return;
  const meta=driverMeta.get(dn);if(!meta)return;
  document.getElementById('lapModalTitle').textContent=`${meta.acronym} · ${meta.fullName}`;
  document.getElementById('lapModalBody').innerHTML='<div class="placeholder" style="padding:20px">LOADING...</div>';
  document.getElementById('lapModal').classList.add('open');

  const[laps,stints]=await Promise.all([
    api(`laps?session_key=${sessionKey}&driver_number=${dn}`),
    api(`stints?session_key=${sessionKey}&driver_number=${dn}`)
  ]);
  laps.sort((a,b)=>a.lap_number-b.lap_number);
  let driverBest=Infinity;
  for(const l of laps)if(l.lap_duration&&l.lap_duration<driverBest)driverBest=l.lap_duration;

  function getStint(n){return stints.find(s=>n>=s.lap_start&&n<=(s.lap_end||999))}
  function tc(c){if(!c)return'';const u=c.toUpperCase();if(u.includes('SOFT'))return't-soft';if(u.includes('MED'))return't-med';if(u.includes('HARD'))return't-hard';if(u.includes('INTER'))return't-inter';if(u.includes('WET'))return't-wet';return''}

  let rows='';
  for(const lap of laps){
    const stint=getStint(lap.lap_number);
    const compound=stint?.compound||'';
    const isOB=lap.lap_duration===overallBestLap;
    const isPB=lap.lap_duration===driverBest&&!isOB;
    const lapCls=isOB?'ob':isPB?'pb':'lt';
    rows+=`<tr><td>${lap.lap_number}</td><td class="${lapCls}">${fmtTime(lap.lap_duration)}</td><td>${lap.duration_sector_1?lap.duration_sector_1.toFixed(3):'—'}</td><td>${lap.duration_sector_2?lap.duration_sector_2.toFixed(3):'—'}</td><td>${lap.duration_sector_3?lap.duration_sector_3.toFixed(3):'—'}</td><td class="${tc(compound)}">${tyreLetter(compound)}</td></tr>`;
  }
  document.getElementById('lapModalBody').innerHTML=`<table class="lap-table"><thead><tr><th>LAP</th><th>TIME</th><th>S1</th><th>S2</th><th>S3</th><th>C</th></tr></thead><tbody>${rows||'<tr><td colspan="6" style="color:var(--muted);padding:10px 0">No data</td></tr>'}</tbody></table>`;
}
