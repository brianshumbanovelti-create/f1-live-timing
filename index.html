<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>F1Debrief</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #0a0e14;
            color: #e8edf3;
        }

        /* hide scrollbars everywhere */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        /* ---------- APP SHELL ---------- */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 12px 12px 12px;
            background: #0a0e14;
        }

        /* ---------- HEADER ---------- */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0 8px 0;
            border-bottom: 1px solid #1f2a36;
            flex-shrink: 0;
        }
        .app-header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #e10600, #ff4d4d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .app-header .badge {
            font-size: 0.6rem;
            background: #1f2a36;
            padding: 4px 12px;
            border-radius: 20px;
            color: #8a9aa8;
            letter-spacing: 0.3px;
        }

        /* ---------- TABS ---------- */
        .tabs {
            display: flex;
            gap: 4px;
            margin: 12px 0 10px 0;
            flex-shrink: 0;
            border-bottom: 1px solid #1f2a36;
            padding-bottom: 6px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: #6a7a88;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }
        .tab-btn:hover {
            color: #c0d0dc;
            background: #141c24;
        }
        .tab-btn.active {
            color: #fff;
            background: #1f2a36;
        }

        /* ---------- SELECTORS ---------- */
        .selectors {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            padding: 8px 0 10px 0;
            flex-shrink: 0;
            border-bottom: 1px solid #1a232e;
        }
        .selectors .sel-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1 1 100px;
            min-width: 100px;
        }
        .selectors label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #6a7a88;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .selectors select {
            background: #141c24;
            border: 1px solid #1f2a36;
            color: #e8edf3;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            flex: 1;
            min-width: 60px;
            outline: none;
            cursor: pointer;
        }
        .selectors select:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .selectors select option {
            background: #0a0e14;
        }

        /* ---------- CONTENT AREA ---------- */
        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px 0 8px 0;
            min-height: 0;
        }

        /* ---------- ORDER TAB ---------- */
        .order-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .order-row {
            display: grid;
            grid-template-columns: 36px 1fr 80px 60px 60px;
            align-items: center;
            padding: 6px 10px;
            border-radius: 6px;
            background: #11181f;
            transition: background 0.15s;
            cursor: pointer;
            font-size: 0.85rem;
            gap: 4px;
        }
        .order-row:hover {
            background: #1a2430;
        }
        .order-row .pos {
            font-weight: 700;
            color: #6a7a88;
            text-align: center;
        }
        .order-row .name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .order-row .abbr {
            color: #8a9aa8;
            font-size: 0.7rem;
            text-align: center;
        }
        .order-row .gap {
            color: #8a9aa8;
            font-size: 0.75rem;
            text-align: right;
        }
        .order-row .status {
            font-size: 0.7rem;
            text-align: right;
            color: #6a7a88;
        }
        .order-row .status.finished {
            color: #4ade80;
        }
        .order-row .status.dnf {
            color: #f87171;
        }

        /* ---------- DRIVER DETAIL (sub-view) ---------- */
        .detail-view {
            padding: 4px 0;
        }
        .detail-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .detail-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .detail-header .back-btn {
            background: #1f2a36;
            border: none;
            color: #e8edf3;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .detail-header .back-btn:hover {
            background: #2a3a4a;
        }
        .detail-laps {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 0.8rem;
        }
        .detail-laps .lap-row {
            display: grid;
            grid-template-columns: 50px 60px 1fr 60px;
            padding: 4px 10px;
            border-radius: 4px;
            background: #11181f;
            gap: 6px;
        }
        .detail-laps .lap-row .lap-num {
            color: #6a7a88;
        }
        .detail-laps .lap-row .lap-time {
            font-weight: 500;
        }
        .detail-laps .lap-row .tyre {
            font-size: 0.7rem;
            padding: 1px 10px;
            border-radius: 12px;
            background: #1a2430;
            display: inline-block;
            width: fit-content;
        }
        .detail-laps .lap-row .tyre.soft {
            background: #e10600;
            color: #fff;
        }
        .detail-laps .lap-row .tyre.medium {
            background: #f5a623;
            color: #0a0e14;
        }
        .detail-laps .lap-row .tyre.hard {
            background: #4a7a9a;
            color: #fff;
        }
        .detail-laps .lap-row .tyre.intermediate {
            background: #2b7a4a;
            color: #fff;
        }
        .detail-laps .lap-row .tyre.wet {
            background: #2a5a7a;
            color: #fff;
        }
        .detail-laps .lap-row .tyre.unknown {
            background: #2a2a2a;
            color: #8a8a8a;
        }
        .detail-laps .lap-row .sector {
            color: #8a9aa8;
            font-size: 0.7rem;
            text-align: right;
        }

        /* ---------- INSIGHTS ---------- */
        .insights-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .insight-card {
            background: #11181f;
            border-radius: 8px;
            padding: 14px 16px;
            border-left: 3px solid #1f2a36;
        }
        .insight-card h3 {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #6a7a88;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .insight-card .value {
            font-size: 0.9rem;
            font-weight: 500;
        }
        .insight-card .value small {
            font-weight: 400;
            color: #8a9aa8;
            font-size: 0.7rem;
        }
        .insight-card .list {
            font-size: 0.8rem;
            line-height: 1.6;
        }
        .insight-card .list .highlight {
            color: #f5a623;
        }

        /* ---------- DUELS ---------- */
        .duels-panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .duels-selectors {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            align-items: center;
        }
        .duels-selectors .driver-pick {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #11181f;
            padding: 4px 12px 4px 8px;
            border-radius: 20px;
        }
        .duels-selectors .driver-pick label {
            font-size: 0.7rem;
            color: #6a7a88;
        }
        .duels-selectors .driver-pick select {
            background: #141c24;
            border: 1px solid #1f2a36;
            color: #e8edf3;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            outline: none;
            max-width: 80px;
        }
        .duels-selectors .compare-btn {
            background: #e10600;
            border: none;
            color: #fff;
            padding: 6px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-left: auto;
        }
        .duels-selectors .compare-btn:hover {
            background: #ff1a1a;
        }
        .duels-selectors .compare-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .duels-charts {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 4px;
        }
        .duels-charts .chart-box {
            background: #11181f;
            border-radius: 8px;
            padding: 12px 10px 6px 10px;
        }
        .duels-charts .chart-box h4 {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #6a7a88;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .duels-charts .chart-box canvas {
            width: 100% !important;
            height: auto !important;
            max-height: 140px;
        }

        /* ---------- EMPTY STATE ---------- */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #4a5a68;
            font-size: 0.9rem;
            text-align: center;
            padding: 20px;
        }
        .empty-state span {
            font-size: 2.4rem;
            margin-bottom: 8px;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 640px) {
            .app-header h1 {
                font-size: 1.1rem;
            }
            .app-header .badge {
                font-size: 0.5rem;
                padding: 2px 10px;
            }
            .tab-btn {
                font-size: 0.75rem;
                padding: 4px 12px;
            }
            .selectors {
                gap: 4px 8px;
            }
            .selectors .sel-group {
                flex: 1 1 70px;
                min-width: 70px;
            }
            .selectors select {
                font-size: 0.7rem;
                padding: 4px 4px;
            }
            .order-row {
                grid-template-columns: 28px 1fr 50px 40px 40px;
                font-size: 0.7rem;
                padding: 5px 6px;
            }
            .order-row .gap {
                font-size: 0.65rem;
            }
            .order-row .status {
                font-size: 0.6rem;
            }
            .insights-grid {
                grid-template-columns: 1fr;
            }
            .detail-laps .lap-row {
                grid-template-columns: 40px 50px 1fr 40px;
                font-size: 0.7rem;
                padding: 3px 6px;
            }
            .duels-selectors .driver-pick {
                padding: 2px 8px 2px 6px;
            }
            .duels-selectors .compare-btn {
                font-size: 0.7rem;
                padding: 4px 14px;
            }
            .duels-charts .chart-box canvas {
                max-height: 100px;
            }
        }

        @media (max-width: 420px) {
            .order-row {
                grid-template-columns: 24px 1fr 40px 30px 30px;
                font-size: 0.65rem;
                gap: 2px;
            }
            .order-row .gap {
                font-size: 0.55rem;
            }
            .order-row .status {
                font-size: 0.5rem;
            }
            .selectors .sel-group {
                flex: 1 1 50px;
                min-width: 50px;
            }
            .selectors label {
                font-size: 0.55rem;
            }
            .selectors select {
                font-size: 0.6rem;
                padding: 3px 2px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- HEADER -->
        <header class="app-header">
            <h1>🏎️ F1Debrief</h1>
            <span class="badge">post‑session</span>
        </header>

        <!-- TABS -->
        <div class="tabs" id="tabBar">
            <button class="tab-btn active" data-tab="order">Order</button>
            <button class="tab-btn" data-tab="insights">Insights</button>
            <button class="tab-btn" data-tab="duels">Duels</button>
        </div>

        <!-- SELECTORS -->
        <div class="selectors" id="selectorBar">
            <div class="sel-group">
                <label for="selYear">Year</label>
                <select id="selYear"></select>
            </div>
            <div class="sel-group">
                <label for="selGP">GP</label>
                <select id="selGP" disabled></select>
            </div>
            <div class="sel-group">
                <label for="selSession">Session</label>
                <select id="selSession" disabled></select>
            </div>
        </div>

        <!-- CONTENT -->
        <div class="content" id="contentArea">
            <div class="empty-state">
                <span>🏁</span>
                <p>Select a year, GP and session to begin</p>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- CONSTANTS ----------
            const API_BASE = 'https://api.openf1.org/v1';

            // ---------- STATE ----------
            const state = {
                // selectors
                year: null,
                gp: null,
                sessionKey: null,
                // data caches (keyed by sessionKey)
                cache: {
                    drivers: null, // array
                    results: null, // array
                    stints: null, // array
                    weather: null, // array
                    laps: {}, // driverNumber -> array
                    carData: {}, // driverNumber -> array (raw, before downsampling)
                },
                // UI state
                activeTab: 'order',
                detailDriver: null, // driverNumber if in detail view
                // duels
                duelDrivers: [null, null, null, null],
                duelCharts: [],
            };

            // ---------- DOM REFS ----------
            const $ = id => document.getElementById(id);
            const elYear = $('selYear');
            const elGP = $('selGP');
            const elSession = $('selSession');
            const content = $('contentArea');
            const tabBtns = document.querySelectorAll('.tab-btn');

            // ---------- HELPERS ----------
            function getNumber(v) { const n = Number(v); return isNaN(n) ? null : n; }

            function safeName(d) { return d?.full_name || d?.name || 'Unknown'; }

            function abbrName(d) { return d?.name_acronym || d?.abbreviation || d?.driver_number || '??'; }

            function statusClass(status) {
                if (!status) return '';
                const s = String(status).toLowerCase();
                if (s.includes('finish') || s === 'finished') return 'finished';
                if (s.includes('dnf') || s.includes('retired') || s.includes('accident')) return 'dnf';
                return '';
            }

            function getTyreClass(compound) {
                if (!compound) return 'unknown';
                const c = String(compound).toLowerCase();
                if (c.includes('soft')) return 'soft';
                if (c.includes('medium')) return 'medium';
                if (c.includes('hard')) return 'hard';
                if (c.includes('intermediate') || c.includes('inter')) return 'intermediate';
                if (c.includes('wet')) return 'wet';
                return 'unknown';
            }

            function formatTime(ms) {
                if (!ms) return '—';
                const sec = ms / 1000;
                if (sec < 60) return sec.toFixed(2) + 's';
                const m = Math.floor(sec / 60);
                const s = (sec % 60).toFixed(2);
                return m + ':' + (s < 10 ? '0' : '') + s;
            }

            function downsampleTelemetry(data, maxPoints = 180) {
                if (!data || data.length <= maxPoints) return data || [];
                const step = Math.ceil(data.length / maxPoints);
                const result = [];
                for (let i = 0; i < data.length; i += step) {
                    result.push(data[i]);
                }
                // always include last point
                if (result[result.length - 1] !== data[data.length - 1]) {
                    result.push(data[data.length - 1]);
                }
                return result;
            }

            // ---------- API FETCH (with caching) ----------
            async function fetchAPI(endpoint) {
                const url = API_BASE + endpoint;
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
                return res.json();
            }

            // ---------- LOAD YEARS ----------
            async function loadYears() {
                try {
                    // Get all available years from sessions (2018-2026)
                    const data = await fetchAPI('/sessions?year_min=2018&year_max=2026');
                    const years = [...new Set(data.map(s => s.year).filter(Boolean))].sort((a, b) => b - a);
                    
                    // Ensure 2025 and 2026 are included even if no data yet
                    const allYears = new Set([2026, 2025, ...years]);
                    const sortedYears = Array.from(allYears).sort((a, b) => b - a);
                    
                    elYear.innerHTML = '<option value="">Year</option>' +
                        sortedYears.map(y => `<option value="${y}">${y}</option>`).join('');
                    
                    // Auto-select the most recent year with data, or 2026 if available
                    if (sortedYears.length) {
                        // Prefer 2026 if it exists in the set
                        if (sortedYears.includes(2026)) {
                            elYear.value = '2026';
                        } else {
                            elYear.value = sortedYears[0];
                        }
                        await onYearChange();
                    }
                } catch (err) {
                    console.warn('Failed to load years, using defaults', err);
                    // fallback with 2025 and 2026
                    elYear.innerHTML = '<option value="">Year</option><option value="2026">2026</option><option value="2025">2025</option>';
                    elYear.value = '2026';
                    await onYearChange();
                }
            }

            // ---------- SELECTOR CHANGE HANDLERS ----------
            async function onYearChange() {
                const year = elYear.value;
                if (!year) {
                    elGP.innerHTML = '<option value="">GP</option>';
                    elGP.disabled = true;
                    elSession.innerHTML = '<option value="">Session</option>';
                    elSession.disabled = true;
                    state.sessionKey = null;
                    renderEmpty('Select a year');
                    return;
                }
                state.year = year;
                elGP.disabled = false;
                elGP.innerHTML = '<option value="">Loading GPs…</option>';
                try {
                    const data = await fetchAPI(`/sessions?year=${year}`);
                    // Group by location/country for GP names
                    const gpMap = {};
                    data.forEach(s => {
                        const name = s.location || s.country || s.name;
                        if (name) gpMap[name] = true;
                    });
                    const gps = Object.keys(gpMap).sort();
                    
                    elGP.innerHTML = '<option value="">GP</option>' +
                        gps.map(g => `<option value="${g}">${g}</option>`).join('');
                    
                    if (gps.length) {
                        elGP.value = gps[0];
                        await onGPChange();
                    } else {
                        elGP.innerHTML = '<option value="">No GPs found</option>';
                        elSession.innerHTML = '<option value="">Session</option>';
                        elSession.disabled = true;
                        renderEmpty('No Grands Prix found for this year');
                    }
                } catch (err) {
                    console.warn('Failed to load GPs', err);
                    elGP.innerHTML = '<option value="">Error loading GPs</option>';
                }
            }

            async function onGPChange() {
                const gp = elGP.value;
                if (!gp) {
                    elSession.innerHTML = '<option value="">Session</option>';
                    elSession.disabled = true;
                    state.sessionKey = null;
                    renderEmpty('Select a GP');
                    return;
                }
                state.gp = gp;
                elSession.disabled = false;
                elSession.innerHTML = '<option value="">Loading sessions…</option>';
                try {
                    const data = await fetchAPI(`/sessions?year=${state.year}`);
                    const sessions = data
                        .filter(s => (s.location || s.country || s.name) === gp)
                        .sort((a, b) => (a.session_key || 0) - (b.session_key || 0));
                    
                    if (sessions.length) {
                        // Show session name with type
                        elSession.innerHTML = '<option value="">Select session</option>' +
                            sessions.map(s => {
                                const label = s.session_name || s.name || 'Session';
                                const type = s.session_type ? ` (${s.session_type})` : '';
                                return `<option value="${s.session_key}">${label}${type}</option>`;
                            }).join('');
                        
                        // Auto-select the first session
                        elSession.value = sessions[0].session_key;
                        await onSessionChange();
                    } else {
                        elSession.innerHTML = '<option value="">No sessions found</option>';
                        renderEmpty('No sessions available for this GP');
                    }
                } catch (err) {
                    console.warn('Failed to load sessions', err);
                    elSession.innerHTML = '<option value="">Error loading sessions</option>';
                }
            }

            async function onSessionChange() {
                const key = elSession.value;
                if (!key) {
                    state.sessionKey = null;
                    state.cache.drivers = null;
                    state.cache.results = null;
                    state.cache.stints = null;
                    state.cache.weather = null;
                    state.cache.laps = {};
                    state.cache.carData = {};
                    renderEmpty('Select a session');
                    return;
                }
                const sk = Number(key);
                state.sessionKey = sk;
                // clear caches except session-specific
                state.cache.drivers = null;
                state.cache.results = null;
                state.cache.stints = null;
                state.cache.weather = null;
                state.cache.laps = {};
                state.cache.carData = {};
                state.detailDriver = null;

                // load core data
                await loadCoreData(sk);
                renderCurrentTab();
            }

            // ---------- LOAD CORE DATA ----------
            async function loadCoreData(sessionKey) {
                const cache = state.cache;
                try {
                    const [drivers, results, stints] = await Promise.all([
                        fetchAPI(`/drivers?session_key=${sessionKey}`),
                        fetchAPI(`/session_results?session_key=${sessionKey}`),
                        fetchAPI(`/stints?session_key=${sessionKey}`),
                    ]);
                    cache.drivers = drivers;
                    cache.results = results;
                    cache.stints = stints;
                } catch (err) {
                    console.warn('Failed to load core data', err);
                    cache.drivers = [];
                    cache.results = [];
                    cache.stints = [];
                }
                // optional weather
                try {
                    const weather = await fetchAPI(`/weather?session_key=${sessionKey}`);
                    cache.weather = weather;
                } catch (_) { cache.weather = null; }
            }

            // ---------- LOAD LAPS (for a driver) ----------
            async function loadLapsForDriver(sessionKey, driverNumber) {
                const cache = state.cache;
                if (cache.laps[driverNumber]) return cache.laps[driverNumber];
                try {
                    const data = await fetchAPI(`/laps?session_key=${sessionKey}&driver_number=${driverNumber}`);
                    cache.laps[driverNumber] = data;
                    return data;
                } catch (_) {
                    cache.laps[driverNumber] = [];
                    return [];
                }
            }

            // ---------- LOAD CAR DATA (for duels) ----------
            async function loadCarDataForDriver(sessionKey, driverNumber) {
                const cache = state.cache;
                if (cache.carData[driverNumber]) return cache.carData[driverNumber];
                try {
                    const data = await fetchAPI(`/car_data?session_key=${sessionKey}&driver_number=${driverNumber}`);
                    cache.carData[driverNumber] = data;
                    return data;
                } catch (_) {
                    cache.carData[driverNumber] = [];
                    return [];
                }
            }

            // ---------- RENDER ----------
            function renderEmpty(msg = 'No data') {
                content.innerHTML = `<div class="empty-state"><span>📋</span><p>${msg}</p></div>`;
            }

            function renderCurrentTab() {
                if (state.detailDriver) {
                    renderDriverDetail();
                    return;
                }
                const tab = state.activeTab;
                if (tab === 'order') renderOrder();
                else if (tab === 'insights') renderInsights();
                else if (tab === 'duels') renderDuels();
                else renderEmpty('Unknown tab');
            }

            // ---------- ORDER ----------
            function renderOrder() {
                const results = state.cache.results || [];
                const drivers = state.cache.drivers || [];
                if (!results.length) {
                    content.innerHTML = `<div class="empty-state"><span>🏁</span><p>No results for this session</p></div>`;
                    return;
                }
                // map driver_number -> driver
                const driverMap = {};
                drivers.forEach(d => { driverMap[d.driver_number] = d; });

                let html = '<div class="order-list">';
                // sort by position
                const sorted = [...results].sort((a, b) => (a.position || 999) - (b.position || 999));
                sorted.forEach(r => {
                    const dn = r.driver_number;
                    const d = driverMap[dn] || {};
                    const pos = r.position || '—';
                    const name = safeName(d) || safeName(r) || `#${dn}`;
                    const abbr = abbrName(d) || abbrName(r) || dn;
                    const gap = r.time || r.gap_to_leader || '';
                    const status = r.status || r.finish_status || '';
                    const cls = statusClass(status);
                    html += `<div class="order-row" data-driver="${dn}" data-name="${name}">
                        <span class="pos">${pos}</span>
                        <span class="name">${name}</span>
                        <span class="abbr">${abbr}</span>
                        <span class="gap">${gap}</span>
                        <span class="status ${cls}">${status || '—'}</span>
                    </div>`;
                });
                html += '</div>';
                content.innerHTML = html;

                // click handlers
                content.querySelectorAll('.order-row').forEach(row => {
                    row.addEventListener('click', () => {
                        const dn = row.dataset.driver;
                        if (dn) {
                            state.detailDriver = Number(dn);
                            renderDriverDetail();
                        }
                    });
                });
            }

            // ---------- DRIVER DETAIL ----------
            async function renderDriverDetail() {
                const dn = state.detailDriver;
                if (!dn) { renderCurrentTab(); return; }

                const drivers = state.cache.drivers || [];
                const d = drivers.find(drv => drv.driver_number === dn) || {};
                const name = safeName(d) || `Driver #${dn}`;

                // load laps if not cached
                const laps = await loadLapsForDriver(state.sessionKey, dn);

                // stints for tyre mapping
                const stints = (state.cache.stints || []).filter(s => s.driver_number === dn);
                // build tyre map: lap_start -> compound
                const tyreMap = {};
                stints.forEach(st => {
                    const start = st.lap_start || 1;
                    const end = st.lap_end || 999;
                    const compound = st.compound || st.tyre_compound || '';
                    for (let i = start; i <= end; i++) {
                        tyreMap[i] = compound;
                    }
                });

                let html = `<div class="detail-view">
                    <div class="detail-header">
                        <button class="back-btn" id="detailBack">← Back</button>
                        <h2>${name}  <span style="font-size:0.7rem;color:#6a7a88;font-weight:400;">#${dn}</span></h2>
                    </div>
                    <div class="detail-laps">`;

                if (laps.length) {
                    const sorted = [...laps].sort((a, b) => (a.lap_number || 0) - (b.lap_number || 0));
                    sorted.forEach(lap => {
                        const ln = lap.lap_number || '—';
                        const time = lap.lap_duration ? formatTime(lap.lap_duration * 1000) : '—';
                        const compound = tyreMap[ln] || lap.tyre_compound || '';
                        const tyreCls = getTyreClass(compound);
                        const sector1 = lap.sector1_time ? formatTime(lap.sector1_time * 1000) : '';
                        const sector2 = lap.sector2_time ? formatTime(lap.sector2_time * 1000) : '';
                        const sector3 = lap.sector3_time ? formatTime(lap.sector3_time * 1000) : '';
                        const sectors = [sector1, sector2, sector3].filter(Boolean).join(' | ');
                        html += `<div class="lap-row">
                            <span class="lap-num">Lap ${ln}</span>
                            <span class="lap-time">${time}</span>
                            <span class="tyre ${tyreCls}">${compound || '—'}</span>
                            <span class="sector">${sectors || '—'}</span>
                        </div>`;
                    });
                } else {
                    html += `<p style="color:#6a7a88;padding:12px;">No lap data available</p>`;
                }

                html += `</div></div>`;
                content.innerHTML = html;

                document.getElementById('detailBack')?.addEventListener('click', () => {
                    state.detailDriver = null;
                    renderCurrentTab();
                });
            }

            // ---------- INSIGHTS ----------
            function renderInsights() {
                const results = state.cache.results || [];
                const drivers = state.cache.drivers || [];
                const stints = state.cache.stints || [];
                const weather = state.cache.weather || [];

                if (!results.length) {
                    content.innerHTML = `<div class="empty-state"><span>🔍</span><p>No data for insights</p></div>`;
                    return;
                }

                const driverMap = {};
                drivers.forEach(d => { driverMap[d.driver_number] = d; });

                // 1. winner & gaps
                const sorted = [...results].sort((a, b) => (a.position || 999) - (b.position || 999));
                const winner = sorted[0];
                const winnerName = safeName(driverMap[winner?.driver_number]) || '—';
                const gapToSecond = sorted[1]?.time || sorted[1]?.gap_to_leader || '—';

                // 2. tyre strategies: count compounds per driver
                const tyreCounts = {};
                stints.forEach(s => {
                    const dn = s.driver_number;
                    const comp = s.compound || s.tyre_compound || 'unknown';
                    if (!tyreCounts[dn]) tyreCounts[dn] = {};
                    tyreCounts[dn][comp] = (tyreCounts[dn][comp] || 0) + 1;
                });
                let strategySummary = '';
                const stratEntries = Object.entries(tyreCounts).slice(0, 6);
                if (stratEntries.length) {
                    strategySummary = stratEntries.map(([dn, counts]) => {
                        const name = safeName(driverMap[Number(dn)]) || `#${dn}`;
                        const parts = Object.entries(counts).map(([c, n]) => `${c} (${n})`).join(', ');
                        return `<span style="display:block;">${name}: ${parts}</span>`;
                    }).join('');
                } else {
                    strategySummary = 'No stint data available';
                }

                // 3. weather
                let weatherSummary = '—';
                if (weather.length) {
                    const w = weather[weather.length - 1];
                    const temp = w.air_temperature || w.temperature || '';
                    const cond = w.condition || w.weather || '';
                    weatherSummary = `${cond} ${temp}°C`.trim();
                }

                // 4. position changes (if we have laps we could compute, but we'll skip for light)
                const html = `
                    <div class="insights-grid">
                        <div class="insight-card">
                            <h3>🏆 Winner</h3>
                            <div class="value">${winnerName}</div>
                            <div style="font-size:0.7rem;color:#6a7a88;">Gap to 2nd: ${gapToSecond}</div>
                        </div>
                        <div class="insight-card">
                            <h3>🌤️ Weather</h3>
                            <div class="value">${weatherSummary}</div>
                        </div>
                        <div class="insight-card" style="grid-column: 1 / -1;">
                            <h3>🔧 Tyre Strategies</h3>
                            <div class="list">${strategySummary}</div>
                        </div>
                        <div class="insight-card" style="grid-column: 1 / -1;">
                            <h3>📊 Field</h3>
                            <div class="list">${sorted.slice(0, 8).map((r, i) => {
                                const dn = r.driver_number;
                                const name = safeName(driverMap[dn]) || `#${dn}`;
                                const pos = r.position || i+1;
                                return `<span>${pos}. ${name}  <span style="color:#6a7a88;">${r.time || r.gap_to_leader || ''}</span></span>`;
                            }).join('<br>')}</div>
                        </div>
                    </div>
                `;
                content.innerHTML = html;
            }

            // ---------- DUELS ----------
            function renderDuels() {
                const drivers = state.cache.drivers || [];
                if (!drivers.length) {
                    content.innerHTML = `<div class="empty-state"><span>⚔️</span><p>Load a session first</p></div>`;
                    return;
                }

                // Build driver options
                const opts = drivers.map(d =>
                    `<option value="${d.driver_number}">${safeName(d)} (${abbrName(d)})</option>`
                ).join('');

                let html = `
                    <div class="duels-panel">
                        <div class="duels-selectors">
                            ${[0,1,2,3].map(i => `
                                <div class="driver-pick">
                                    <label>#${i+1}</label>
                                    <select class="duel-driver-select" data-idx="${i}">
                                        <option value="">—</option>
                                        ${opts}
                                    </select>
                                </div>
                            `).join('')}
                            <button class="compare-btn" id="duelCompare">Compare</button>
                        </div>
                        <div class="duels-charts" id="duelChartsContainer"></div>
                    </div>
                `;
                content.innerHTML = html;

                // restore selections
                const selects = content.querySelectorAll('.duel-driver-select');
                selects.forEach((sel, i) => {
                    if (state.duelDrivers[i]) sel.value = state.duelDrivers[i];
                    sel.addEventListener('change', () => {
                        state.duelDrivers[i] = sel.value ? Number(sel.value) : null;
                    });
                });

                document.getElementById('duelCompare')?.addEventListener('click', async () => {
                    const selected = state.duelDrivers.filter(d => d !== null);
                    if (selected.length < 2) {
                        alert('Select at least 2 drivers to compare');
                        return;
                    }
                    // fetch car data for each
                    const container = document.getElementById('duelChartsContainer');
                    container.innerHTML = '<div style="color:#6a7a88;padding:12px;">Loading telemetry…</div>';

                    try {
                        const promises = selected.map(dn => loadCarDataForDriver(state.sessionKey, dn));
                        const results = await Promise.all(promises);
                        // map driverNumber -> data
                        const dataMap = {};
                        selected.forEach((dn, i) => {
                            dataMap[dn] = results[i] || [];
                        });
                        // downsample and render charts
                        renderDuelCharts(dataMap, drivers);
                    } catch (err) {
                        console.warn('Failed to load car data', err);
                        container.innerHTML = '<div style="color:#f87171;padding:12px;">Failed to load telemetry data</div>';
                    }
                });
            }

            function renderDuelCharts(dataMap, drivers) {
                const container = document.getElementById('duelChartsContainer');
                if (!container) return;
                container.innerHTML = '';

                // destroy old charts
                state.duelCharts.forEach(c => c.destroy());
                state.duelCharts = [];

                const driverNames = {};
                drivers.forEach(d => { driverNames[d.driver_number] = safeName(d) || `#${d.driver_number}`; });

                // metrics to plot
                const metrics = [
                    { key: 'speed', label: 'Speed (km/h)', color: '#e10600' },
                    { key: 'rpm', label: 'RPM', color: '#f5a623' },
                    { key: 'throttle', label: 'Throttle (%)', color: '#4ade80' },
                    { key: 'brake', label: 'Brake (%)', color: '#60a5fa' },
                ];

                const colors = ['#e10600', '#f5a623', '#4ade80', '#60a5fa', '#a78bfa', '#f472b6'];

                metrics.forEach((metric, mi) => {
                    const box = document.createElement('div');
                    box.className = 'chart-box';
                    const title = document.createElement('h4');
                    title.textContent = metric.label;
                    box.appendChild(title);
                    const canvas = document.createElement('canvas');
                    canvas.id = `duelChart-${mi}`;
                    box.appendChild(canvas);
                    container.appendChild(box);

                    const datasets = [];
                    let idx = 0;
                    for (const [dn, rawData] of Object.entries(dataMap)) {
                        if (!rawData || !rawData.length) continue;
                        const downsampled = downsampleTelemetry(rawData, 200);
                        const points = downsampled.map(d => d[metric.key]).filter(v => v !== null && v !== undefined);
                        if (!points.length) continue;
                        const name = driverNames[Number(dn)] || `#${dn}`;
                        datasets.push({
                            label: name,
                            data: points,
                            borderColor: colors[idx % colors.length],
                            backgroundColor: 'transparent',
                            borderWidth: 1.5,
                            pointRadius: 0,
                            tension: 0.1,
                        });
                        idx++;
                    }

                    if (!datasets.length) {
                        box.innerHTML += '<div style="color:#6a7a88;padding:4px 0;font-size:0.7rem;">No data</div>';
                        return;
                    }

                    const ctx = canvas.getContext('2d');
                    const chart = new Chart(ctx, {
                        type: 'line',
                        data: { datasets },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    labels: { color: '#8a9aa8', boxWidth: 10, padding: 8, font: { size: 9 } }
                                },
                                tooltip: {
                                    callbacks: {
                                        label: function(ctx) {
                                            return ctx.dataset.label + ': ' + ctx.parsed.y;
                                        }
                                    }
                                }
                            },
                            scales: {
                                x: {
                                    display: false,
                                },
                                y: {
                                    ticks: { color: '#6a7a88', font: { size: 8 } },
                                    grid: { color: '#1f2a36' },
                                }
                            },
                            elements: {
                                line: { borderWidth: 1.5 },
                                point: { radius: 0 }
                            }
                        }
                    });
                    state.duelCharts.push(chart);
                    // force canvas height
                    canvas.style.height = '100px';
                });
            }

            // ---------- TAB SWITCHING ----------
            function switchTab(tab) {
                state.activeTab = tab;
                tabBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.tab === tab);
                });
                state.detailDriver = null;
                renderCurrentTab();
            }

            // ---------- INIT ----------
            async function init() {
                // tab clicks
                tabBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        switchTab(btn.dataset.tab);
                    });
                });

                // selectors
                elYear.addEventListener('change', onYearChange);
                elGP.addEventListener('change', onGPChange);
                elSession.addEventListener('change', onSessionChange);

                await loadYears();

                // load initial session if pre-selected
                if (elSession.value) {
                    await onSessionChange();
                }
            }

            // ---------- START ----------
            document.addEventListener('DOMContentLoaded', init);

        })();
    </script>
</body>
</html>
