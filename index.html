// ========== NETWORK LAYER ==========
// Every OpenF1 call goes through one queue: duplicate requests share one
// download, calls are spaced out, 429/5xx responses are retried with backoff,
// and failures are recorded so the UI can say so (an empty list used to hide
// them). Finished sessions are saved in the browser (IndexedDB) so they are
// only ever downloaded once.
const OPENF1='https://api.openf1.org/v1/';
const NET={bytes:0,requests:0,cacheHits:0,failed:new Map(),slow:false,stamps:[]};
const NET_MIN_GAP_MS=350;   // spacing between request starts
const NET_PARALLEL=2;
const NET_RETRIES=3;
const NET_SAFE_PER_MIN=26;  // only applied after the first 429
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const inflight=new Map();
let netQueue=[],netActive=0,netLastStart=0;

function api(endpoint){
  if(inflight.has(endpoint))return inflight.get(endpoint);
  const p=new Promise(resolve=>{netQueue.push({endpoint,resolve});pumpNet()});
  inflight.set(endpoint,p);
  p.finally(()=>inflight.delete(endpoint));
  return p;
}
function pumpNet(){
  while(netActive<NET_PARALLEL&&netQueue.length){
    let wait=Math.max(0,netLastStart+NET_MIN_GAP_MS-Date.now());
    if(NET.slow){
      const now=Date.now();
      NET.stamps=NET.stamps.filter(t=>now-t<60000);
      if(NET.stamps.length>=NET_SAFE_PER_MIN)wait=Math.max(wait,60000-(now-NET.stamps[0])+50);
    }
    if(wait>0){setTimeout(pumpNet,wait);return}
    const job=netQueue.shift();
    netActive++;netLastStart=Date.now();NET.stamps.push(netLastStart);
    fetchWithRetry(job.endpoint).then(job.resolve).finally(()=>{netActive--;pumpNet()});
  }
}
async function fetchWithRetry(endpoint){
  let delay=1500,lastStatus=null;
  for(let attempt=0;attempt<=NET_RETRIES;attempt++){
    try{
      const r=await fetch(OPENF1+endpoint);
      if(r.ok){
        const text=await r.text();
        NET.bytes+=text.length;NET.requests++;NET.failed.delete(endpoint);
        updateMeter();
        return JSON.parse(text);
      }
      if(r.status===404){NET.requests++;NET.failed.delete(endpoint);return[]} // OpenF1 answers 404 for "no rows"
      lastStatus=r.status;
      if(r.status===429)NET.slow=true;
      if(r.status===429||r.status>=500){
        const ra=parseFloat(r.headers.get('retry-after'));
        await sleep(ra>0?ra*1000:delay);delay*=2;continue;
      }
      break;
    }catch(e){lastStatus='network';await sleep(delay);delay*=2}
  }
  NET.failed.set(endpoint,lastStatus||'error');
  updateMeter();
  return[];
}

// ---- data meter + error banner ----
function fmtBytes(b){return b<1024?`${b} B`:b<1048576?`${Math.round(b/1024)} KB`:`${(b/1048576).toFixed(1)} MB`}
function updateMeter(){
  const el=document.getElementById('dataMeter');if(!el)return;
  el.textContent=fmtBytes(NET.bytes);
  el.classList.toggle('warn',NET.failed.size>0);
  showNetBanner();
}
let netPanelOpen=false;
function toggleNetPanel(){netPanelOpen=!netPanelOpen;showNetBanner()}
function showNetBanner(){
  const b=document.getElementById('netBanner');if(!b)return;
  const failed=[...NET.failed.entries()];
  if(!failed.length&&!netPanelOpen){b.hidden=true;return}
  b.hidden=false;
  const names=[...new Set(failed.map(([e])=>e.split('?')[0]))].join(', ');
  let html='';
  if(failed.length)html+=`<b>Some data didn’t load</b> (${names}${failed[0][1]===429?' — rate limited':''}). `+
    `<button onclick="retryFailed()">Retry</button><br>`;
  if(netPanelOpen)html+=`<div class="net-panel">Downloaded ${fmtBytes(NET.bytes)} (uncompressed) in ${NET.requests} requests · ${NET.cacheHits} served from this device</div>`;
  b.innerHTML=html;
}
async function retryFailed(){
  NET.failed.clear();updateMeter();
  if(sessionKey)await loadSessionData(true);
}

// ---- on-device store ----
let _idb=null;
function idb(){
  if(_idb)return _idb;
  _idb=new Promise(res=>{
    try{
      const rq=indexedDB.open('f1lab',1);
      rq.onupgradeneeded=()=>rq.result.createObjectStore('kv');
      rq.onsuccess=()=>res(rq.result);
      rq.onerror=()=>res(null);
    }catch{res(null)}
  });
  return _idb;
}
async function kvGet(k){
  const db=await idb();if(!db)return null;
  return new Promise(res=>{try{const rq=db.transaction('kv').objectStore('kv').get(k);rq.onsuccess=()=>res(rq.result??null);rq.onerror=()=>res(null)}catch{res(null)}});
}
async function kvSet(k,v){
  const db=await idb();if(!db)return;
  return new Promise(res=>{try{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>res()}catch{res()}});
}

// Cached list-type requests (meetings, sessions, drivers). Past data never
// changes, so it is kept for a long time; the current year's calendar for hours.
const DAY=86400000;
async function apiCached(endpoint,ttl){
  const k='ep:'+endpoint;
  const hit=await kvGet(k);
  if(hit&&Date.now()-hit.t<ttl&&hit.data&&hit.data.length){NET.cacheHits++;updateMeter();return hit.data}
  const data=await api(endpoint);
  if(data.length)kvSet(k,{t:Date.now(),data});
  return data;
}
function listTtl(endpoint){
  const y=(endpoint.match(/year=(\d{4})/)||[])[1];
  if(y&&+y>=new Date().getFullYear())return 6*3600000;
  return 30*DAY;
}

// ========== TYRE BADGES ==========
const TYRE_STYLE={SOFT:['#ff3b4e','#ffffff'],MEDIUM:['#ffd23f','#1a1500'],HARD:['#f1f3f8','#10131a'],INTERMEDIATE:['#3ddc84','#04180c'],WET:['#4aa3ff','#04101f']};
function tyreKey(c){const u=(c||'').toUpperCase();if(u.includes('SOFT'))return'SOFT';if(u.includes('MED'))return'MEDIUM';if(u.includes('HARD'))return'HARD';if(u.includes('INTER'))return'INTERMEDIATE';if(u.includes('WET'))return'WET';return null}
function tyreBadge(c,size){
  const [bg,fg]=TYRE_STYLE[tyreKey(c)]||['#8a93a8','#0b0f18'];
  return `<span class="tyre" style="--c:${bg};--tc:${fg};${size?`--ts:${size}px`:''}">${tyreLetter(c)}</span>`;
}
function tyreName(c){const k=tyreKey(c);return k?k[0]+k.slice(1).toLowerCase():'Unknown'}
function tyreAgeTag(age){return(age==null||age===0)?'new':`${age} lap${age===1?'':'s'} old`}
const hardness=c=>({SOFT:1,MEDIUM:2,HARD:3,INTERMEDIATE:4,WET:5})[tyreKey(c)]||9;

// ========== LAP READING ==========
// Laps are read the way a person reads a timing sheet: by what sits next to
// them. A lap is judged against its neighbours and against the same driver's
// other laps, never against a fixed number of seconds.
//  - pit laps come from the out-lap flag, a missing first sector, or a new stint
//  - what is left is split into runs between pit visits
//  - a run whose laps jump around is push laps with slow laps between them;
//    a steady run is a long run, with the odd lap out marked as an anomaly
const NOISE_FLOOR=0.005; // 0.5% of lap time: below this a lap is never "odd" (timing resolution guard)
const Z_ODD=3.5;         // modified z-score convention for an odd one out
const MIN_RUN_LAPS=4;    // fewest steady laps worth fitting a trend to
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const sectorsOf=l=>[l.duration_sector_1||null,l.duration_sector_2||null,l.duration_sector_3||null];
function slope(xs,ys){
  const n=xs.length;if(n<2)return null;
  const mx=avg(xs),my=avg(ys);let num=0,den=0;
  for(let i=0;i<n;i++){num+=(xs[i]-mx)*(ys[i]-my);den+=(xs[i]-mx)**2}
  return den>0?num/den:null;
}
function fitLine(xs,ys){const b=slope(xs,ys);return b==null?null:{a:avg(ys)-b*avg(xs),b}}

let _lbd=null;
const lapReadCache=new Map();
function invalidateReads(){_lbd=null;lapReadCache.clear();_fieldPaceCache=null}
function lapsOf(dn){if(!_lbd)_lbd=lapsByDriverMap();return _lbd.get(dn)||[]}

function readDriverLaps(laps,stints,scRanges,raceLike){
  const st=[...stints].sort((a,b)=>(a.lap_start||0)-(b.lap_start||0));
  const stintAt=n=>{let k=-1;for(let i=0;i<st.length;i++)if(st[i].lap_start<=n)k=i;return k};
  const recs=laps.map(l=>{
    const si=stintAt(l.lap_number),s=si>=0?st[si]:null;
    return{lap:l.lap_number,time:l.lap_duration>0?l.lap_duration:null,s:sectorsOf(l),
      compound:s?.compound||null,stint:si,age:s?(s.tyre_age_at_start||0)+(l.lap_number-s.lap_start):null,
      raw:l,marker:null,kind:null,where:null};
  });
  const byLap=new Map(recs.map(r=>[r.lap,r]));

  // pit visits
  for(const r of recs){
    const stintStart=r.stint>0&&st[r.stint].lap_start===r.lap;
    const noS1=r.time!=null&&r.s[0]==null&&(!raceLike||r.lap>1);
    if(r.raw.is_pit_out_lap||stintStart||noS1)r.marker='OUTPIT';
  }
  for(const r of recs){
    if(r.marker==='OUTPIT')continue;
    const next=byLap.get(r.lap+1);
    const endsStint=r.stint>=0&&r.stint<st.length-1&&st[r.stint].lap_end===r.lap;
    if((next&&next.marker==='OUTPIT')||endsStint)r.marker='INPIT';
  }
  for(const r of recs)if(!r.marker&&inAnyRange(r.lap,scRanges))r.kind='sc';

  // runs of consecutive track laps
  const isTrack=r=>!r.marker&&!r.kind&&r.time!=null;
  const runs=[];let cur=[];
  for(const r of recs){
    if(isTrack(r)&&(!cur.length||r.lap===cur[cur.length-1].lap+1))cur.push(r);
    else{if(cur.length)runs.push(cur);cur=isTrack(r)?[r]:[]}
  }
  if(cur.length)runs.push(cur);
  const driverMedian=median(recs.filter(isTrack).map(r=>r.time));
  for(const run of runs)classifyRun(run,driverMedian);

  for(const r of recs){
    if(!r.kind)r.kind=r.marker==='OUTPIT'?'out':r.marker==='INPIT'?'in':(r.time==null?'untimed':'run');
  }
  return recs;
}

function classifyRun(run,driverMedian){
  const n=run.length,t=run.map(r=>r.time);
  if(n===1){run[0].kind=run[0].time<=driverMedian?'push':'cooldown';return}
  // Group laps that sit close together in time (sorted, split wherever a gap is
  // wider than normal lap-to-lap scatter). A steady run has one big group of
  // similar laps; a push/slow-lap run has no group holding most of its laps.
  const tol=Z_ODD*NOISE_FLOOR*median(t);
  const order=t.map((_,i)=>i).sort((a,b)=>t[a]-t[b]);
  const clusters=[[order[0]]];
  for(let k=1;k<n;k++){
    if(t[order[k]]-t[order[k-1]]>tol)clusters.push([order[k]]);else clusters[clusters.length-1].push(order[k]);
  }
  const main=clusters.reduce((a,b)=>b.length>a.length?b:a);

  if(main.length>n/2){ // steady run, with the odd lap out marked
    const inMain=new Set(main);
    const mainLaps=main.map(i=>run[i]);
    const mainMin=Math.min(...main.map(i=>t[i]));
    const secMed=k=>median(mainLaps.map(r=>r.s[k]).filter(v=>v!=null));
    const outliers=run.map((_,i)=>i).filter(i=>!inMain.has(i));
    const slower=i=>t[i]>mainMin;
    // trailing laps that are all slower together are tyre fade, not one-offs
    let tail=n;while(tail>0&&!inMain.has(tail-1)&&slower(tail-1))tail--;
    const fade=n-tail>=2?new Set(run.map((_,i)=>i).filter(i=>i>=tail)):new Set();
    run.forEach((r,i)=>{
      if(inMain.has(i)||fade.has(i)){r.kind='run';return}
      if(!slower(i)){r.kind='anomaly';return}
      const dev=r.s.map((v,k)=>{const m=secMed(k);return(v!=null&&m)?{k,d:(v-m)/m}:null}).filter(Boolean).sort((a,b)=>b.d-a.d);
      if(dev.length>=2&&dev[0].d>0&&dev[0].d>=2*Math.max(dev[1].d,1e-9)){r.kind='anomaly';r.where=`S${dev[0].k+1}`}
      else r.kind='slow';
    });
    return;
  }
  // mixed run: quick laps (push) and slow laps (warm-up, cool-down, aborted)
  const lg=t.map(Math.log);
  let c1=Math.min(...lg),c2=Math.max(...lg);
  for(let it=0;it<12;it++){
    const a=[],b=[];lg.forEach(v=>(Math.abs(v-c1)<=Math.abs(v-c2)?a:b).push(v));
    if(!a.length||!b.length)break;
    c1=avg(a);c2=avg(b);
  }
  const quick=lg.map(v=>Math.abs(v-c1)<=Math.abs(v-c2));
  if(quick.every(Boolean)||!quick.some(Boolean)){run.forEach(r=>r.kind='run');return}
  const fastLaps=run.filter((_,i)=>quick[i]),slowLaps=run.filter((_,i)=>!quick[i]);
  const cen=(arr,k)=>median(arr.map(r=>r.s[k]).filter(v=>v!=null));
  const firstQuick=quick.indexOf(true);
  run.forEach((r,i)=>{
    if(quick[i]){r.kind='push';return}
    const like=r.s.map((v,k)=>{const f=cen(fastLaps,k),sl=cen(slowLaps,k);return(v==null||f==null||sl==null)?null:Math.abs(v-f)<Math.abs(v-sl)});
    const startedQuick=like[0]===true,laterSlow=like.slice(1).some(x=>x===false);
    r.kind=(startedQuick&&laterSlow)?'aborted':(i<firstQuick?'warmup':'cooldown');
  });
}

function getLapRead(dn){
  if(lapReadCache.has(dn))return lapReadCache.get(dn);
  const rec=readDriverLaps(lapsOf(dn),lastStintMap.get(dn)||[],safetyCarLapRanges(),isRaceOrSprintSession());
  lapReadCache.set(dn,rec);
  return rec;
}

const KIND_LABEL={out:'Out lap',in:'In lap',push:'Push',warmup:'Warm-up',cooldown:'Cool-down',aborted:'Aborted push',run:'Run',anomaly:'One-off',slow:'Slow lap',sc:'SC/VSC',untimed:'No time'};

// ========== WEATHER PER LAP ==========
let _wxSorted=null,_wxSource=null;
function weatherAtMs(ms){
  if(!cachedWeather||!cachedWeather.length||!isFinite(ms))return null;
  if(_wxSource!==cachedWeather){
    _wxSorted=cachedWeather.map(w=>({ms:new Date(w.date).getTime(),w})).filter(x=>isFinite(x.ms)).sort((a,b)=>a.ms-b.ms);
    _wxSource=cachedWeather;
  }
  let hit=null;
  for(const x of _wxSorted){if(x.ms<=ms)hit=x.w;else break}
  return hit;
}
function lapWeather(rec){
  if(!rec.raw.date_start||rec.time==null)return null;
  return weatherAtMs(new Date(rec.raw.date_start).getTime()+rec.time*1000);
}

// ========== STINT STATS ==========
// Replaces the old median x1.15 filter. Pace and degradation use steady running
// laps only; push laps are reported separately as best_push_lap.
function computeStintStats(driverStints,driverLaps,dn){
  const recs=dn!=null?getLapRead(dn):readDriverLaps(driverLaps,driverStints,safetyCarLapRanges(),isRaceOrSprintSession());
  const st=[...driverStints].sort((a,b)=>(a.lap_start||0)-(b.lap_start||0));
  return st.map((s,si)=>{
    const mine=recs.filter(r=>r.stint===si);
    const run=mine.filter(r=>r.kind==='run'),push=mine.filter(r=>r.kind==='push');
    const deg=run.length>=MIN_RUN_LAPS?slope(run.map(r=>r.lap),run.map(r=>r.time)):null;
    const runType=run.length>=MIN_RUN_LAPS&&run.length>=push.length?'long_run':push.length?'push_run':run.length?'short_run':'no_pace_laps';
    const wx=mine.map(lapWeather);
    return{
      compound:s.compound||'UNKNOWN',lap_start:s.lap_start,lap_end:s.lap_end||null,
      tyre_age_at_start:s.tyre_age_at_start??null,
      stint_laps:mine.length,laps:run.length,push_laps:push.length,
      avg_lap:run.length?+avg(run.map(r=>r.time)).toFixed(3):null,
      deg_per_lap:deg==null?null:+deg.toFixed(3),
      best_push_lap:push.length?+Math.min(...push.map(r=>r.time)).toFixed(3):null,
      excluded_outlier_laps:mine.filter(r=>r.time!=null&&r.kind!=='run'&&r.kind!=='push').length,
      run_type:runType,
      lap_detail:mine.map((r,i)=>{
        const w=wx[i];
        return{lap:r.lap,time:r.time!=null?+r.time.toFixed(3):null,
          s1:r.s[0],s2:r.s[1],s3:r.s[2],marker:r.marker,kind:r.kind,...(r.where?{odd_sector:r.where}:{}),
          air_c:w?.air_temperature??null,track_c:w?.track_temperature??null,
          humidity_pct:w?.humidity??null,rainfall:w?.rainfall??null,wind_ms:w?.wind_speed??null};
      })
    };
  });
}

// ========== TYRE ANALYSIS (per driver) ==========
// Compares compounds on cleaned laps only, within one driver, so car
// differences cancel out. Fuel load is unknown and is not corrected for.
function compoundFits(recs){
  const by=new Map();
  for(const r of recs){
    const k=tyreKey(r.compound);if(!k)continue;
    if(!by.has(k))by.set(k,{key:k,compound:r.compound,run:[],push:[]});
    if(r.kind==='run'&&r.age!=null)by.get(k).run.push(r);
    if(r.kind==='push')by.get(k).push.push(r);
  }
  const out=[];
  for(const c of by.values()){
    const ages=c.run.map(r=>r.age);
    const distinct=new Set(ages).size;
    const fit=c.run.length>=MIN_RUN_LAPS&&distinct>=3?fitLine(ages,c.run.map(r=>r.time)):null;
    out.push({key:c.key,compound:c.compound,runLaps:c.run.length,fit,
      bestPush:c.push.length?Math.min(...c.push.map(r=>r.time)):null,
      ages:ages});
  }
  return out.sort((a,b)=>hardness(a.compound)-hardness(b.compound));
}

function longestRun(recs){
  let best=null,cur=[];
  const flush=()=>{if(cur.length&&(!best||cur.length>best.length))best=cur;cur=[]};
  for(const r of recs){
    if(r.kind==='run'&&(!cur.length||(r.lap===cur[cur.length-1].lap+1&&r.stint===cur[0].stint)))cur.push(r);
    else{flush();if(r.kind==='run')cur=[r]}
  }
  flush();
  return best;
}

let _fieldPaceCache=null;
function racePaceFor(dn){
  const recs=getLapRead(dn);
  const run=longestRun(recs);
  const times=recs.filter(r=>r.time!=null&&['run','push'].includes(r.kind)).map(r=>r.time);
  if(!run||run.length<5||!times.length)return null;
  const best=Math.min(...times);
  const a=avg(run.map(r=>r.time));
  return{avg:a,laps:run.length,compound:run[0].compound,best,gap:a-best};
}
function fieldRacePace(){
  if(_fieldPaceCache)return _fieldPaceCache;
  const rows=[];
  for(const dn of driverMeta.keys()){const p=racePaceFor(dn);if(p)rows.push({dn,...p})}
  rows.sort((a,b)=>a.gap-b.gap);
  _fieldPaceCache=rows;
  return rows;
}

function warmupFor(recs,stintIdx){
  const mine=recs.filter(r=>r.stint===stintIdx);
  const run=mine.filter(r=>r.kind==='run');
  if(run.length>=MIN_RUN_LAPS){
    const times=run.map(r=>r.time),mn=Math.min(...times),idx=times.indexOf(mn);
    return{type:'run',peakLap:idx+1,firstOff:times[0]-mn,of:run.length};
  }
  const warm=mine.filter(r=>r.kind==='warmup').length;
  const firstPush=mine.find(r=>r.kind==='push');
  if(firstPush)return{type:'push',warmLaps:warm};
  return null;
}

function analyseDriver(dn){
  const recs=getLapRead(dn);
  const stints=[...(lastStintMap.get(dn)||[])].sort((a,b)=>(a.lap_start||0)-(b.lap_start||0));
  const fits=compoundFits(recs);
  const out={fits,lines:[]};

  // best tyre: one lap
  const withPush=fits.filter(f=>f.bestPush!=null);
  if(withPush.length>=2){
    const s=[...withPush].sort((a,b)=>a.bestPush-b.bestPush);
    out.bestOneLap={key:s[0].key,compound:s[0].compound,margin:s[1].bestPush-s[0].bestPush};
  }
  // best tyre: race pace, compared at the typical tyre age seen across the driver's running laps
  const fitted=fits.filter(f=>f.fit);
  if(fitted.length>=2){
    const allAges=fitted.flatMap(f=>f.ages);
    const at=median(allAges);
    const pred=fitted.map(f=>({f,t:f.fit.a+f.fit.b*at})).sort((a,b)=>a.t-b.t);
    out.bestRace={key:pred[0].f.key,compound:pred[0].f.compound,margin:pred[1].t-pred[0].t,atAge:Math.round(at)};
  }
  // crossover between neighbouring compounds
  out.crossovers=[];
  for(let i=0;i<fitted.length-1;i++){
    const soft=fitted[i],hard=fitted[i+1];
    const dA=hard.fit.a-soft.fit.a,dB=soft.fit.b-hard.fit.b;
    let text,lap=null;
    if(dA<=0)text=`${tyreName(hard.compound)} was already quicker than ${tyreName(soft.compound)} over the laps seen.`;
    else if(dB<=0)text=`${tyreName(soft.compound)} stays ahead of ${tyreName(hard.compound)} through the laps seen: it wears no faster.`;
    else{
      lap=dA/dB;
      text=lap>45?`${tyreName(hard.compound)} would only overtake ${tyreName(soft.compound)} well beyond a normal stint.`
        :`${tyreName(hard.compound)} becomes quicker than ${tyreName(soft.compound)} after about ${Math.round(lap)} laps on the tyre; ${tyreName(soft.compound)} loses ${dB.toFixed(3)} s a lap more.`;
    }
    out.crossovers.push({from:soft.compound,to:hard.compound,lap,text});
  }
  // race pace
  const rp=racePaceFor(dn);
  if(rp){
    const field=fieldRacePace();
    const rank=field.findIndex(x=>x.dn===dn)+1;
    out.racePace={...rp,rank,of:field.length};
  }
  // warm-up per stint
  out.warmups=stints.map((s,i)=>({compound:s.compound,stint:i,...(warmupFor(recs,i)||{})})).filter(w=>w.type);
  return out;
}

// ========== DUELS ==========
// Fastest-lap telemetry for up to 4 drivers, aligned by distance (speed is
// integrated into metres and every lap is scaled to the same lap length), so
// laps can be compared point for point. Four views: graphs, braking-zone
// stats, aero (corners and braking) and power (straights and exits).
const DUELS_MAX_DRIVERS=4;
const DUELS_COLORS=['#8ab4ff','#ff8fa3','#ffd76b','#7ee7b5'];
const GRID_N=600;          // points per lap after alignment
const MIN_BRAKE_STEPS=2;   // shortest braking event that counts as a zone
const FULL_THROTTLE=98;    // % at which the throttle counts as flat out
const BRAKE_WINDOW=40;     // grid steps searched around the reference brake point
const DRS_OPEN=10;         // OpenF1 drs values from 10 up mean open

let duelsPrepCache=null;
const fmtS=(x,d=3)=>(x>=0?'+':'−')+Math.abs(x).toFixed(d);
const gcls=x=>x>0.0005?'gain':x<-0.0005?'loss':'';
const ordinal=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};

function setDuelsView(view){duelsView=view;renderDuelsTab()}
function setDuelsReference(acronym){duelsReferenceDriver=acronym;renderDuelsTab()}
function toggleDuelsDriver(acronym){
  const idx=duelsSelectedDrivers.indexOf(acronym);
  if(idx>=0)duelsSelectedDrivers.splice(idx,1);
  else{if(duelsSelectedDrivers.length>=DUELS_MAX_DRIVERS)return;duelsSelectedDrivers.push(acronym)}
  renderDuelsTab();
}
function acronymToDriverNumber(acronym){for(const[dn,meta]of driverMeta)if(meta.acronym===acronym)return dn;return null}

// ---- data ----
function bestLapWindow(dn){
  let best=null;
  for(const lap of lapsOf(dn)){
    if(!(lap.lap_duration>0)||!lap.date_start)continue;
    if(!best||lap.lap_duration<best.lap_duration)best=lap;
  }
  if(!best)return null;
  const startMs=new Date(best.date_start).getTime();
  return{start:new Date(startMs).toISOString(),end:new Date(startMs+best.lap_duration*1000).toISOString(),startMs,lapDuration:best.lap_duration,lapNumber:best.lap_number};
}
function compactRows(rows,startMs){
  const s=[...rows].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const o={t:[],v:[],thr:[],brk:[],gear:[],rpm:[],drs:[]};
  for(const r of s){
    o.t.push(new Date(r.date).getTime()-startMs);o.v.push(r.speed||0);o.thr.push(r.throttle||0);
    o.brk.push(r.brake||0);o.gear.push(r.n_gear||0);o.rpm.push(r.rpm||0);o.drs.push(r.drs||0);
  }
  return o;
}
// Only drivers not already loaded are requested; each lap is kept on the device.
async function fetchDuelsTelemetry(){
  if(!sessionKey||!duelsSelectedDrivers.length)return;
  const key=sessionKey;
  duelsLoading=true;renderDuelsTab();
  try{
    const byDriver=duelsTelemetryCache.get(key)||{};
    await Promise.all(duelsSelectedDrivers.filter(a=>!byDriver[a]).map(async acr=>{
      const dn=acronymToDriverNumber(acr),win=dn!=null?bestLapWindow(dn):null;
      if(!win)return;
      const sk=`tel:${key}:${dn}:${win.lapNumber}`;
      let td=await kvGet(sk);
      if(td){NET.cacheHits++;updateMeter()}
      else{
        const rows=await api(`car_data?session_key=${key}&driver_number=${dn}&date>=${encodeURIComponent(win.start)}&date<=${encodeURIComponent(win.end)}`);
        if(rows.length<50)return;
        td=compactRows(rows,win.startMs);
        kvSet(sk,td);
      }
      byDriver[acr]={...td,fastest_lap_time:win.lapDuration,lap_number:win.lapNumber,top_speed_kmh:Math.max(...td.v)};
    }));
    duelsTelemetryCache.set(key,byDriver);
    duelsPrepCache=null;
  }catch(err){console.error('Duels telemetry failed:',err)}
  finally{duelsLoading=false;if(sessionKey===key)renderDuelsTab()}
}

// ---- alignment ----
function prepLap(td){
  const n=td.t.length,d=new Array(n);d[0]=0;
  for(let i=1;i<n;i++)d[i]=d[i-1]+((td.v[i]+td.v[i-1])/2/3.6)*((td.t[i]-td.t[i-1])/1000);
  return{d,total:d[n-1]};
}
function toGrid(td,pl,L){
  const n=td.t.length,s=L/pl.total,o={d:[],t:[],v:[],thr:[],brk:[],gear:[],rpm:[],drs:[]};
  let i=0;
  for(let j=0;j<GRID_N;j++){
    const g=j*L/(GRID_N-1);
    while(i<n-2&&pl.d[i+1]*s<g)i++;
    const d0=pl.d[i]*s,d1=pl.d[i+1]*s,f=d1>d0?Math.min(1,Math.max(0,(g-d0)/(d1-d0))):0;
    const lerp=a=>a[i]+(a[i+1]-a[i])*f,near=a=>f<.5?a[i]:a[i+1];
    o.d.push(g);o.t.push(lerp(td.t)/1000);o.v.push(lerp(td.v));o.thr.push(lerp(td.thr));
    o.brk.push(near(td.brk));o.gear.push(near(td.gear));o.rpm.push(lerp(td.rpm));o.drs.push(near(td.drs));
  }
  const t0=o.t[0];o.t=o.t.map(x=>x-t0);
  return o;
}
function duelPrep(byDriver,selected){
  const items=selected.filter(a=>byDriver[a]);
  const sig=sessionKey+'|'+items.map(a=>a+byDriver[a].lap_number).join(',');
  if(duelsPrepCache&&duelsPrepCache.sig===sig)return duelsPrepCache.val;
  const pls=items.map(a=>prepLap(byDriver[a]));
  const L=median(pls.map(p=>p.total));
  const g={};items.forEach((a,i)=>{g[a]=toGrid(byDriver[a],pls[i],L)});
  const val={items,L,g,step:L/(GRID_N-1)};
  duelsPrepCache={sig,val};
  return val;
}

// ---- segmentation, from the reference lap ----
// Each braking zone splits the lap into: brake -> mid-corner (to the slowest
// point) -> exit (to full throttle) -> straight (to the next braking zone).
function segmentLap(ref){
  const N=ref.v.length,onsets=[];
  for(let i=0;i<N;){
    if(ref.brk[i]>0&&(i===0||!(ref.brk[i-1]>0))){
      let j=i;while(j<N&&ref.brk[j]>0)j++;
      if(j-i>=MIN_BRAKE_STEPS)onsets.push({b:i,r:j});
      i=j;
    }else i++;
  }
  const zones=[],segs=[];
  if(onsets.length&&onsets[0].b>0)segs.push({type:'straight',from:0,to:onsets[0].b,zone:0});
  onsets.forEach((o,k)=>{
    const nextB=k+1<onsets.length?onsets[k+1].b:N-1;
    let f=nextB;
    for(let i=o.r;i<nextB;i++)if(ref.thr[i]>=FULL_THROTTLE){f=i;break}
    let a=o.b;for(let i=o.b;i<=f;i++)if(ref.v[i]<ref.v[a])a=i;
    const z={k:k+1,b:o.b,r:o.r,a,f,nextB};
    zones.push(z);
    const add=(type,from,to)=>{if(to>from)segs.push({type,from,to,zone:z.k})};
    add('brake',o.b,o.r);add('mid',o.r,Math.max(o.r,a));add('exit',Math.max(o.r,a),f);add('straight',f,nextB);
  });
  return{zones,segs};
}
const segTime=(g,from,to)=>g.t[to]-g.t[from];

function nearestOnset(g,idx){
  let best=null;
  for(let i=Math.max(1,idx-BRAKE_WINDOW);i<=Math.min(g.v.length-1,idx+BRAKE_WINDOW);i++){
    if(g.brk[i]>0&&!(g.brk[i-1]>0)&&(best===null||Math.abs(i-idx)<Math.abs(best-idx)))best=i;
  }
  return best;
}

// numbers for one driver against the reference
function duelMetrics(P,acr,refAcr){
  const g=P.g[acr],r=P.g[refAcr],{zones,segs}=segmentLap(r);
  const byType={brake:0,mid:0,exit:0,straight:0},segRows=[];
  for(const s of segs){
    const gain=-(segTime(g,s.from,s.to)-segTime(r,s.from,s.to)); // seconds, + = quicker than reference
    byType[s.type]+=gain;segRows.push({...s,gain});
  }
  const zoneRows=zones.map(z=>{
    const hi=Math.max(0,z.b-5);
    let apex=Infinity;for(let i=hi;i<=z.f;i++)apex=Math.min(apex,g.v[i]);
    let rApex=Infinity;for(let i=hi;i<=z.f;i++)rApex=Math.min(rApex,r.v[i]);
    const ob=nearestOnset(g,z.b);
    const dB=ob==null?null:(ob-z.b)*P.step; // + = brakes later
    let fx=null;for(let i=Math.max(hi,z.r);i<=z.nextB;i++)if(g.thr[i]>=FULL_THROTTLE){fx=i;break}
    const dF=fx==null?null:(fx-z.f)*P.step; // + = later to full throttle
    const gainBM=-(segTime(g,z.b,z.a)-segTime(r,z.b,z.a));
    const gainEX=-(segTime(g,z.a,z.f)-segTime(r,z.a,z.f));
    return{k:z.k,apex,rApex,dA:apex-rApex,dB,dF,gainBM,gainEX,entry:g.v[z.b],rEntry:r.v[z.b]};
  });
  const straightRows=zones.map((z,i)=>({z,i})).filter(({z})=>z.nextB-z.f>=6).map(({z})=>{
    const stats=gr=>{
      let pk=0,pi=z.f;for(let i=z.f;i<=z.nextB;i++)if(gr.v[i]>pk){pk=gr.v[i];pi=i}
      const q=Math.round(z.f+(z.nextB-z.f)*.75),end=Math.max(z.f,z.nextB-1);
      let coast=0;for(let i=end;i>=z.f&&gr.thr[i]<5&&!(gr.brk[i]>0);i--)coast++;
      const tail=[];for(let i=Math.round((z.f+z.nextB)/2);i<=z.nextB;i++)tail.push(gr.rpm[i]);
      const maxRpm=Math.max(...gr.rpm);
      return{pk,pull:gr.v[end]-gr.v[q],coast:coast*P.step,gear:gr.gear[pi],rpm:gr.rpm[pi],
        lim:tail.filter(x=>x>=maxRpm*.985).length/tail.length,len:(z.nextB-z.f)*P.step};
    };
    const a=stats(g),b=stats(r);
    return{k:z.k,start:z.f*P.step,len:a.len,a,b,
      gain:-(segTime(g,z.f,z.nextB)-segTime(r,z.f,z.nextB))};
  });
  return{byType,zoneRows,straightRows,segRows,zones};
}

// lap shares: time at full throttle / braking / coasting
function lapShares(g){
  let tot=0,full=0,brake=0,coast=0;
  for(let i=1;i<g.t.length;i++){
    const dt=g.t[i]-g.t[i-1];tot+=dt;
    if(g.brk[i]>0)brake+=dt;else if(g.thr[i]>=FULL_THROTTLE)full+=dt;else if(g.thr[i]<5)coast+=dt;
  }
  return{full:full/tot,brake:brake/tot,coast:coast/tot};
}
// open-wing (DRS) gain: speed added across the longest open window
function openGain(g){
  let best=null,i=0;
  while(i<g.drs.length){
    if(g.drs[i]>=DRS_OPEN){let j=i;while(j<g.drs.length&&g.drs[j]>=DRS_OPEN)j++;
      if(!best||j-i>best.len)best={len:j-i,gain:g.v[j-1]-g.v[i]};i=j}else i++;
  }
  return best;
}
// rpm per km/h in the top gear on flat-out samples: a proxy for how tall the gearing is
function gearingRatio(g){
  const top=Math.max(...g.gear);
  const xs=[];for(let i=0;i<g.v.length;i++)if(g.gear[i]===top&&g.thr[i]>=FULL_THROTTLE&&g.v[i]>150)xs.push(g.rpm[i]/g.v[i]);
  return xs.length>=5?{ratio:median(xs),gear:top}:null;
}

// ---- written readings ----
const BR_TOL_STEPS=1.5;
function zoneSentence(x,r,z,step){
  const tol=BR_TOL_STEPS*step,dB=z.dB,dA=z.dA;
  const later=dB!=null&&dB>tol,earlier=dB!=null&&dB<-tol,faster=dA>2,slower=dA<-2;
  const m=Math.abs(Math.round(dB||0)),k=Math.abs(Math.round(dA));
  let why;
  if(later&&!slower)why=`brakes ${m} m later and is no slower at the apex, so the late braking adds to the lap`;
  else if(later)why=`brakes ${m} m later but is ${k} km/h slower at the apex, so the late braking gives the gain back`;
  else if(earlier&&faster)why=`brakes ${m} m earlier but carries ${k} km/h more through the apex, trading braking distance for a cleaner corner`;
  else if(earlier)why=`brakes ${m} m earlier without being quicker at the apex, so it just gives time away`;
  else if(faster)why=`brakes at the same point but carries ${k} km/h more through the apex: more grip in the corner`;
  else if(slower)why=`brakes at the same point but is ${k} km/h slower at the apex: less grip in the corner`;
  else return null;
  return `<b>Zone ${z.k}</b>: ${x} ${why} (${fmtS(z.gainBM)} s).`;
}
function readAero(P,acr,ref){
  const M=duelMetrics(P,acr,ref),out=[];
  const net=M.byType.brake+M.byType.mid;
  out.push(`Through braking and mid-corner ${acr} is <b>${fmtS(net)} s</b> against ${ref}: ${Math.abs(net)<0.01?'effectively level':net>0?'this is where the lap is being gained':'this is where the lap is being lost'}.`);
  const zs=[...M.zoneRows].filter(z=>z.gainBM!=null);
  const best=[...zs].sort((a,b)=>b.gainBM-a.gainBM)[0],worst=[...zs].sort((a,b)=>a.gainBM-b.gainBM)[0];
  const zb=best&&best.gainBM>0.01?zoneSentence(acr,ref,best,P.step):null,zw=worst&&worst!==best&&worst.gainBM<-0.01?zoneSentence(acr,ref,worst,P.step):null;
  if(zb)out.push(zb);if(zw)out.push(zw);
  if(M.zoneRows.length>=6){
    const sorted=[...M.zoneRows].sort((a,b)=>a.rApex-b.rApex),t=Math.floor(sorted.length/3);
    const lo=avg(sorted.slice(0,t).map(z=>z.dA)),hi=avg(sorted.slice(-t).map(z=>z.dA));
    if(Math.abs(hi-lo)>=3)out.push(hi>lo
      ?`${acr} is relatively stronger in the fastest corners (${fmtS(hi,1)} km/h at the apex) than the slowest (${fmtS(lo,1)}): the pattern of a car with more downforce.`
      :`${acr} is relatively stronger in the slowest corners (${fmtS(lo,1)} km/h at the apex) than the fastest (${fmtS(hi,1)}): the pattern of a car with more mechanical grip and less downforce.`);
  }
  const og=openGain(P.g[acr]),or=openGain(P.g[ref]);
  if(og&&or&&Math.abs(og.gain-or.gain)>=3)out.push(og.gain<or.gain
    ?`With the wing open ${acr} gains ${Math.round(og.gain)} km/h against ${Math.round(or.gain)} for ${ref}: a smaller gain, so less drag to shed, which fits a lower-downforce wing.`
    :`With the wing open ${acr} gains ${Math.round(og.gain)} km/h against ${Math.round(or.gain)} for ${ref}: a bigger gain, so more drag to shed, which fits a higher-downforce wing.`);
  return out;
}
function readPower(P,acr,ref){
  const M=duelMetrics(P,acr,ref),out=[];
  const net=M.byType.exit+M.byType.straight;
  out.push(`On exits and straights ${acr} is <b>${fmtS(net)} s</b> against ${ref}: ${Math.abs(net)<0.01?'effectively level':net>0?'power and traction are paying off':'time is being lost on the way out and along the straights'}.`);
  const items=[];
  for(const s of M.straightRows){
    const dPk=s.a.pk-s.b.pk,dPull=s.a.pull-s.b.pull,dCoast=s.a.coast-s.b.coast;
    if(dPk>3&&dPull<-3)items.push({w:Math.abs(dPull)+dPk,t:`<b>Straight ${s.k}</b>: ${acr} peaks ${Math.round(dPk)} km/h higher but adds ${Math.round(-dPull)} km/h less in the last quarter. It pulls hard early and then flattens before the braking zone, which looks like electrical deployment fading.`});
    else if(dPull>3&&dPk<=3)items.push({w:dPull,t:`<b>Straight ${s.k}</b>: ${acr} is still adding ${Math.round(dPull)} km/h more than ${ref} in the last quarter: it has push left at the end of the straight (more deployment or less drag).`});
    if(dCoast>20)items.push({w:dCoast/4,t:`<b>Straight ${s.k}</b>: ${acr} coasts ${Math.round(dCoast)} m longer before braking, saving or harvesting energy at a cost in time.`});
    else if(dCoast<-20)items.push({w:-dCoast/4,t:`<b>Straight ${s.k}</b>: ${acr} stays on power ${Math.round(-dCoast)} m longer before braking than ${ref}.`});
    if(s.a.lim>=.4&&s.a.lim>s.b.lim+.2)items.push({w:s.a.lim*30,t:`<b>Straight ${s.k}</b>: ${acr} sits on the rev limiter for ${Math.round(s.a.lim*100)}% of the second half of the straight: the gearing is too short here and caps the top speed.`});
    if(s.a.gear!==s.b.gear&&s.a.gear&&s.b.gear)items.push({w:5,t:`<b>Straight ${s.k}</b>: ${acr} tops out in gear ${s.a.gear}, ${ref} in ${s.b.gear}: a different gearing choice.`});
  }
  items.sort((a,b)=>b.w-a.w).slice(0,4).forEach(x=>out.push(x.t));
  const late=[...M.zoneRows].filter(z=>z.dF!=null).sort((a,b)=>Math.abs(b.dF)-Math.abs(a.dF))[0];
  if(late&&Math.abs(late.dF)>=P.step*2)out.push(late.dF>0
    ?`<b>Zone ${late.k} exit</b>: ${acr} gets to full throttle ${Math.round(late.dF)} m later than ${ref}: a more cautious or less stable exit.`
    :`<b>Zone ${late.k} exit</b>: ${acr} gets to full throttle ${Math.round(-late.dF)} m earlier than ${ref}: a stronger exit.`);
  const ga=gearingRatio(P.g[acr]),gr=gearingRatio(P.g[ref]);
  if(ga&&gr&&ga.gear===gr.gear&&Math.abs(ga.ratio/gr.ratio-1)>.02)out.push(ga.ratio<gr.ratio
    ?`${acr} turns fewer revs per km/h in top gear than ${ref}: a taller top gear, which helps top speed and costs acceleration.`
    :`${acr} turns more revs per km/h in top gear than ${ref}: a shorter top gear, which helps acceleration but can hit the limiter.`);
  return out;
}
function readGraph(id,P,sel,ref){
  const out=[],g=P.g;
  const names=sel.filter(a=>a!==ref);
  if(id==='speed'){
    const tops=sel.map(a=>({a,v:Math.max(...g[a].v)})).sort((x,y)=>y.v-x.v);
    out.push(`Top speed: ${tops.map(x=>`<b>${x.a}</b> ${Math.round(x.v)}`).join(', ')} km/h.`);
    for(const a of names){
      let mx=0,mi=0;for(let i=0;i<GRID_N;i++){const d=g[a].v[i]-g[ref].v[i];if(Math.abs(d)>Math.abs(mx)){mx=d;mi=i}}
      out.push(`Biggest speed gap to ${ref}: ${a} is ${Math.abs(Math.round(mx))} km/h ${mx>0?'faster':'slower'} at ${(mi*P.step/1000).toFixed(2)} km${mx<0&&g[a].brk[mi]>0&&!(g[ref].brk[mi]>0)?', braking earlier than the reference':mx>0&&g[ref].brk[mi]>0&&!(g[a].brk[mi]>0)?', still on power while the reference is braking':''}.`);
    }
  }
  if(id==='gear'){
    for(const a of sel){
      const top=Math.max(...g[a].gear),share=g[a].gear.filter(x=>x===top).length/GRID_N;
      let shifts=0;for(let i=1;i<GRID_N;i++)if(g[a].gear[i]!==g[a].gear[i-1])shifts++;
      out.push(`<b>${a}</b> spends ${Math.round(share*100)}% of the lap in gear ${top} and shifts ${shifts} times.`);
    }
  }
  if(id==='rpm'){
    for(const a of sel){
      const mx=Math.max(...g[a].rpm),lim=g[a].rpm.filter(x=>x>=mx*.985).length/GRID_N;
      out.push(`<b>${a}</b> peaks at ${Math.round(mx).toLocaleString('en')} rpm and spends ${Math.round(lim*100)}% of the lap within 1.5% of that${lim>.12?': often on the limiter, so gearing or the straights are short of ratio':''}.`);
    }
    for(const a of names){
      const ga=gearingRatio(g[a]),gr=gearingRatio(g[ref]);
      if(ga&&gr&&ga.gear===gr.gear&&Math.abs(ga.ratio/gr.ratio-1)>.02)out.push(`In top gear ${a} turns ${ga.ratio<gr.ratio?'fewer':'more'} revs for the same speed than ${ref}: ${ga.ratio<gr.ratio?'taller gearing, more top end, slower pick-up':'shorter gearing, quicker pick-up, limiter risk'}.`);
    }
  }
  if(id==='throttle'){
    for(const a of sel){const s=lapShares(g[a]);out.push(`<b>${a}</b>: ${Math.round(s.full*100)}% of the lap flat out, ${Math.round(s.brake*100)}% braking, ${Math.round(s.coast*100)}% coasting.`)}
  }
  if(id==='delta'){
    for(const a of names){
      const M=duelMetrics(P,a,ref),end=g[a].t[GRID_N-1]-g[ref].t[GRID_N-1];
      const segs=[...M.segRows].sort((x,y)=>x.gain-y.gain),w=segs[0],b=segs[segs.length-1];
      const nm=s=>`${s.type==='straight'?`straight ${s.zone||'after the line'}`:`zone ${s.zone} ${s.type==='mid'?'mid-corner':s.type==='exit'?'exit':'braking'}`}`;
      out.push(`${a} finishes the lap ${Math.abs(end).toFixed(3)} s ${end>0?'behind':'ahead of'} ${ref}. Most time is lost in ${nm(w)} (${fmtS(w.gain)} s)${b.gain>0.005?` and most is gained in ${nm(b)} (${fmtS(b.gain)} s)`:''}.`);
    }
  }
  return out;
}
const readBox=lines=>lines.length?`<div class="read"><div class="read-title">What this says</div>${lines.map(l=>`<p>${l}</p>`).join('')}</div>`:'';

// ---- rendering ----
function loadChartJs(){
  if(window.Chart)return Promise.resolve();
  if(window._chartP)return window._chartP;
  window._chartP=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js';
    s.onload=()=>{NET.bytes+=70000;updateMeter();res()};s.onerror=()=>rej(new Error('Chart library failed to load'));
    document.head.appendChild(s);
  });
  return window._chartP;
}

function renderDuelsTab(){
  const wrap=document.getElementById('duelsWrap');if(!wrap)return;
  const empty=(t,s)=>`<div class="insights-export-card"><div class="insights-export-icon"></div><div class="insights-export-title">${t}</div><div class="insights-export-sub">${s}</div></div>`;

  if(duelsLoading){wrap.innerHTML=empty('Loading telemetry','Fetching only the fastest lap of each selected driver');return}

  const cached=duelsTelemetryCache.get(sessionKey)||{};
  const missing=duelsSelectedDrivers.filter(a=>!cached[a]);
  const loaded=duelsSelectedDrivers.filter(a=>cached[a]);

  const picker=`<div class="duels-picker">
    <div class="duels-picker-label">Choose up to ${DUELS_MAX_DRIVERS} drivers</div>
    <div class="duels-picker-grid">${positionOrder.map(dn=>{
      const m=driverMeta.get(dn);if(!m)return'';
      return `<button class="duels-driver-chip${duelsSelectedDrivers.includes(m.acronym)?' selected':''}" style="--chip-color:${m.teamColor}" onclick="toggleDuelsDriver('${m.acronym}')">${m.acronym}</button>`;
    }).join('')}</div>
    ${missing.length?`<div class="insights-generate-wrap" style="margin-top:14px"><button class="insights-generate-btn" onclick="fetchDuelsTelemetry()">Load ${missing.length===1?missing[0]:missing.length+' drivers'}</button>
      <div class="insights-session-label">One fastest lap each, saved on this device afterwards</div></div>`:''}
  </div>`;

  if(!loaded.length){wrap.innerHTML=`<div class="duels-content">${picker}</div>`;return}

  if(!duelsReferenceDriver||!loaded.includes(duelsReferenceDriver))duelsReferenceDriver=loaded[0];
  const views=[['graphs','Graphs'],['stats','Stats'],['aero','Aero'],['power','Power']];
  const toggle=`<div class="duels-view-toggle">${views.map(([v,l])=>`<button class="duels-view-btn${duelsView===v?' active':''}" onclick="setDuelsView('${v}')">${l}</button>`).join('')}</div>`;
  const refPicker=loaded.length>1?`<div class="duels-ref-picker"><span class="duels-ref-label">Compare against</span>${loaded.map(a=>`<button class="duels-ref-chip${a===duelsReferenceDriver?' selected':''}" onclick="setDuelsReference('${a}')">${a}</button>`).join('')}</div>`:'';
  const legend=`<div class="legend">${loaded.map((a,i)=>`<span style="color:${DUELS_COLORS[i]}">${a} · ${fmtTime(cached[a].fastest_lap_time)}</span>`).join('')}</div>`;

  const P=duelPrep(cached,loaded);

async function renderDuelsCharts(P,sel){
  const box=document.getElementById('duelsCharts');if(!box)return;
  duelsCharts.forEach(c=>c.destroy());duelsCharts=[];
  box.innerHTML='<div class="placeholder">Loading charts…</div>';
  try{await loadChartJs()}catch(e){box.innerHTML=`<div class="insights-error">${e.message}</div>`;return}
  if(!document.getElementById('duelsCharts')||duelsView!=='graphs')return;
  const ref=duelsReferenceDriver,hasDelta=sel.length>1;
  const metrics=[
    {id:'speed',label:'Speed (km/h)',key:'v'},
    {id:'gear',label:'Gear',key:'gear',stepped:true},
    {id:'rpm',label:'Engine rpm',key:'rpm'},
    {id:'throttle',label:'Throttle (%)',key:'thr'}
  ];
  const cards=metrics.map(m=>`<div class="duels-chart-card"><div class="duels-chart-title">${m.label}</div><canvas id="duelsChart-${m.id}"></canvas>
    ${m.id==='speed'?'<div class="duels-braking-strip" id="duelsBrakingStrip"></div>':''}${readBox(readGraph(m.id,P,sel,ref))}</div>`);
  if(hasDelta)cards.push(`<div class="duels-chart-card"><div class="duels-chart-title">Time against ${ref}</div><div class="card-sub">Above zero means behind ${ref} at that point of the lap.</div><canvas id="duelsChart-delta"></canvas>${readBox(readGraph('delta',P,sel,ref))}</div>`);
  box.innerHTML=cards.join('');

  const base={responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},
    scales:{x:{type:'linear',title:{display:true,text:'Distance (km)',color:'#707c98'},ticks:{color:'#707c98',maxTicksLimit:7},grid:{color:'rgba(255,255,255,.06)'}},
      y:{ticks:{color:'#707c98'},grid:{color:'rgba(255,255,255,.06)'}}},
    plugins:{legend:{labels:{color:'#eef1f8',boxWidth:10,boxHeight:10,usePointStyle:true,font:{family:'Geist, system-ui, sans-serif',size:11}}}}};
  const ds=(a,i,yfn,stepped)=>({label:a,data:P.g[a].d.map((d,j)=>({x:+(d/1000).toFixed(3),y:yfn(j)})),borderColor:DUELS_COLORS[sel.indexOf(a)],backgroundColor:DUELS_COLORS[sel.indexOf(a)],borderWidth:1.6,pointRadius:0,stepped:!!stepped,tension:stepped?0:.1});
  for(const m of metrics){
    const c=document.getElementById(`duelsChart-${m.id}`);if(!c)continue;
    duelsCharts.push(new Chart(c,{type:'line',data:{datasets:sel.map((a,i)=>ds(a,i,j=>P.g[a][m.key][j],m.stepped))},options:base}));
  }
  if(hasDelta){
    const c=document.getElementById('duelsChart-delta');
    duelsCharts.push(new Chart(c,{type:'line',data:{datasets:sel.filter(a=>a!==ref).map((a,i)=>ds(a,i,j=>+(P.g[a].t[j]-P.g[ref].t[j]).toFixed(3)))},options:base}));
  }
  const strip=document.getElementById('duelsBrakingStrip');
  if(strip)strip.innerHTML=sel.map((a,i)=>{
    const g=P.g[a],marks=[];
    for(let j=1;j<GRID_N;j++)if(g.brk[j]>0&&!(g.brk[j-1]>0))marks.push(`<span class="duels-brake-mark" style="left:${(g.d[j]/P.L*100).toFixed(1)}%;background:${DUELS_COLORS[i]}" title="${a} braking at ${(g.d[j]/1000).toFixed(2)} km, ${Math.round(g.v[j])} km/h"></span>`);
    return `<div class="duels-brake-row"><span class="duels-brake-driver" style="color:${DUELS_COLORS[i]}">${a}</span><div class="duels-brake-track">${marks.join('')}</div></div>`;
  }).join('');
}

function renderDuelsStats(P,sel){
  const box=document.getElementById('duelsCharts');if(!box)return;
  const ref=duelsReferenceDriver,{zones}=segmentLap(P.g[ref]);
  if(!zones.length){box.innerHTML='<div class="insights-unsupported">No braking zones detected for these laps.</div>';return}
  const rows=[['Speed','v'],['Rpm','rpm'],['Gear','gear'],['Throttle','thr']];
  let html=`<div class="duels-chart-card"><div class="duels-chart-title">At the start of each braking zone</div><div class="scroll-x"><div class="stats-table" style="grid-template-columns:62px repeat(${zones.length},minmax(52px,1fr))"><div class="stats-corner"></div>`;
  zones.forEach(z=>html+=`<div class="stats-zone-header">Zone ${z.k}</div>`);
  for(const [label,key] of rows){
    html+=`<div class="stats-metric-label">${label}</div>`;
    for(const z of zones){
      html+='<div class="stats-zone-cell">';
      sel.forEach((a,i)=>{
        const g=P.g[a],o=nearestOnset(g,z.b);
        const v=o==null?'—':key==='v'||key==='rpm'||key==='thr'?Math.round(g[key][o]):g[key][o];
        html+=`<span class="stats-val" style="color:${DUELS_COLORS[i]}">${v}</span>`;
      });
      html+='</div>';
    }
  }
  html+='</div></div></div>';
  box.innerHTML=html;
}

// diverging bar: positive (gain) to the right, negative to the left
function dvBar(x,max){const w=Math.min(50,Math.abs(x)/Math.max(max,1e-6)*50);return `<div class="dv"><i class="${x>=0?'g':'l'}" style="width:${w}%"></i></div>`}
function summaryTable(P,sel,ref,rowsDef){
  const others=sel.filter(a=>a!==ref);
  const Ms=Object.fromEntries(others.map(a=>[a,duelMetrics(P,a,ref)]));
  let mx=0;for(const a of others)for(const [,f] of rowsDef)mx=Math.max(mx,Math.abs(f(Ms[a])));
  return `<table class="tbl"><tr><th></th>${others.map(a=>`<th style="color:${DUELS_COLORS[sel.indexOf(a)]}">${a}</th>`).join('')}</tr>
    ${rowsDef.map(([label,f],ri)=>`<tr${ri===rowsDef.length-1?' style="font-weight:600"':''}><td>${label}</td>${others.map(a=>{const v=f(Ms[a]);return `<td class="${gcls(v)}">${fmtS(v)}${dvBar(v,mx)}</td>`}).join('')}</tr>`).join('')}</table>`;
}
function renderAero(P,sel){
  const box=document.getElementById('duelsCharts');if(!box)return;
  const ref=duelsReferenceDriver,others=sel.filter(a=>a!==ref);
  if(!others.length){box.innerHTML='<div class="insights-unsupported">Load a second driver to compare corners and braking.</div>';return}
  const {zones}=segmentLap(P.g[ref]);
  if(!zones.length){box.innerHTML='<div class="insights-unsupported">No braking zones were found on the reference lap.</div>';return}
  let html=`<div class="duels-chart-card"><div class="duels-chart-title">Time gained or lost against ${ref}</div><div class="card-sub">Seconds over the fastest lap. Plus means quicker than ${ref}.</div>
    ${summaryTable(P,sel,ref,[['Braking',m=>m.byType.brake],['Mid-corner',m=>m.byType.mid],['Braking + mid-corner',m=>m.byType.brake+m.byType.mid]])}</div>`;
  html+=`<div class="duels-chart-card"><div class="duels-chart-title">Corner by corner</div><div class="card-sub">Slowest speed in each zone, and where each driver starts braking compared with ${ref}.</div><div class="scroll-x"><table class="tbl">
    <tr><th>Zone</th><th>${ref} km/h</th>${others.map(a=>`<th>${a} km/h</th><th>${a} brake</th>`).join('')}</tr>`;
  const Ms=Object.fromEntries(others.map(a=>[a,duelMetrics(P,a,ref)]));
  zones.forEach((z,i)=>{
    html+=`<tr><td>${z.k}</td><td>${Math.round(Ms[others[0]].zoneRows[i].rApex)}</td>`;
    for(const a of others){const r=Ms[a].zoneRows[i];
      html+=`<td class="${r.dA>2?'gain':r.dA<-2?'loss':''}">${r.dA>=0?'+':'−'}${Math.abs(Math.round(r.dA))}</td><td class="${r.dB==null?'':r.dB>BR_TOL_STEPS*P.step?'gain':r.dB<-BR_TOL_STEPS*P.step?'loss':''}">${r.dB==null?'—':(r.dB>=0?'+':'−')+Math.abs(Math.round(r.dB))+' m'}</td>`}
    html+='</tr>';
  });
  html+='</table></div></div>';
  html+=`<div class="duels-chart-card"><div class="duels-chart-title">Reading</div>${others.map(a=>`<div class="read"><div class="read-title">${a} against ${ref}</div>${readAero(P,a,ref).map(l=>`<p>${l}</p>`).join('')}</div>`).join('')}</div>`;
  box.innerHTML=html;
}
function renderPower(P,sel){
  const box=document.getElementById('duelsCharts');if(!box)return;
  const ref=duelsReferenceDriver,others=sel.filter(a=>a!==ref);
  const {zones}=segmentLap(P.g[ref]);
  if(!zones.length){box.innerHTML='<div class="insights-unsupported">No braking zones were found on the reference lap.</div>';return}
  let html='';
  if(others.length){
    html+=`<div class="duels-chart-card"><div class="duels-chart-title">Time gained or lost against ${ref}</div><div class="card-sub">Seconds over the fastest lap. Plus means quicker than ${ref}.</div>
      ${summaryTable(P,sel,ref,[['Exits',m=>m.byType.exit],['Straights',m=>m.byType.straight],['Exits + straights',m=>m.byType.exit+m.byType.straight]])}</div>`;
    const Ms=Object.fromEntries(others.map(a=>[a,duelMetrics(P,a,ref)]));
    const sr=Ms[others[0]].straightRows;
    html+=`<div class="duels-chart-card"><div class="duels-chart-title">Straight by straight</div><div class="card-sub">Peak speed, speed added in the last quarter, and distance coasting before the brakes.</div><div class="scroll-x"><table class="tbl">
      <tr><th>Straight</th><th>${ref} peak</th>${others.map(a=>`<th>${a} peak</th><th>${a} late pull</th><th>${a} coast</th>`).join('')}</tr>`;
    sr.forEach((s,i)=>{
      html+=`<tr><td>${s.k}</td><td>${Math.round(s.b.pk)}</td>`;
      for(const a of others){const r=Ms[a].straightRows[i],dp=r.a.pk-r.b.pk,dl=r.a.pull-r.b.pull,dc=r.a.coast-r.b.coast;
        html+=`<td class="${dp>2?'gain':dp<-2?'loss':''}">${dp>=0?'+':'−'}${Math.abs(Math.round(dp))}</td><td class="${dl>2?'gain':dl<-2?'loss':''}">${dl>=0?'+':'−'}${Math.abs(Math.round(dl))}</td><td class="${dc<-10?'gain':dc>10?'loss':''}">${dc>=0?'+':'−'}${Math.abs(Math.round(dc))} m</td>`}
      html+='</tr>';
    });
    html+='</table></div></div>';
  }
  html+=`<div class="duels-chart-card"><div class="duels-chart-title">How the lap is spent</div><div class="card-sub">Share of lap time.</div><table class="tbl"><tr><th></th>${sel.map((a,i)=>`<th style="color:${DUELS_COLORS[i]}">${a}</th>`).join('')}</tr>
    ${[['Flat out','full'],['Braking','brake'],['Coasting','coast']].map(([l,k])=>`<tr><td>${l}</td>${sel.map(a=>`<td>${(lapShares(P.g[a])[k]*100).toFixed(1)}%</td>`).join('')}</tr>`).join('')}</table></div>`;
  if(others.length)html+=`<div class="duels-chart-card"><div class="duels-chart-title">Reading</div>${others.map(a=>`<div class="read"><div class="read-title">${a} against ${ref}</div>${readPower(P,a,ref).map(l=>`<p>${l}</p>`).join('')}</div>`).join('')}</div>`;
  box.innerHTML=html;
}

// Top speed for exports: speed-trap readings already in the laps data, plus any
// telemetry already loaded. No extra download.
async function fetchTopSpeeds(){
  const speeds=new Map();
  for(const dn of driverMeta.keys()){
    let mx=null;
    for(const l of lapsOf(dn))for(const k of['i1_speed','i2_speed','st_speed'])if(typeof l[k]==='number'&&l[k]>0&&(mx===null||l[k]>mx))mx=l[k];
    const acr=driverMeta.get(dn).acronym,tel=(duelsTelemetryCache.get(sessionKey)||{})[acr];
    if(tel&&tel.top_speed_kmh&&(mx===null||tel.top_speed_kmh>mx))mx=tel.top_speed_kmh;
    if(mx!==null)speeds.set(acr,mx);
  }
  return speeds;
}

// ========== SESSION LOADING (with on-device storage) ==========
// Finished sessions are saved on this device. The first visit does up to three
// rounds, because OpenF1 doesn't always have everything at once; each later
// round only re-requests what is still missing, and the result is stored so the
// session is never downloaded again. (The heavy position feed is no longer
// requested: nothing visible used it.)
function reduceLap(l){
  return{driver_number:l.driver_number,lap_number:l.lap_number,lap_duration:l.lap_duration,date_start:l.date_start,
    duration_sector_1:l.duration_sector_1,duration_sector_2:l.duration_sector_2,duration_sector_3:l.duration_sector_3,
    is_pit_out_lap:l.is_pit_out_lap,i1_speed:l.i1_speed,i2_speed:l.i2_speed,st_speed:l.st_speed};
}
function reduceWeather(w){return{date:w.date,air_temperature:w.air_temperature,track_temperature:w.track_temperature,humidity:w.humidity,rainfall:w.rainfall,wind_speed:w.wind_speed}}

function missingEndpoints(){
  const miss=[];
  const counts=new Map();
  for(const l of cachedLaps.values())counts.set(l.driver_number,(counts.get(l.driver_number)||0)+1);
  if(!cachedLaps.size)miss.push('laps');
  else for(const[dn,r]of cachedSessionResult){if(r.number_of_laps>0&&(counts.get(dn)||0)<r.number_of_laps){miss.push('laps');break}}
  if(!cachedSessionResult.size)miss.push('session_result');
  for(const dn of counts.keys())if(!(lastStintMap.get(dn)||[]).length){miss.push('stints');break}
  if(isRaceOrSprintSession()&&!cachedPitStops.size)miss.push('pit');
  if(!cachedRaceControl.length)miss.push('race_control');
  if(!cachedWeather.length)miss.push('weather');
  return[...new Set(miss)];
}

async function fetchAndMergeSessionData(need){
  const want=new Set(need&&need.length?need:['laps','session_result','pit','race_control','stints','weather']);
  const get=ep=>want.has(ep)?api(`${ep}?session_key=${sessionKey}`):Promise.resolve([]);
  const[newLaps,sessionResult,pitStops,raceControl,stints,weather]=await Promise.all(
    ['laps','session_result','pit','race_control','stints','weather'].map(get));

  for(const lap of newLaps)cachedLaps.set(`${lap.driver_number}:${lap.lap_number}`,reduceLap(lap));

  const newStints=new Map();
  for(const s of stints){if(!newStints.has(s.driver_number))newStints.set(s.driver_number,[]);newStints.get(s.driver_number).push(s)}
  for(const[dn,list]of newStints)if(list.length)lastStintMap.set(dn,list);

  const latestPit=new Map(cachedPitStops);
  for(const p of pitStops){
    const dn=p.driver_number;
    if(!latestPit.has(dn)||new Date(p.pit_in_time||p.date)>new Date(latestPit.get(dn).pit_in_time||latestPit.get(dn).date))latestPit.set(dn,p);
  }
  cachedPitStops=latestPit;

  if(sessionResult&&sessionResult.length)for(const r of sessionResult)cachedSessionResult.set(r.driver_number,r);
  if(weather&&weather.length)cachedWeather=weather.map(reduceWeather);
  if(raceControl&&raceControl.length)cachedRaceControl=mergeRCMessages(cachedRaceControl,raceControl);
}

function hydrateSession(s){
  for(const l of s.laps||[])cachedLaps.set(`${l.driver_number}:${l.lap_number}`,l);
  for(const[dn,list]of s.stints||[])lastStintMap.set(dn,list);
  for(const r of s.result||[])cachedSessionResult.set(r.driver_number,r);
  for(const p of s.pits||[])cachedPitStops.set(p.driver_number,p);
  cachedRaceControl=s.rc||[];cachedWeather=s.weather||[];
}
async function saveSession(){
  const missing=missingEndpoints();
  const ended=sessionEnd&&Date.now()>sessionEnd.getTime()+30*60000;
  await kvSet('sess:'+sessionKey,{
    savedAt:Date.now(),complete:!missing.length&&!!ended,missing,
    laps:[...cachedLaps.values()],stints:[...lastStintMap.entries()],result:[...cachedSessionResult.values()],
    pits:[...cachedPitStops.values()],rc:cachedRaceControl,weather:cachedWeather
  });
}

async function loadSessionData(force){
  if(!sessionKey)return;
  const key=sessionKey;
  setSelectStatus('loading');
  let hydrated=false;
  if(!force){
    const saved=await kvGet('sess:'+key);
    if(saved&&sessionKey===key){
      hydrateSession(saved);hydrated=true;NET.cacheHits++;updateMeter();
      invalidateReads();renderSessionData();
      if(saved.complete){setSelectStatus('done');return}
    }
  }
  for(let round=0;round<3;round++){
    if(sessionKey!==key)return;
    const need=hydrated||round>0||force?missingEndpoints():null;
    if(need&&!need.length)break;
    await fetchAndMergeSessionData(need);
    invalidateReads();renderSessionData();
    if(!missingEndpoints().length)break;
    if(round<2)await sleep(3000);
  }
  if(sessionKey===key){await saveSession();setSelectStatus('done')}
}

function updateTyreCol(dn,stints,lapNum){
  const el=document.getElementById(`tyreCol-${dn}`);if(!el)return;
  const{compound,age}=getCurrentTyre(stints,lapNum);
  if(!compound){el.innerHTML='<span class="tyre-age-col">–</span>';return}

}

// ========== INSIGHTS ==========
const prettyLabel=s=>(s||'').replace(/\w\S*/g,w=>w[0]+w.slice(1).toLowerCase());
function renderNotesSection(notes){
  const has=notes.eliminations.length||notes.flags.length||notes.dnfs.length||notes.fastestOverall;
  if(!has)return'';
  let html='<div class="notes-section"><div class="notes-title">Session notes</div>';
  const row=t=>`<div class="notes-row"><span class="notes-icon"></span><span>${t}</span></div>`;
  if(notes.fastestOverall)html+=row(`Fastest overall: <b>${notes.fastestOverall.driver}</b> – ${fmtTime(notes.fastestOverall.time)}`);
  const byPhase={};
  for(const e of notes.eliminations)(byPhase[e.phase]=byPhase[e.phase]||[]).push(e);
  for(const phase of Object.keys(byPhase))html+=row(`Out in ${phase}: ${byPhase[phase].map(e=>`${e.driver}${e.gap!=null?` (+${e.gap}s)`:''}`).join(', ')}`);
  for(const f of notes.flags)html+=row(`${prettyLabel(f.label)}${f.lap?` – lap ${f.lap}`:''}`);
  for(const d of notes.dnfs)html+=row(`<b>${d.driver}</b> – ${d.status}`);
  return html+'</div>';
}
function renderInsightsTab(){
  const wrap=document.getElementById('insightsWrap');if(!wrap)return;
  const card=(t,s,extra='')=>`<div class="insights-export-card"><div class="insights-export-icon"></div><div class="insights-export-title">${t}</div><div class="insights-export-sub">${s}</div>${extra}</div>`;
  if(!sessionKey){wrap.innerHTML=card('No session selected','Pick a Grand Prix and session above to export its data');return}
  const branch=classifySessionType();
  const label=prettyLabel(getSessionLabel())||'this session';
  if(!branch){wrap.innerHTML=`<div class="insights-unsupported">Could not determine session type for ${label}.</div>`;return}
  const notes=renderNotesSection(computeQuickNotes());
  if(insightsDownloading){wrap.innerHTML=notes+card('Preparing your file','Putting the cleaned laps together');return}
  const already=downloadedSessions.has(sessionKey);
  wrap.innerHTML=notes+card(`${prettyLabel(branch)} data export`,label,
    `<div class="insights-generate-wrap"><button class="insights-generate-btn" onclick="downloadSessionData()">Download JSON</button></div>${already?'<div class="insights-session-label">Downloaded already – tap again for a fresh copy</div>':''}`);
}

// ========== NEWS (kept for 10 minutes) ==========
async function loadNews(){
  if(newsLoading)return;
  const wrap=document.getElementById('newsWrap');
  try{
    const c=JSON.parse(sessionStorage.getItem('f1news')||'null');
    if(c&&Date.now()-c.t<600000){NET.cacheHits++;updateMeter();renderNewsFeed(c.posts);return}
  }catch{}
  newsLoading=true;
  if(wrap)wrap.innerHTML=`<div class="insights-export-card"><div class="insights-export-icon"></div><div class="insights-export-title">Loading r/formula1</div><div class="insights-export-sub">The first request after a quiet spell can take up to a minute</div></div>`;
  try{
    const resp=await fetch(`${BACKEND_URL}/reddit`);
    if(!resp.ok)throw new Error(`Backend returned ${resp.status}`);
    const text=await resp.text();NET.bytes+=text.length;updateMeter();
    const data=JSON.parse(text);
    try{sessionStorage.setItem('f1news',JSON.stringify({t:Date.now(),posts:data.posts||[]}))}catch{}
    renderNewsFeed(data.posts||[]);
  }catch(err){
    console.error('News fetch failed:',err);
    if(wrap)wrap.innerHTML=`<div class="insights-error">Couldn’t load r/formula1: ${err.message||'unknown error'}. The service may still be waking up.</div><div class="insights-generate-wrap" style="margin-top:12px"><button class="insights-generate-btn" onclick="loadNews()">Try again</button></div>`;
  }finally{newsLoading=false}
}

// ========== DRIVER SHEET ==========
function showLapHistory(dn){
  if(!sessionKey)return;
  const meta=driverMeta.get(dn);if(!meta)return;
  currentDriverDn=dn;currentDriverTab='laps';
  document.getElementById('lapModalTitle').innerHTML=`<span class="acronym" style="--team:${meta.teamColor}">${meta.acronym}</span><span style="font-weight:500;color:var(--dim);font-size:15px">${escapeHtml(meta.fullName)}</span>`;
  document.getElementById('lapModal').classList.add('open');
  ['Laps','Stints'].forEach(t=>{const b=document.getElementById(`subtab${t}`);if(b)b.classList.toggle('active',t==='Laps')});
  renderDriverTab('laps');
}
function switchDriverTab(tab){
  currentDriverTab=tab;
  ['Laps','Stints'].forEach(t=>{const b=document.getElementById(`subtab${t}`);if(b)b.classList.toggle('active',t.toLowerCase()===tab)});
  renderDriverTab(tab);
}
const f3=v=>v!=null?v.toFixed(3):'–';
function noteFor(r){
  if(r.marker)return `<span class="note pit">${r.marker}</span>`;
  if(r.kind==='push')return '<span class="note push">Push</span>';
  if(r.kind==='run')return '';
  return `<span class="note">${KIND_LABEL[r.kind]||r.kind}${r.where?' · '+r.where:''}</span>`;
}
function renderDriverTab(tab){
  const body=document.getElementById('lapModalBody');
  const dn=currentDriverDn;
  const recs=dn!=null?getLapRead(dn):[];
  if(!recs.length){body.innerHTML='<div class="placeholder">No lap data for this driver</div>';return}

  if(tab==='laps'){
    let best=Infinity;for(const r of recs)if(r.time&&r.time<best)best=r.time;
    const rows=recs.map(r=>{
      const isOB=r.time===overallBestLap,isPB=r.time===best&&!isOB;
      const cls=isOB?'ob':isPB?'pb':'lt';
      const off=!['run','push'].includes(r.kind);
      return `<tr class="${off?'off':''}"><td>${r.lap}</td><td class="${cls}">${r.time?fmtTime(r.time):'–'}</td><td>${f3(r.s[0])}</td><td>${f3(r.s[1])}</td><td>${f3(r.s[2])}</td><td>${r.compound?tyreBadge(r.compound,18):'–'}</td><td>${noteFor(r)}</td></tr>`;
    }).join('');
    body.innerHTML=`<div class="scroll-x"><table class="lap-table"><thead><tr><th>Lap</th><th>Time</th><th>S1</th><th>S2</th><th>S3</th><th>Tyre</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
    return;
  }

  // stints
  const stints=lastStintMap.get(dn)||[];
  if(!stints.length){body.innerHTML='<div class="placeholder">No stint data for this driver</div>';return}
  const stats=computeStintStats(stints,lapsOf(dn),dn);
  const an=analyseDriver(dn);
  let html='<div class="stint-pills">'+stats.map(s=>`<span class="stint-pill">${tyreBadge(s.compound,20)}Laps ${s.lap_start}–${s.lap_end||'?'}<span class="tyre-tag">${tyreAgeTag(s.tyre_age_at_start)}</span></span>`).join('')+'</div>';

  // best tyre
  const row=(l,v)=>`<div class="analysis-row"><span class="analysis-label">${l}</span><span class="analysis-value">${v}</span></div>`;
  const bt=(c,t)=>`<span style="display:inline-flex;align-items:center;gap:7px">${tyreBadge(c.compound,20)}${tyreName(c.compound)}</span><div class="stint-meta">${t}</div>`;
  html+=`<div class="analysis-card" style="margin-top:0"><div class="analysis-card-head"><span class="analysis-card-title">Best tyre</span></div>
    ${row('One lap',an.bestOneLap?bt(an.bestOneLap,`${an.bestOneLap.margin.toFixed(3)} s quicker on its best push lap than the next compound`):'<span class="stint-meta">Needs push laps on two compounds</span>')}
    ${row('Race pace',an.bestRace?bt(an.bestRace,`${an.bestRace.margin.toFixed(3)} s a lap quicker at ${an.bestRace.atAge} laps old`):'<span class="stint-meta">Needs steady running on two compounds</span>')}</div>`;

  // stint cards
  const temps=s=>{const t=s.lap_detail.map(l=>l.track_c).filter(v=>v!=null);return t.length?(Math.round(t[0])===Math.round(t[t.length-1])?`${Math.round(t[0])}°C`:`${Math.round(t[0])}→${Math.round(t[t.length-1])}°C`):'–'};
  stats.forEach((s,i)=>{
    const wu=an.warmups.find(w=>w.stint===i);
    const wuText=!wu?'':wu.type==='run'
      ?(wu.peakLap===1?'Fastest on the first flying lap of the run: no warm-up needed.':`Peaks on lap ${wu.peakLap} of ${wu.of}; the first lap is ${wu.firstOff.toFixed(2)} s off its best.`)
      :(wu.warmLaps?`${wu.warmLaps} warm-up lap${wu.warmLaps>1?'s':''} before the first push.`:'Pushed straight after the out lap.');
    const kinds={};s.lap_detail.forEach(l=>{if(l.time!=null&&l.kind!=='run'&&l.kind!=='push')kinds[l.kind]=(kinds[l.kind]||0)+1});
    const notCounted=Object.entries(kinds).map(([k,n])=>`${n} ${(KIND_LABEL[k]||k).toLowerCase()}`).join(', ');
    const deg=s.deg_per_lap;
    html+=`<div class="stint-card">
      <div class="stint-head">${tyreBadge(s.compound,28)}<span class="stint-compound">${tyreName(s.compound)}</span><span class="stint-meta">Laps ${s.lap_start}–${s.lap_end||'?'} · ${tyreAgeTag(s.tyre_age_at_start)}</span></div>
      <div class="stint-stats">
        <div class="stint-stat"><span class="stint-stat-label">Steady laps</span><span class="stint-stat-val">${s.laps}</span></div>
        <div class="stint-stat"><span class="stint-stat-label">Average pace</span><span class="stint-stat-val">${s.avg_lap?fmtTime(s.avg_lap):'–'}</span></div>
        <div class="stint-stat"><span class="stint-stat-label">Wear per lap</span><span class="stint-stat-val" style="color:${deg==null?'var(--muted)':deg>0.1?'var(--red)':deg>0.05?'var(--yellow)':'var(--green)'}">${deg==null?'–':(deg>=0?'+':'')+deg.toFixed(3)+' s'}</span></div>
        <div class="stint-stat" style="margin-top:8px"><span class="stint-stat-label">Best push lap</span><span class="stint-stat-val">${s.best_push_lap?fmtTime(s.best_push_lap):'–'}</span></div>
        <div class="stint-stat" style="margin-top:8px"><span class="stint-stat-label">Track temp</span><span class="stint-stat-val">${temps(s)}</span></div>
      </div>
      ${wuText?`<div class="stint-verdict">${wuText}</div>`:''}
      ${notCounted?`<div class="stint-meta" style="margin-top:8px">Not counted in pace: ${notCounted}.</div>`:''}
    </div>`;
  });

  if(an.crossovers.length)html+=`<div class="analysis-card"><div class="analysis-card-head"><span class="analysis-card-title">Crossover lap</span></div>${an.crossovers.map(c=>`<div class="analysis-row"><span class="analysis-label" style="display:flex;align-items:center;gap:6px">${tyreBadge(c.from,18)}<span style="color:var(--muted)">→</span>${tyreBadge(c.to,18)}</span><span class="analysis-value" style="font-weight:500;color:var(--dim);max-width:70%">${c.text}</span></div>`).join('')}</div>`;
  else html+=`<div class="analysis-card"><div class="analysis-card-head"><span class="analysis-card-title">Crossover lap</span></div><div class="stint-meta">Needs steady running of at least ${MIN_RUN_LAPS} laps on two compounds.</div></div>`;

  if(an.racePace){
    const p=an.racePace;
    html+=`<div class="analysis-card"><div class="analysis-card-head"><span class="analysis-card-title">Race pace</span></div>
      <div class="hero">${tyreBadge(p.compound,30)}<div><div class="hero-big">${fmtTime(p.avg)}</div><div class="hero-sub">${p.laps}-lap run on ${tyreName(p.compound)}</div></div></div>
      ${row('Off its own best lap',`${p.gap.toFixed(2)} s (${(p.gap/p.best*100).toFixed(1)}%)`)}
      ${row('Gap rank in the field',`${ordinal(p.rank)} smallest of ${p.of}`)}</div>`;
  }else html+=`<div class="analysis-card"><div class="analysis-card-head"><span class="analysis-card-title">Race pace</span></div><div class="stint-meta">No steady run of five laps or more.</div></div>`;
  body.innerHTML=html;
}

// ========== PRACTICE EXPORT ==========
async function buildPracticePayload(){
  const drivers=[];
  for(const dn of positionOrder){
    const meta=driverMeta.get(dn);if(!meta)continue;
    const driverLaps=lapsOf(dn);
    const stints=computeStintStats(lastStintMap.get(dn)||[],driverLaps,dn);
    let bestLap=null;
    for(const l of driverLaps)if(l.lap_duration>0&&(!bestLap||l.lap_duration<bestLap))bestLap=l.lap_duration;
    const an=analyseDriver(dn);
    drivers.push({
      driver:meta.acronym,team:meta.teamName,best_lap:bestLap?+bestLap.toFixed(3):null,
      stints:stints.map(s=>({compound:s.compound,lap_start:s.lap_start,lap_end:s.lap_end,tyre_age_at_start:s.tyre_age_at_start,
        stint_laps:s.stint_laps,steady_laps:s.laps,push_laps:s.push_laps,avg_lap:s.avg_lap,deg_per_lap:s.deg_per_lap,
        best_push_lap:s.best_push_lap,run_type:s.run_type,laps_not_counted:s.excluded_outlier_laps,lap_detail:s.lap_detail})),
      analysis:{
        best_tyre_one_lap:an.bestOneLap?{compound:an.bestOneLap.compound,margin_s:+an.bestOneLap.margin.toFixed(3)}:null,
        best_tyre_race_pace:an.bestRace?{compound:an.bestRace.compound,margin_s_per_lap:+an.bestRace.margin.toFixed(3),at_tyre_age:an.bestRace.atAge}:null,
        crossover:an.crossovers.map(c=>c.text),
        race_pace:an.racePace?{avg_lap:+an.racePace.avg.toFixed(3),laps:an.racePace.laps,compound:an.racePace.compound,gap_to_best_lap_s:+an.racePace.gap.toFixed(3),gap_rank:an.racePace.rank,of:an.racePace.of}:null,
        warm_up:an.warmups.map(w=>w.type==='run'?{compound:w.compound,peak_lap_of_run:w.peakLap,run_laps:w.of,first_lap_off_best_s:+w.firstOff.toFixed(3)}:{compound:w.compound,warm_up_laps_before_first_push:w.warmLaps})
      }
    });
  }
  drivers.sort((a,b)=>(a.best_lap??Infinity)-(b.best_lap??Infinity));
  const topSpeeds=await fetchTopSpeeds();
  for(const d of drivers)d.top_speed_kmh=topSpeeds.has(d.driver)?topSpeeds.get(d.driver):null;
  return{
    session_type:'practice',
    session:getSessionLabel()||'Practice',
    note:'Laps are read from their neighbours, not fixed time limits. lap_detail kinds: out/in (pit laps, also marked OUTPIT/INPIT), warmup, push, aborted (push abandoned after a quick first sector), cooldown, run (steady lap), anomaly (one-off, odd_sector shows where), sc (safety car). steady_laps feed avg_lap and deg_per_lap; push laps feed best_push_lap. Weather per lap is the latest sample at or before the end of that lap, not a per-lap measurement. top_speed_kmh is the highest speed-trap or telemetry reading available, not necessarily the true peak. Fuel load is unknown and not corrected for.',
    drivers,
    race_control_events:filteredRaceControlEvents()
  };
}
