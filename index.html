// Fetches one round of session data and MERGES it into the persistent
// caches — never replaces them wholesale. This matters because OpenF1 can
// post different drivers' data at different times: a single fetch might
// have complete stints for driver A but nothing yet for driver B, and the
// next fetch could be the reverse. Overwriting fully on each fetch would
// lose whatever the previous round got right; merging only fills gaps that
// are still empty, so three fetches strictly accumulate completeness.
async function fetchAndMergeSessionData(){
  const[newLaps,intervals,positions,pitStops,raceControl,stints,weather]=await Promise.all([
    api(`laps?session_key=${sessionKey}`),
    api(`intervals?session_key=${sessionKey}`),
    api(`position?session_key=${sessionKey}`),
    api(`pit?session_key=${sessionKey}`),
    api(`race_control?session_key=${sessionKey}`),
    api(`stints?session_key=${sessionKey}`),
    api(`weather?session_key=${sessionKey}`)
  ]);

  for(const lap of newLaps){
    const key=`${lap.driver_number}:${lap.lap_number}`;
    cachedLaps.set(key,lap);
  }

  // Merge stints per-driver: only replace a driver's stint list if the new
  // fetch actually returned something for them, or if we had nothing before.
  const newStintsByDriver=new Map();
  for(const s of stints){
    const dn=s.driver_number;
    if(!newStintsByDriver.has(dn))newStintsByDriver.set(dn,[]);
    newStintsByDriver.get(dn).push(s);
  }
  for(const[dn,list]of newStintsByDriver){
    if(list.length)lastStintMap.set(dn,list);
  }

  for(const p of positions){
    const dn=p.driver_number;
    if(!latestPos.has(dn)||new Date(p.date)>new Date(latestPos.get(dn).date))latestPos.set(dn,p);
  }

  for(const iv of intervals){
    const dn=iv.driver_number;
    if(!latestIv.has(dn)||new Date(iv.date)>new Date(latestIv.get(dn).date))latestIv.set(dn,iv);
  }

  const latestPit=new Map(cachedPitStops);
  for(const p of pitStops){
    const dn=p.driver_number;
    if(!latestPit.has(dn)||new Date(p.pit_in_time)>new Date(latestPit.get(dn).pit_in_time))latestPit.set(dn,p);
  }
  cachedPitStops=latestPit;

  if(weather&&weather.length)cachedWeather=weather;
  if(raceControl&&raceControl.length)cachedRaceControl=mergeRCMessages(cachedRaceControl,raceControl);
}

function mergeRCMessages(existing,fresh){
  const seen=new Set(existing.map(m=>`${m.date}|${m.message}`));
  const merged=[...existing];
  for(const m of fresh){
    const key=`${m.date}|${m.message}`;
    if(!seen.has(key)){merged.push(m);seen.add(key)}
  }
  return merged;
}

// Renders the driver list from whatever is currently in the persistent
// caches — safe to call repeatedly after each fetch-and-merge round.
function renderSessionData(){
  const laps=[...cachedLaps.values()].sort((a,b)=>a.lap_number-b.lap_number);

  updateWeather(cachedWeather);
  updateRaceControl(cachedRaceControl);

  const bestLapMap=new Map(),lastLapMap=new Map();
  overallBestLap=Infinity;overallBestDriver=null;

  for(const lap of laps){
    const dn=lap.driver_number,dur=lap.lap_duration;
    if(dur&&dur>0){
      if(!bestLapMap.has(dn)||dur<bestLapMap.get(dn).duration)bestLapMap.set(dn,{duration:dur,lapNum:lap.lap_number});
      if(dur<overallBestLap){overallBestLap=dur;overallBestDriver=dn}
    }
    // Track the most recent lap overall (for lap time/tyre age), but track
    // each sector's most recent NON-NULL value independently — OpenF1 can
    // post a driver's final lap before every sector has finished timing
    // (S3 in particular completes last, at the finish line), so tying every
    // sector to one single "last lap" object can leave a real, earlier value
    // blank even though it's sitting right there in the data.
    const prev=lastLapMap.get(dn)||{};
    lastLapMap.set(dn,{
      duration:dur,
      lapNum:lap.lap_number,
      s1:lap.duration_sector_1||prev.s1||null,
      s2:lap.duration_sector_2||prev.s2||null,
      s3:lap.duration_sector_3||prev.s3||null
    });
  }

  const vals=l=>[...lastLapMap.values()].map(x=>x[l]).filter(Boolean);
  const bestS1=Math.min(...vals('s1'));
  const bestS2=Math.min(...vals('s2'));
  const bestS3=Math.min(...vals('s3'));

  const stintMap=lastStintMap;

  let leaderDn=null;
  for(const[dn,iv]of latestIv){if(iv.gap_to_leader===0||iv.gap_to_leader===null||iv.gap_to_leader==='0'){leaderDn=dn;break}}
  if(!leaderDn)for(const[dn,p]of latestPos){if(p.position===1){leaderDn=dn;break}}

  const latestPit=cachedPitStops;

  const container=document.getElementById('driverList');
  const sorted=[...positionOrder].sort((a,b)=>(latestPos.get(a)?.position??99)-(latestPos.get(b)?.position??99));
  for(const dn of sorted){const el=document.getElementById(`row-${dn}`);if(el)container.appendChild(el)}

  const elimThreshold=getElimThreshold();

  for(const dn of positionOrder){
    const pos=latestPos.get(dn)?.position??null;
    const iv=latestIv.get(dn);
    const lastLap=lastLapMap.get(dn);
    const bestLap=bestLapMap.get(dn);
    const pit=latestPit.get(dn);
    const driverStints=stintMap.get(dn)||[];
    const lapNum=lastLap?.lapNum||0;

    const row=document.getElementById(`row-${dn}`);
    if(row&&elimThreshold&&pos){
      row.classList.toggle('eliminated',pos>=elimThreshold+5);
      row.classList.toggle('elim-danger',pos>=elimThreshold&&pos<elimThreshold+5);
    }

    const posEl=document.getElementById(`pos-${dn}`);if(posEl){posEl.textContent=pos??'—';posEl.className=`pos${pos===1?' p1':pos===2?' p2':pos===3?' p3':''}`}
    const gapEl=document.getElementById(`gap-${dn}`);if(gapEl){if(dn===leaderDn){gapEl.textContent='LEADER';gapEl.className='gap-leader leader'}else if(iv?.gap_to_leader!=null){const g=iv.gap_to_leader;gapEl.textContent=typeof g==='number'?`+${g.toFixed(3)}`:String(g);gapEl.className='gap-leader'}else{gapEl.textContent='—';}}
    const aheadEl=document.getElementById(`ahead-${dn}`);if(aheadEl){if(iv?.interval!=null&&dn!==leaderDn){const g=iv.interval;aheadEl.textContent=`△ ${typeof g==='number'?g.toFixed(3):String(g)}`}else aheadEl.textContent='';}
    const lastEl=document.getElementById(`last-${dn}`);if(lastEl)lastEl.textContent=lastLap?fmtTime(lastLap.duration):'—';
    const bestEl=document.getElementById(`best-${dn}`);if(bestEl){bestEl.textContent=bestLap?fmtTime(bestLap.duration):'—';bestEl.className=dn===overallBestDriver?'lap-cell purple':'lap-cell';}
    if(lastLap){
      setSector(`s1-${dn}`,lastLap.s1,bestS1);
      setSector(`s2-${dn}`,lastLap.s2,bestS2);
      setSector(`s3-${dn}`,lastLap.s3,bestS3);
    }
    
    updateTyreCol(dn,driverStints,lapNum);
    updatePit(dn,pit);
  }
  updateElimDivider(sorted,elimThreshold);
  generateFeed(laps,latestPos,latestIv,[...cachedPitStops.values()],stintMap,cachedRaceControl);

  const now=new Date();
  if(sessionEnd&&now>sessionEnd)setSelectStatus('done');
  else if(sessionStart&&now>=sessionStart)setSelectStatus('live');
}

// Orchestrates the one-shot load: fetch+merge, render, then up to two more
// fetch+merge+render rounds a few seconds apart to backfill anything OpenF1
// hadn't finished posting on the first pass. Each round only fills gaps
// (see fetchAndMergeSessionData) — it never discards data already fetched.
// Stops after 3 rounds regardless of completeness, so this can't turn into
// the old indefinite polling loop.
async function loadSessionData(){
  if(!sessionKey)return;
  const thisSessionKey=sessionKey;
  setSelectStatus('loading');

  for(let round=0;round<3;round++){
    if(sessionKey!==thisSessionKey)return; // user switched sessions mid-backfill
    await fetchAndMergeSessionData();
    renderSessionData();
    if(round<2)await new Promise(r=>setTimeout(r,3000));
  }
}

function getCurrentTyre(stints,lapNum){
  if(!stints.length||!lapNum)return{compound:null,age:0};
  let current=null;
  for(const s of stints){if(lapNum>=s.lap_start&&lapNum<=(s.lap_end||9999)){current=s;break}}
  if(!current)current=stints.reduce((a,b)=>a.lap_start>b.lap_start?a:b);
  return{compound:current.compound||null,age:Math.max(1,lapNum-current.lap_start+1)};
}

function getElimThreshold(){if(!sessionType)return null;if(sessionType.toLowerCase().includes('qualif')||sessionType.toLowerCase().includes('sprint qual'))return 16;return null;}
function updateElimDivider(sorted,threshold){let existing=document.getElementById('elimDivider');if(!threshold){if(existing)existing.classList.remove('show');return}if(!existing){existing=document.createElement('div');existing.id='elimDivider';existing.className='elim-divider';existing.textContent='── ELIMINATION ZONE ──';document.getElementById('driverList').appendChild(existing);}existing.classList.add('show');const container=document.getElementById('driverList');const firstElim=sorted.find(dn=>{const r=document.getElementById(`row-${dn}`);return r&&r.classList.contains('eliminated')});if(firstElim){const el=document.getElementById(`row-${firstElim}`);if(el)container.insertBefore(existing,el)}}
function setSector(id,val,bestVal){const el=document.getElementById(id);if(!el)return;if(!val){el.textContent='—';el.className='sector-val';return;}el.textContent=fmtTime(val);el.className=(isFinite(bestVal)&&val===bestVal)?'sector-val purple':'sector-val';}

function updateTyreCol(dn,stints,lapNum){const el=document.getElementById(`tyreCol-${dn}`);if(!el)return;const{compound,age}=getCurrentTyre(stints,lapNum);if(!compound){el.innerHTML='<span style="color:var(--muted);font-family:var(--mono);font-size:9px">—</span>';return}const col=tyreColor(compound);el.innerHTML=`<div class="tyre-icon" style="color:${col};background:${col}22">${tyreLetter(compound)}</div><span class="tyre-age-col" style="color:${col}">${String(age).padStart(2,'0')}</span>`;}
function updatePit(dn,pit){const el=document.getElementById(`pit-${dn}`);if(!el)return;if(!pit){el.innerHTML='';return}const inTime=pit.pit_in_time,outTime=pit.pit_out_time,dur=pit.pit_duration??pit.stop_duration;if(inTime&&!outTime){el.innerHTML='<span class="chip chip-pit">PIT</span>'}else if(outTime&&dur!=null){const key=`${dn}-${inTime}`;if(!pitFlash.has(key)){el.innerHTML=`<span class="chip chip-out">${parseFloat(dur).toFixed(1)}s</span>`;const tid=setTimeout(()=>{const e=document.getElementById(`pit-${dn}`);if(e)e.innerHTML='';pitFlash.delete(key)},8000);pitFlash.set(key,tid);}} else el.innerHTML='';}
function updateWeather(data){
  // Weather strip removed — session has already ended, live conditions
  // aren't meaningful context for post-session analysis. This function is
  // kept as a no-op call site (still invoked from renderSessionData) so
  // nothing else needs to change, but it no longer renders anything.
}
function updateRaceControl(data){
  allRCMessages=data;
  activeYellowSectors.clear();
  let scActive=false;
  
  // Track session ended state
  const isQualifying = sessionType.toLowerCase().includes('qualif') || sessionType.toLowerCase().includes('sprint qual');
  
  for(const m of data){
    const f=(m.flag||'').toUpperCase(),msg=(m.message||'').toUpperCase();
    if(f==='YELLOW'&&m.sector)activeYellowSectors.add(m.sector);
    if(f==='SC'||msg.includes('SAFETY CAR'))scActive=true;
    if(f==='GREEN')activeYellowSectors.clear();
    
    // Detect chequered flag for qualifying phases
    if(isQualifying && (f==='CHEQUERED' || msg.includes('CHEQUERED'))){
      chequeredFlagCount++;
      sessionEnded = true;
      
      if(chequeredFlagCount === 1 && qPhaseEliminatedData.q1){
        addToFeedBuffer('c-info', qPhaseEliminatedData.q1);
      } else if(chequeredFlagCount === 2 && qPhaseEliminatedData.q2){
        addToFeedBuffer('c-info', qPhaseEliminatedData.q2);
      } else if(chequeredFlagCount === 3){
        // Get pole position from final order
        if(latestPos.size > 0){
          const sortedPos = [...latestPos.entries()].sort((a,b)=>a[1]?.position??99 - b[1]?.position??99);
          if(sortedPos.length >= 3){
            const p1 = sortedPos[0];
            const p2 = sortedPos[1];
            const p3 = sortedPos[2];
            const p1Driver = driverMeta.get(p1[0])?.acronym || '#?';
            const p2Driver = driverMeta.get(p2[0])?.acronym || '#?';
            const p3Driver = driverMeta.get(p3[0])?.acronym || '#?';
            const poleTime = overallBestLap !== Infinity ? fmtTime(overallBestLap) : '?';
            // Get gaps from best laps if available
            const qualBest = new Map();
            for(const lap of cachedLaps.values()){
              if(lap.lap_duration && lap.lap_duration > 0){
                if(!qualBest.has(lap.driver_number) || lap.lap_duration < qualBest.get(lap.driver_number).duration){
                  qualBest.set(lap.driver_number, {duration: lap.lap_duration, lap: lap.lap_number});
                }
              }
            }
            const bestOrder = [...qualBest.entries()].sort((a,b)=>a[1].duration - b[1].duration);
            if(bestOrder.length >= 3){
              const poleGap2 = (bestOrder[1][1].duration - bestOrder[0][1].duration).toFixed(3);
              const poleGap3 = (bestOrder[2][1].duration - bestOrder[0][1].duration).toFixed(3);
              addToFeedBuffer('c-fastest', `🏆 POLE POSITION: ${driverTag(bestOrder[0][0])} <b style="color:var(--purple)">${fmtTime(bestOrder[0][1].duration)}</b>. ${driverTag(bestOrder[1][0])} +${poleGap2}s. ${driverTag(bestOrder[2][0])} +${poleGap3}s.`);
            } else {
              addToFeedBuffer('c-fastest', `🏆 POLE POSITION: ${driverTag(p1[0])}. ${driverTag(p2[0])} P2. ${driverTag(p3[0])} P3.`);
            }
          }
        }
        addToFeedBuffer('c-info', `Q3 ENDED. Pole position determined.`);
      }
    }
  }
  if(scActive)setSelectStatus('sc');
  if(!data.length)return;
  const last=data[data.length-1];
  if((last.flag||'').toUpperCase()==='RED')setSelectStatus('red');
  // RC bar removed from the UI — race control messages are still fully
  // processed above (allRCMessages, yellow sectors, SC/red flag status)
  // for use in the INSIGHTS export and stint outlier exclusion; they're
  // just no longer rendered as a persistent banner across every tab.
}

let pendingBufferEntries = [];
function addToFeedBuffer(category, text){
  pendingBufferEntries.push({
    ts: Date.now(),
    sortKey: Date.now(),
    isoTime: new Date().toISOString(),
    timeLabel: new Date().toLocaleTimeString().slice(0,5),
    category: category,
    text: text,
    isRC: false,
    isLapMarker: false
  });
}

function generateFeed(laps,latestPos,latestIv,allPitStops,stintMap,raceControl){
  const isRace=sessionType.toLowerCase().includes('race');
  const isFP=sessionType.toLowerCase().includes('practice');
  const isQual=sessionType.toLowerCase().includes('qualif')||sessionType.toLowerCase().includes('sprint qual');
  const newEntries=[];

  const lapsByNumber=new Map();
  for(const lap of laps){
    if(!lapsByNumber.has(lap.lap_number))lapsByNumber.set(lap.lap_number,[]);
    lapsByNumber.get(lap.lap_number).push(lap);
  }

  const allLapsByDriver=new Map();
  for(const lap of laps){
    const dn=lap.driver_number;
    if(!allLapsByDriver.has(dn))allLapsByDriver.set(dn,[]);
    allLapsByDriver.get(dn).push(lap);
  }

  const lapNums=[...lapsByNumber.keys()].sort((a,b)=>a-b);

  for(const lapNum of lapNums){
    if(processedLaps.has(lapNum))continue;
    const lapDrivers=lapsByNumber.get(lapNum);
    if(lapDrivers.length<Math.min(3,driverMeta.size*0.3))continue;

    processedLaps.add(lapNum);
    if(lapNum>lastKnownLapNum)lastKnownLapNum=lapNum;

    const lapTimeISO=lapDrivers.find(l=>l.date_start)?.date_start||null;
    const lapTimeLabel=lapTimeISO?fmtTimeLabel(lapTimeISO):`L${lapNum}`;
    const lapSortKey=lapTimeISO?new Date(lapTimeISO).getTime():lapNum*100000;

    const posAtLap=new Map();
    for(const[dn]of latestPos)posAtLap.set(dn,latestPos.get(dn)?.position??99);

    // LAP SUMMARY - ALL SESSION TYPES
    const sortedPos=[...posAtLap.entries()].sort((a,b)=>a[1]-b[1]);
    const top5Names=sortedPos.slice(0,5).map(([dn])=>{
      const m=driverMeta.get(dn);return m?.acronym||String(dn);
    }).join(', ');
    
    newEntries.push({
      lap:lapNum,ts:lapSortKey,sortKey:lapSortKey,
      isoTime:lapTimeISO||'',timeLabel:lapTimeLabel,
      category:'c-lap',isLapMarker:true,
      isRC:false,
      text:`LAP ${lapNum} — ${top5Names}`
    });

    // Position changes
    const leaderNow=sortedPos[0]?.[0];
    const leaderPrev=[...lastKnownPositions.entries()].find(([,p])=>p===1)?.[0];
    if(leaderPrev&&leaderNow&&leaderNow!==leaderPrev){
      newEntries.push({
        lap:lapNum,ts:lapSortKey+100,sortKey:lapSortKey+100,
        isoTime:lapTimeISO||'',timeLabel:lapTimeLabel,
        category:'c-info',isRC:false,
        text:`${driverTag(leaderNow)} takes the lead`
      });
    }
    
    for(const[dn,pos]of posAtLap){
      const prev=lastKnownPositions.get(dn);
      if(!prev||prev===pos)continue;
      const gain=prev-pos;
      if(gain>0){
        newEntries.push({
          lap:lapNum,ts:lapSortKey+200+dn,sortKey:lapSortKey+200+dn,
          isoTime:lapTimeISO||'',timeLabel:lapTimeLabel,
          category:'c-info',isRC:false,
          text:`${driverTag(dn)} gains ${gain} to P${pos}`
        });
      } else if(gain<0){
        newEntries.push({
          lap:lapNum,ts:lapSortKey+200+dn,sortKey:lapSortKey+200+dn,
          isoTime:lapTimeISO||'',timeLabel:lapTimeLabel,
          category:'c-info',isRC:false,
          text:`${driverTag(dn)} drops to P${pos}`
        });
      }
    }

    for(const[dn,pos]of posAtLap)lastKnownPositions.set(dn,pos);

    // QUALIFYING: Personal best lap time
    if(isQual && !sessionEnded){
      for(const lap of lapDrivers){
        if(lap.lap_duration&&lap.lap_duration>0){
          const driverLaps=allLapsByDriver.get(lap.driver_number)||[];
          const prevBest=driverLaps.filter(l=>l.lap_duration&&l.lap_number<lap.lap_number)
            .reduce((best,l)=>Math.min(best,l.lap_duration),Infinity);
          if(prevBest!==Infinity && lap.lap_duration<prevBest){
            newEntries.push({
              lap:lapNum,ts:lapSortKey+250+lap.driver_number,sortKey:lapSortKey+250+lap.driver_number,
              isoTime:lapTimeISO||'',timeLabel:lapTimeLabel,
              category:'c-fastest',isRC:false,
              text:`${driverTag(lap.driver_number)} personal best — ${fmtTime(lap.lap_duration)}`
            });
          }
        }
      }
      
      // Capture elimination data for Q1 and Q2 phases (only if not already captured)
      if(sortedPos.length >= 20 && !q1Captured){
        const eliminatedQ1 = sortedPos.slice(15,20).map(([dn])=>driverMeta.get(dn)?.acronym||'?');
        const fastestEliminatedQ1 = sortedPos[15]?.[0];
        const p15Pos = sortedPos[14]?.[1];
        const p16Pos = sortedPos[15]?.[1];
        const gapToP15Q1 = p15Pos - p16Pos;
        if(eliminatedQ1.length === 5 && gapToP15Q1 > 0){
          qPhaseEliminatedData.q1 = `Q1 ENDED. ELIMINATED IN Q1: ${eliminatedQ1.join(', ')}. ${driverTag(fastestEliminatedQ1)} missed Q2 by ${Math.abs(gapToP15Q1).toFixed(3)}s.`;
          q1Captured = true;
        }
      }
      
      if(sortedPos.length >= 15 && !q2Captured && q1Captured){
        const eliminatedQ2 = sortedPos.slice(10,15).map(([dn])=>driverMeta.get(dn)?.acronym||'?');
        const fastestEliminatedQ2 = sortedPos[10]?.[0];
        const p10Pos = sortedPos[9]?.[1];
        const p11Pos = sortedPos[10]?.[1];
        const gapToP10Q2 = p10Pos - p11Pos;
        if(eliminatedQ2.length === 5 && gapToP10Q2 > 0){
          qPhaseEliminatedData.q2 = `Q2 ENDED. ELIMINATED IN Q2: ${eliminatedQ2.join(', ')}. ${driverTag(fastestEliminatedQ2)} missed Q3 by ${Math.abs(gapToP10Q2).toFixed(3)}s.`;
          q2Captured = true;
        }
      }
    }

    // RACE: Fastest lap (overall session best)
    if(isRace){
      for(const lap of lapDrivers){
        if(lap.lap_duration&&lap.lap_duration>0){
          if(lap.lap_duration<overallBestLap){
            overallBestLap=lap.lap_duration;
            overallBestDriver=lap.driver_number;
            newEntries.push({
              lap:lapNum,ts:lapSortKey+300,sortKey:lapSortKey+300,
              isoTime:lapTimeISO||'',timeLabel:lapTimeLabel,
              category:'c-fastest',isRC:false,
              text:`${driverTag(lap.driver_number)} goes quickest — ${fmtTime(lap.lap_duration)}`
            });
          }
        }
      }
    }
    
    // RACE: Final lap
    if(isRace){
      const totalLaps=lapNums[lapNums.length-1];
      if(lapNum===totalLaps){
        const leaderNowFinal=sortedPos[0]?.[0];
        newEntries.push({
          lap:lapNum,ts:lapSortKey+500,sortKey:lapSortKey+500,
          isoTime:lapTimeISO||'',timeLabel:lapTimeLabel,
          category:'c-fastest',isRC:false,
          text:`🏁 FINAL LAP — ${driverTag(leaderNowFinal)} leads`
        });
      }
    }
  }

  // PIT STOPS
  for(const pit of allPitStops){
    const dn=pit.driver_number;
    const pitKey=`pit-${dn}-${pit.pit_in_time}`;
    const lapIn=pit.lap_number||lastKnownLapNum||0;
    const lapOut=lapIn+1;
    const pitInTime=pit.pit_in_time?new Date(pit.pit_in_time).getTime():0;
    const pitOutTime=pit.pit_out_time?new Date(pit.pit_out_time).getTime():0;

    if(pit.pit_in_time&&!processedPits.has(pitKey+'in')){
      const pos=lastKnownPositions.get(dn)??'?';
      if(pos!=='?'||lastKnownLapNum>0){
        processedPits.add(pitKey+'in');
        newEntries.push({
          lap:lapIn,ts:pitInTime,sortKey:pitInTime,
          isoTime:pit.pit_in_time||'',timeLabel:fmtTimeLabel(pit.pit_in_time),
          category:'c-strategy',isRC:false,
          text:`${driverTag(dn)} pits from P${pos}`
        });
      }
    }

    if(pit.pit_out_time&&!processedPits.has(pitKey+'out')){
      const dur=pit.pit_duration??pit.stop_duration;
      const pos=lastKnownPositions.get(dn)??'?';
      const ds=stintMap.get(dn)||[];
      const{compound}=getCurrentTyre(ds,lapOut);
      const tyreStr=compound?` on ${tyreLetter(compound)}`:'';
      if(pos!=='?'||lastKnownLapNum>0){
        processedPits.add(pitKey+'out');
        newEntries.push({
          lap:lapOut,ts:pitOutTime+50,sortKey:pitOutTime+50,
          isoTime:pit.pit_out_time||'',timeLabel:fmtTimeLabel(pit.pit_out_time),
          category:'c-strategy',isRC:false,
          text:`${driverTag(dn)} rejoins P${pos}${tyreStr}`
        });
      }
    }
  }

  // ========== SECTOR ANOMALY REPORTING WITH MASS INCIDENT SUPPRESSION ==========
  // Only report anomalies if session has not ended (no cooldown lap spam)
  let criticalLossCount = 0;
  let criticalLossDrivers = new Set();
  
  for(const lapNum of lapNums){
    const lapDrivers = lapsByNumber.get(lapNum) || [];
    if(lapDrivers.length < Math.min(3, driverMeta.size*0.3)) continue;
    
    const recentRC = allRCMessages.filter(m => (m.lap_number||0) >= lapNum-5);
    const flagActive = activeYellowSectors.size > 0 ||
      recentRC.some(m => {
        const f = (m.flag||'').toUpperCase(), msg = (m.message||'').toUpperCase();
        return f === 'VSC' || msg.includes('SAFETY CAR DEPLOYED') || msg.includes('VIRTUAL SAFETY CAR DEPLOYED');
      });
    
    const lapTimeISO = lapDrivers.find(l=>l.date_start)?.date_start||null;
    const lapSortKey = lapTimeISO ? new Date(lapTimeISO).getTime() : lapNum*100000;
    const lapTimeLabel = lapTimeISO ? fmtTimeLabel(lapTimeISO) : `L${lapNum}`;
    
    let lapCriticalCount = 0;
    
    // Skip anomaly reporting if session has ended (cooldown laps after chequered flag)
    if(!sessionEnded && !flagActive && lapNum > massIncidentSuppressUntilLap){
      for(const lap of lapDrivers){
        const dn = lap.driver_number;
        if(!lap.duration_sector_1 && !lap.duration_sector_2 && !lap.duration_sector_3) continue;
        const history = lastLapTimes.get(dn) || [];
        
        for(let si = 0; si < 3; si++){
          const val = [lap.duration_sector_1, lap.duration_sector_2, lap.duration_sector_3][si];
          if(!val) continue;
          const prevVals = history.map(h => h[si]).filter(Boolean);
          if(prevVals.length >= 3){
            const avg = prevVals.reduce((a,b) => a+b, 0) / prevVals.length;
            const loss = val - avg;
            
            if(loss >= 0.5){
              // Count critical losses (2.0s+) for mass incident detection
              if(loss >= 2.0){
                lapCriticalCount++;
                criticalLossDrivers.add(dn);
              }
              
              // Only report individual incidents if NOT in mass incident suppression mode
              if(!massIncidentActive || loss < 2.0){
                let severityText = '';
                if(loss >= 2.0){
                  severityText = `${driverTag(dn)} has a critical issue in S${si+1}, lost ${loss.toFixed(2)}s. Major car problem or off-track.`;
                } else if(loss >= 1.0){
                  severityText = `${driverTag(dn)} has a significant issue in S${si+1}, lost ${loss.toFixed(2)}s. Car issue or driver error.`;
                } else if(loss >= 0.5){
                  severityText = `${driverTag(dn)} had a small moment in S${si+1}, lost ${loss.toFixed(2)}s.`;
                }
                
                if(severityText){
                  newEntries.push({
                    lap:lapNum, ts:lapSortKey + si*10, sortKey:lapSortKey + si*10,
                    isoTime:lapTimeISO||'', timeLabel:lapTimeLabel,
                    category:'c-incident', isRC:false,
                    text: severityText
                  });
                }
              }
            }
          }
        }
        
        const entry = [lap.duration_sector_1, lap.duration_sector_2, lap.duration_sector_3];
        history.push(entry);
        if(history.length > 5) history.shift();
        lastLapTimes.set(dn, history);
      }
      
      // MASS INCIDENT DETECTION: 3+ drivers losing 2.0s+ in same lap
      if(lapCriticalCount >= 3 && !massIncidentActive){
        massIncidentActive = true;
        massIncidentSuppressUntilLap = lapNum + 5;
        
        newEntries.push({
          lap:lapNum, ts:lapSortKey + 450, sortKey:lapSortKey + 450,
          isoTime:lapTimeISO||'', timeLabel:lapTimeLabel,
          category:'c-sc', isRC:false,
          text: `⚠️ Multiple drivers affected by a track incident, losing critical time. Checking race control.`
        });
        
        // Cross-reference with race control messages for this lap
        const rcThisLap = allRCMessages.filter(m => {
          const rcLap = m.lap_number || 0;
          return rcLap === lapNum || rcLap === lapNum - 1 || rcLap === lapNum + 1;
        });
        
        for(const rc of rcThisLap){
          const rcFlag = (rc.flag || '').toUpperCase();
          const rcMsg = rc.message || '';
          if(rcFlag === 'YELLOW' || rcMsg.includes('YELLOW')){
            newEntries.push({
              lap:lapNum, ts:lapSortKey + 460, sortKey:lapSortKey + 460,
              isoTime:rc.date||'', timeLabel:fmtTimeLabel(rc.date),
              category:'c-rc-warn', isRC:true,
              text: `RACE CONTROL: ${rcMsg}`
            });
          } else if(rcFlag === 'SC' || rcMsg.includes('SAFETY CAR')){
            newEntries.push({
              lap:lapNum, ts:lapSortKey + 470, sortKey:lapSortKey + 470,
              isoTime:rc.date||'', timeLabel:fmtTimeLabel(rc.date),
              category:'c-rc-red', isRC:true,
              text: `RACE CONTROL: ${rcMsg}`
            });
          }
        }
      }
    } else {
      // During flag active or suppression, just update rolling history without reporting
      for(const lap of lapDrivers){
        const dn = lap.driver_number;
        const h = lastLapTimes.get(dn) || [];
        h.push([lap.duration_sector_1, lap.duration_sector_2, lap.duration_sector_3]);
        if(h.length > 5) h.shift();
        lastLapTimes.set(dn, h);
      }
    }
  }
  
  // Reset mass incident state after 5 laps of no incidents
  if(massIncidentActive && lastKnownLapNum > massIncidentSuppressUntilLap){
    massIncidentActive = false;
  }

  // Combine with race control messages
  const rcEntries=allRCMessages.map(m=>{
    let formattedText = m.message||'';
    const flag = (m.flag||'').toUpperCase();
    if(flag === 'RED'){
      formattedText = `<strong class="red">🔴 RED FLAG</strong> — ${formattedText}`;
    } else if(flag === 'YELLOW'){
      formattedText = `<strong class="yellow">🟡 YELLOW FLAG</strong> — ${formattedText}`;
    } else if(flag === 'SC'){
      formattedText = `<strong class="yellow">🟡 SAFETY CAR</strong> — ${formattedText}`;
    } else if(flag === 'VSC'){
      formattedText = `<strong class="yellow">🟡 VIRTUAL SAFETY CAR</strong> — ${formattedText}`;
    }
    return {
      ts:new Date(m.date).getTime(),
      sortKey:new Date(m.date).getTime(),
      isoTime:m.date||'',
      timeLabel:fmtTimeLabel(m.date),
      category:m.flag==='RED'?'c-rc-red':(m.flag==='YELLOW'||m.flag==='SC'||m.flag==='VSC')?'c-rc-warn':'c-rc',
      text:formattedText,
      isRC:true
    };
  });

  const allEntries=[...newEntries,...rcEntries,...pendingBufferEntries];
  pendingBufferEntries = [];
  
  if(!allEntries.length)return;

  allEntries.sort((a,b)=>a.sortKey-b.sortKey);
  
  // Merge with existing feed entries, avoid duplicates
  const existingKeys=new Set(feedEntries.map(e=>`${e.isoTime}-${e.text.substring(0,50)}`));
  for(const e of allEntries){
    const key=`${e.isoTime}-${e.text.substring(0,50)}`;
    if(!existingKeys.has(key)){
      feedEntries.push(e);
      existingKeys.add(key);
    }
  }
  
  // Sort feed entries chronologically
  feedEntries.sort((a,b)=>a.sortKey-b.sortKey);
  
  if(activeTab==='feed')renderFeed();
}

function renderFeed(){
  const scroll=document.getElementById('feedScroll');
  if(!scroll)return; // FEED tab removed in favor of INSIGHTS; feed data still collected for use there
  if(!feedEntries.length&&!allRCMessages.length){
    scroll.innerHTML='<div class="feed-placeholder">FEED WILL POPULATE WHEN SESSION IS SELECTED</div>';
    return;
  }

  let entries=[];
  if(activeFeedTab==='all')entries=[...feedEntries];
  else if(activeFeedTab==='track')entries=feedEntries.filter(e=>!e.isRC);
  else if(activeFeedTab==='rc')entries=feedEntries.filter(e=>e.isRC);

  if(!entries.length){
    scroll.innerHTML='<div class="feed-placeholder">NO DATA FOR THIS VIEW</div>';
    return;
  }

  const atBottom=scroll.scrollHeight-scroll.scrollTop<=scroll.clientHeight+100;
  scroll.innerHTML=entries.map(e=>{
    if(e.isLapMarker){
      return`<div class="feed-lap-marker">${e.text}</div>`;
    }
    const category=e.category||(e.isRC?getRCCategoryFromFlag(e.flag):'c-info');
    return`<div class="feed-entry ${category}">
      <span class="feed-time">${e.timeLabel}</span>
      <div class="feed-bar"></div>
      <span class="feed-text">${e.text}</span>
    </div>`;
  }).join('');

  if(atBottom)scroll.scrollTop=scroll.scrollHeight;
}

function getRCCategoryFromFlag(flag){
  if(!flag)return'c-rc';
  const f=flag.toUpperCase();
  if(f==='RED')return'c-rc-red';
  if(f==='YELLOW'||f==='SC'||f==='VSC')return'c-rc-warn';
  return'c-rc';
}

function closeModal(id){document.getElementById(id).classList.remove('open')}

async function showLapHistory(dn){
  if(!sessionKey)return;
  const meta=driverMeta.get(dn);if(!meta)return;
  currentDriverDn=dn;
  currentDriverTab='laps';
  document.getElementById('lapModalTitle').textContent=`${meta.acronym} · ${meta.fullName}`;
  document.getElementById('lapModalBody').innerHTML='<div class="placeholder" style="padding:20px">LOADING...</div>';
  document.getElementById('lapModal').classList.add('open');
  ['Laps','Stints','Braking','Speed'].forEach(t=>{
    const btn=document.getElementById(`subtab${t}`);
    if(btn)btn.classList.toggle('active',t.toLowerCase()==='laps');
  });

  const[laps,stints]=await Promise.all([
    api(`laps?session_key=${sessionKey}&driver_number=${dn}`),
    api(`stints?session_key=${sessionKey}&driver_number=${dn}`)
  ]);
  laps.sort((a,b)=>a.lap_number-b.lap_number);
  cachedDriverLaps=laps;
  cachedDriverStints=stints;
  renderDriverTab('laps');
}

function switchDriverTab(tab){
  currentDriverTab=tab;
  ['Laps','Stints','Braking','Speed'].forEach(t=>{
    const btn=document.getElementById(`subtab${t}`);
    if(btn)btn.classList.toggle('active',t.toLowerCase()===tab);
  });
  renderDriverTab(tab);
}

function renderDriverTab(tab){
  const body=document.getElementById('lapModalBody');
  if(!cachedDriverLaps){body.innerHTML='<div class="placeholder" style="padding:20px">NO DATA</div>';return}

  if(tab==='laps'){
    let driverBest=Infinity;
    for(const l of cachedDriverLaps)if(l.lap_duration&&l.lap_duration<driverBest)driverBest=l.lap_duration;
    function getStint(n){return(cachedDriverStints||[]).find(s=>n>=s.lap_start&&n<=(s.lap_end||999))}
    function tc(c){if(!c)return'';const u=c.toUpperCase();if(u.includes('SOFT'))return't-soft';if(u.includes('MED'))return't-med';if(u.includes('HARD'))return't-hard';if(u.includes('INTER'))return't-inter';if(u.includes('WET'))return't-wet';return''}
    let rows='';
    for(const lap of cachedDriverLaps){
      const stint=getStint(lap.lap_number);
      const compound=stint?.compound||'';
      const isOB=lap.lap_duration===overallBestLap;
      const isPB=lap.lap_duration===driverBest&&!isOB;
      const lapCls=isOB?'ob':isPB?'pb':'lt';
      rows+=`<tr><td class="td">${lap.lap_number}</td><td class="${lapCls}">${fmtTime(lap.lap_duration)}<\/td><td>${lap.duration_sector_1?lap.duration_sector_1.toFixed(3):'—'}<\/td><td>${lap.duration_sector_2?lap.duration_sector_2.toFixed(3):'—'}<\/td><td>${lap.duration_sector_3?lap.duration_sector_3.toFixed(3):'—'}<\/td><td class="${tc(compound)}">${tyreLetter(compound)}<\/td><\/tr>`;
    }
    body.innerHTML=`<table class="lap-table"><thead><tr><th>LAP</th><th>TIME</th><th>S1</th><th>S2</th><th>S3</th><th>C</th><\/tr><\/thead><tbody>${rows||'<tr><td colspan="6" style="color:var(--muted);padding:10px 0">No data<\/tr>'}<\/tbody><\/table>`;
  }
  else if(tab==='stints'){
    const stints=cachedDriverStints||[];
    if(!stints.length){body.innerHTML='<div class="placeholder" style="padding:20px">NO STINT DATA</div>';return}
    stints.sort((a,b)=>a.lap_start-b.lap_start);

    const stintStats=computeStintStats(stints,cachedDriverLaps)
      .map((s,i)=>({...stints[i],avg:s.avg_lap,deg:s.deg_per_lap,laps:s.laps,excludedOutliers:s.excluded_outlier_laps}))
      .filter(s=>s.avg);

    let bestCompound=null,bestDeg=Infinity;
    for(const s of stintStats){if(s.deg<bestDeg&&s.compound){bestDeg=s.deg;bestCompound=s.compound}}

    let html='';
    for(const s of stintStats){
      const col=tyreColor(s.compound||'');
      const letter=tyreLetter(s.compound||'');
      const degStr=s.deg>=0?`+${s.deg.toFixed(3)}`:`${s.deg.toFixed(3)}`;
      const isBest=s.compound===bestCompound;
      html+=`<div class="stint-card" style="border-left-color:${col}">
        <div class="stint-head">
          <span class="stint-compound" style="color:${col}">${letter} ${s.compound||'?'}</span>
          <span class="stint-meta">Laps ${s.lap_start}–${s.lap_end||'?'} · ${s.laps} laps${s.excludedOutliers?` · ${s.excludedOutliers} excluded`:''}</span>
          ${isBest?'<span style="font-family:var(--mono);font-size:8px;background:var(--green);color:#000;padding:2px 6px;border-radius:3px;margin-left:auto">BEST</span>':''}
        </div>
        <div class="stint-stats">
          <div class="stint-stat"><span class="stint-stat-label">AVG PACE</span><span class="stint-stat-val">${fmtTime(s.avg)}</span></div>
          <div class="stint-stat"><span class="stint-stat-label">DEG/LAP</span><span class="stint-stat-val" style="color:${s.deg>0.1?'#f87171':s.deg>0.05?'var(--yellow)':'var(--green)'}">${degStr}s</span></div>
        </div>
        ${s.excludedOutliers?`<div class="stint-meta" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--line)">Excluded ${s.excludedOutliers} lap${s.excludedOutliers>1?'s':''} from this stint's pace/deg math (pit-lane transit, red flag, or similar anomalous lap)</div>`:''}
        ${isBest?`<div class="stint-verdict">${tyreLetter(s.compound)} holding best this session. Lowest degradation rate.</div>`:''}
      </div>`;
    }

    if(stintStats.length>=2){
      const sorted=[...stintStats].sort((a,b)=>a.avg-b.avg);
      const best=sorted[0];
      let compare='';
      for(let i=1;i<sorted.length;i++){
        const diff=(sorted[i].avg-best.avg).toFixed(3);
        compare+=`<div class="analysis-row"><span class="analysis-label">${tyreLetter(best.compound||'')} vs ${tyreLetter(sorted[i].compound||'')}</span><span class="analysis-value" style="color:#f87171">+${diff}s/lap</span></div>`;
      }
      html+=`<div class="analysis-card" style="margin-top:4px"><div class="analysis-card-head"><span class="analysis-card-title">COMPOUND TIME COST</span></div><div class="analysis-card-body">${compare}</div></div>`;
    }
    body.innerHTML=html;
  }
  else if(tab==='braking'){
    body.innerHTML=`<div class="braking-placeholder">
      Braking profile data available post-session.<br><br>
      Run the FastF1 Python script after the session ends to generate telemetry analysis.
    </div>`;
  }
  else if(tab==='speed'){
    body.innerHTML=`<div class="braking-placeholder">
      Speed trace data available post-session.<br><br>
      Top speed per straight and minimum corner speed generated from FastF1 telemetry.
    </div>`;
  }
}

document.getElementById('yearSelect').addEventListener('change',loadMeetings);
document.getElementById('meetingSelect').addEventListener('change',loadSessions);
document.getElementById('sessionSelect').addEventListener('change',()=>onSessionSelected());

document.getElementById('lapModal').addEventListener('click',e=>{if(e.target===document.getElementById('lapModal'))closeModal('lapModal')});

autoLoadCurrent();
